# The live worldgen headline, restated where a reader actually looks. Same
# reason README carries `readme-restates-ow-r16-admissible`: `docs/PARITY.md`
# is the parity document, and its `## 2` table headlined a figure that had been
# superseded four times. The restatement carries the window and the floor in
# prose, and the window-match rule ties it to the measurement.
#
# `compare_keys` LISTS ALL TWELVE OF THE SOURCE'S WINDOW KEYS, and the two it
# used to omit are the point of this comment. It was written listing ten,
# `order` and `p_hide` left out, on the reasoning that `dump_order` was the
# discriminating key and was present. Rule 10 refused that and rule 10 is
# right: the same number is the same measurement, so there is no key it may
# differ on, and choosing which keys to compare is choosing what the check is
# allowed to notice. `order` in particular is not incidental here — it is
# `vanilla-first`, and the region-differ taken backwards inverts the sign of
# every number it prints, while the neighbouring chunk-order axis is what
# withdrew a published headline (§15, §16, ORACLE rule 29).
#
# ESTABLISHED BY READING BEFORE THE LIST WAS WIDENED, because completing
# `compare_keys` is only correct if the two rows really are one measurement:
# all twelve keys are byte-identical between this entry and
