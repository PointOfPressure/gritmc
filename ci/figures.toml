# WHY 8 AND NOT 16, WHICH IS WHAT THE LEDGER ACTUALLY HOLDS.
#
# A floor is not a count; it is the point below which the file has stopped
# being evidence. Sixteen prefixes are declared and every one is exercised by
# `ci/persistence-paths-falsify.sh` section 1, so an accidental deletion shows
# there long before it shows here. What this floor catches is the other shape
# — a branch that empties the list, which makes `ci/handoff.sh` stage 7 skip
# on every branch and is byte-identical in a gate log to a tree where nobody
# touched the save path.
#
# Eight is half of what is declared, which is the margin `min_targets = 96`
# uses against 106 for the same reason: a branch that legitimately retires a
# module should not have to raise a floor in the same commit, and a branch
# that has deleted half the ledger is not doing that.

