#
# Read these beside `t0-floor-targets` above, because they are the third
# distinct question about the same target list and none of the three subsumes
# another:
#
#   * `min_targets` is a floor under the ENUMERATION — an audit over an empty
#     list must not pass like a clean one.
#   * the manifest body catches a target being ADDED and left unaccounted for,
#     which no floor can do.
#   * these catch a target that is enumerated, accounted for, run by a named
#     stage — and unable to fail. When they were written that was 20 of the
#     110 targets, nine of them in T0's own bucket, so T0 declared 22 checks
#     and 13 could go red.
#
# Two granularities, deliberately. `min_red_capable_*` counts targets, and a
# target with 588 tests and a target with 1 both count as one — so it cannot
# see one test of many being deleted or `#[ignore]`d.
# `min_runnable_tests_t0` is the floor that can, and it is T0-only because T1's
# equivalent already exists as `t1-floor-tests` over a measured log.
#
# The window's command compiles nothing: the count is derived from
# `cargo metadata` plus a walk of the module tree each target roots. That model
# is calibrated against a real suite log rather than trusted — the log named
# below is 110 result blocks that the model agrees with target for target, in
# both directions, and `--calibrate` is the command that re-takes it.
