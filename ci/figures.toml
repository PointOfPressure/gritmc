[meta]
audited = "2026-08-18"
# A ledger that registered nothing would pass. These floors are the guard.
#
# RE-TIGHTENED 2026-08-18, and the reason is that they had stopped guarding
# anything. `min_figures` was 33 against a ledger of 103: a lane could have
# deleted seventy entries and stayed green, which is the failure these floors
# were written to make impossible, wearing the number that made it impossible
# when the ledger was a third of its size. Same for the other two — rule 6 fires
# on 34 entries against a floor of 3, and the window-match rule is exercised by
# 29 comparisons against a floor of 2.
#
# THEY ARE FLOORS AND NOT COUNTS, so each keeps a deliberate gap beneath the
# live number. Retiring a figure is a normal operation — ten are retired today —
# and it must not require editing this block to do it. What is refused is a
# lane that removes a tenth of the ledger without noticing, not a lane that
# retires one entry with a reason.
min_figures = 95          # 103 today
min_unquotable = 28       # 34 today; rule 6 must actually fire on something
min_compare_pairs = 24    # 29 today; the window-match rule must be exercised
# READ FOR THE FIRST TIME 2026-08-17, HAVING BEEN DECLARED AND IGNORED SINCE
# THIS LEDGER WAS WRITTEN. `git log -S min_external_artefacts` finds no commit
# in `ci/check-figures.py`'s whole history that reads this key: it was a floor
# that decided nothing, sitting in the file whose job is to stop numbers
# deciding nothing. And it read `0`, which an EMPTY ledger satisfies — so
# reading it would not have been enough on its own. Both halves are fixed.
#
# It counts figures whose `artefact` is not itself a tracked document. Those
# are the entries where rule 2 compares a number to a script, a floor table or
# a census dump rather than prose to prose, and it is the half of the check
# that catches a measurement that moved rather than a sentence that was
# edited. 73 of 93 have one. The floor sits well under that so a handful can be
# re-taken without a red, and refuses the ledger quietly becoming
# self-referential.
min_external_artefacts = 77

# THE SHARPER FAULT THE FLOOR ABOVE POINTED AT — 2026-08-17. Seven entries set
# `artefact` to the SAME file as `doc`, so rule 2 (ARTEFACT-DRIFT) re-reads the
# file rule 1 (DOC-DRIFT) already read and cannot fail independently of it. On
# those seven the measurement half of this checker's flagship guard is
# structurally vacuous, which is precisely what `ci/check-figures.py`'s own
# header says a check must never be. `artefact` pointing at a DIFFERENT
# document is fine and thirteen entries do it: a headline in one claim document
# backed by the table in another is a real cross-check.
#
# A RATCHET for the same reason `max_quotable_without_dump_order` is one.
# Closing an entry means re-deriving where its number actually came from, which
# is a measurement rather than a bookkeeping edit, and two of the seven
# (`bench-r32-rustmc-cpu`, `rss-before-fix` and its like) sit in
# `docs/BENCH.md`, which is owned by whoever is attributing the perf drift and
# carries no merge driver. The count may not RISE; each comes off as it is
# re-taken. The seven, so a re-taker can find them:
#   end-r16-n6-exact, nether-r7-ssv-core, nether-r7-basalt-core,
#   bench-r32-efficiency-target, bench-r32-rustmc-cpu, rss-fix-likeforlike,
#   rss-before-fix
max_self_artefact = 7

# RULES 4 AND 13 ONLY EVER READ A FIGURE'S OWN `doc` — 2026-08-17. A withdrawn
# figure republished in any OTHER tracked document was invisible to both, which
# is how `docs/WORKLIST.md` called the withdrawn 29,605 "the quotable figure" for
# a week and how `docs/AGENT-BRIEF.md` — read first by every agent, re-checked by
# none — came to carry four withdrawn claims. This entry's own
# `ow-r16-admissible-n2` provenance names docs/WORKLIST.md as a place the number
# is published, while no rule looked there.
#
# Measured across all 72 scanned documents: 65 mentions of a withdrawn claim
# outside its own doc, 0 on an endorsement line, and 24 individual occurrences
# with no disqualifier within 4,000 characters of THAT occurrence. (A first pass
# counted 35 by asking the question once per document, against the first
# occurrence only — the per-occurrence count is the one the checker computes and
# the one written here. Worth the note: the looser count was the more alarming
# number, and quoting it would have been quoting an instrument nobody had read.)
# Two counts, two rules. ECHO-VERDICT-MARKER is ABSOLUTE and stays at zero.
# ECHO-UNQUALIFIED is this ratchet, because the 24 are not all defects — a percentage recurring in a table, or a document stating the
# withdrawal in its own words rather than the ledger's `disqualifier` wording,
# both land here — and auditing them is a reading job across four claim
# documents rather than a bookkeeping edit. What is worth having today is that
# the count cannot RISE: every one of the 35 arrived by somebody adding a mention
# with nothing objecting.
max_unqualified_echoes = 14

# Rules 9 and 10 reach ONLY an entry that republishes its `compare_to` target's
# own number, and after 2026-08-13 no entry violates either — which is this
# checker's own warned-about shape, a rule proven by the absence of a
# violation. Two things stop it: this floor, so the restatement relation cannot
# quietly leave the ledger and take the rules with it, and
# `ci/check-figures-falsify.py`, which injects each fault and asserts the rule
# fires. There is exactly one restatement today and it is the one that was
# wrong.
min_restatements = 1

# RULE 12, AND IT IS A RATCHET RATHER THAN A FLOOR — 2026-08-13.
#
# Eleven `quotable = true` entries of a chunk-order-sensitive kind record no
# `dump_order`. `docs/DETERMINISM.md` §15 prices a wrong chunk order at 117,628
# blocks on a candidate that IS unmodified vanilla, against 3,804 for being a
# different run of the right one, so a figure that does not say which order its
# dump walked is not a weaker claim than one that does — it is an
# unconditioned one. Every one of them is listed by name in the checker's red
# output; four are `det-gradient-*` (vanilla against itself, where the harvest
# order IS the variable under test), four are nether/End figures whose
# references predate `HARVEST-ORDER` stamping and honestly say
# `harvest = "unrecorded"`, and three are seed-20260722 or seed-12345
# overworld rows.
#
# **The number is NOT lowered by filling the field in from inference.** ORACLE
# rule 30 — an assertion is not a stamp — and a guessed window is the exact
# defect this ledger exists to prevent; for several of the eleven the honest
# value is recoverable only by re-diffing against a stamped reference, which is
# a measurement and not the business of a bookkeeping branch. So the set is
# frozen instead: a NEW quotable worldgen figure must record its dump order,
# and each of the eleven comes off this number as it is re-taken. Raising it to
# admit a new entry is the one move that is never the right one.
max_quotable_without_dump_order = 11

# RULE 17, THE SAME SHAPE AS RULE 12 AND FOR THE SAME REASON — 2026-08-18.
#
# Eight `quotable = true` bench entries record `workers = "unrecorded"`. Until
# 2026-08-18 `ci/bench-servers.sh` — the script that produces the CPU-seconds
# column of `docs/BENCH.md` — set `RUSTMC_WORKERS` nowhere, so the pool width
# came from the box's physical core count *unless the invoking shell had
# exported the variable*, and nothing in `results.tsv` would have said so.
#
# The width is not a detail of how the run was made.
# `pipeline::worker_threads`'s own doc prices it on this box, this seed and an
# identical build: 78.54 CPU-s at one thread, 82.69 at twelve, 98.48 at
# twenty-four. 25.4%, on a claim published to six significant figures
# (`0.082364`). The instruction count is the same to within 0.2% at every
# width — parallelism does no extra work, it buys cycles — which is exactly
# why the number is a property of the pool and not of the generator.
#
# What corroborates the published rows, without recording them: the 2026-08-14
# head-to-head left `~/bench-h2h/results.tsv` with our peak-core column at
# 11.6, 12.1 and 12.1 over three squares, consistent with the 12-core default
# and inconsistent with an SMT-wide pool. So the ratios in `docs/BENCH.md` are
# very likely right. They are still not recorded, and the entire premise of
# this file is that "likely right" and "recorded" are different claims.
#
# A RATCHET, NOT A FLOOR. Editing this file cannot repair these eight — the
# runs are gone and the artefacts are gitignored. Each is retired by re-taking
# it with the stamping script and lowering this number. Raising it to admit a
# new figure is the move this entry exists to make visible.
max_quotable_bench_without_workers = 8

# RULE 19, A RATCHET — 2026-08-18.
#
# `[coverage] pattern` is `[0-9]+\.[0-9]{4,}%`, and `docs/PARITY.md` 2 is made
# entirely of counts. So the UNREGISTERED scan that guards every percentage in
# seven documents could not see one number in the table a reader actually lands
# on. Found while giving that table its floor column: five of its twelve
# residuals appear in no ledger entry.
#
#   1,079     overworld 20260722, chunks 57..71   — no figure, no floor measured
#   6         overworld 31415926, chunks 59..69   — no figure, no floor measured
#   8,472     nether 20260722, chunks 57..71      — RAW half; its order-invariant
#                                                   core 8,459 is registered
#   10,038    nether 20260722, chunks 93..107     — no figure, no floor measured
#   39,941    nether 31415926, chunks 57..71      — RAW half; its core 6,127 is
#                                                   registered, and this raw
#                                                   number is 2.4x UNDER its own
#                                                   floor of 95,240
#
# TWO OF THE FIVE ARE NOW REGISTERED AND THE CEILING IS 3. The raw halves were
# the ones worth having: their cores each carry a full entry with a window and a
# floor, and the raw number sat beside the core in the same row with none of it.
# `nether-r7-basalt-core`'s `quotable_override` had said since 2026-08-02 that
# the raw 39,941 was withdrawn and the core is the quotable half; the dashboard
# published the withdrawn half anyway. They are registered as
# `nether-r7-ssv-raw` and `nether-r7-basalt-raw`, both `quotable = false`,
# disqualifier `best of nine orders` — because the column shows the CHEAPEST of
# nine traversal orders and the spreads are 2x and 5.4x.
#
# The remaining three are genuinely unmeasured windows and registering them
# would mean inventing one.
#
# A RATCHET AND NOT A FLOOR. Registering the five means measuring five windows,
# and inventing a window to satisfy this file is the defect it exists to
# prevent. What is enforced is that a SIXTH cannot arrive. A row whose cell
# reads `not measured` is not counted: that is an honest statement of absence,
# and it is exactly the distinction the table had no column to make before.
max_unregistered_dashboard_rows = 0

# Coverage: every exactness percentage in these files must be a registered
