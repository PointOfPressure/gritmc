# THE PUBLISHED-FIGURE LEDGER — every number a reader could act on, tied to
# the artefact that produced it and the window it was taken under.
#
# Adjudicated by `ci/check-figures.py`, which runs in `ci/t0.sh`. Read that
# file's header for why this exists; the short version is that this project
# has published five refuted or unquotable figures in two days and every one
# was caught by accident.
#
# A ledger entry is not documentation. It is the machine-readable form of a
# claim, and the checker fails when the claim and the artefact disagree. Five
# independent ways an entry can go red:
#
#   1. `claim` no longer appears in `doc`          — the doc drifted
#   2. `artefact_claim` no longer appears in `artefact` — the artefact drifted
#   3. `percent` does not equal 1 - residual/denominator — the arithmetic lies
#   4. `quotable = true` while `floor >= residual` — ORACLE rule 6 (no
#      resolving power), or `quotable = false` without its `disqualifier`
#      printed in the doc beside the number
#   5. `compare_to` names a figure measured in a different window — the
#      r=7-against-an-r=32-target mistake, mechanically
#
# WINDOW FIELDS ARE MANDATORY. A number without its window is not a number.
# For a worldgen figure that is dimension/seed/radius/centre/chunks/refs; for
# a bench figure it is radius/squares/heap/build. `check-figures.py` refuses
# an entry that omits the fields its `kind` requires, so "I did not know the
# window" cannot be expressed here.
#
# BASELINE IS MANDATORY TOO, and it is the launch headline. `baseline` is
# `unmodified` for a figure measured against the pinned unmodified vanilla
# jar. Anything else — a forked server, a JVM-reconfigured vanilla, a patched
# jar — must say so in the doc as well, and the checker demands the label be
# visible to a reader, not just recorded here.

# ---------------------------------------------------------------------------
# THE UNIT VOCABULARY — 2026-08-19
#
# Six of the last run's corrections were one class: a right number answering a
# question nobody asked. `108/108 falsifiable` measured DECLARATIONS while 61
# of 108 checks had never moved. `git rev-list --count` measured commit
# OBJECTS, 4,182 naive against 1,377 distinct changes. `union_N` measured the
# width of the region a mask removes and was scored as a null, making a
# headline 14x that was 3.53x. Every one was arithmetically correct, and no
# field in this ledger disagreed with any other, because the ledger recorded
# what each number IS and never what it ANSWERS.
#
# So every figure carries a `unit` drawn from this closed set and a `question`
# it answers. `ci/figure-units.py` compares the noun the published prose puts
# beside the number against the `unit` recorded here.
#
# HOW A CONFLICT IS DECIDED, AND WHY IT IS NOT LISTED PER UNIT. Each unit
# declares only the nouns that legitimately stand beside its own number. Every
# other unit's nouns are its conflicts, derived — a hand-written conflict list
# is two places to edit and one place to forget, which is the shape of the
# defect this block exists to catch. A figure reds when its published prose
# puts SOMEBODY ELSE'S noun beside the number and none of its own.
#
# `nouns` is what may legitimately stand beside this unit's number. `distinct`
# is the subset that is DIAGNOSTIC of it, and only `distinct` entries become
# another unit's conflicts. The two lists are separate because the first draft
# used `nouns` for both and produced 74 reds on a ledger with no known defect
# in it: "x", " s", "id", "test", "table", "target", "less" and "charge" all
# appear beside numbers in ordinary prose, so a conflict set built from them
# fires everywhere and decides nothing. A unit with an empty `distinct` — the
# percentages, `ratio` — is one whose nouns cannot separate it from anything,
# and saying so is more honest than inventing a token for it.
#
# `neutral` holds tokens that stand beside numbers of every kind and therefore
# separate nothing. They are excluded from every conflict set.
[units]
citations = { nouns = ["citation", "citations", "cite", "cites", "cited"], distinct = ["citations"], means = "rows of a refusal or absence ledger that the tree cites" }
neutral = ["%", "percent", "of", "total", "count", "number", "value", "figure"]

[units.blocks]
nouns = ["block", "blocks", "position", "positions", "charge", "charged"]
distinct = ["blocks", "block positions"]
means = "block positions in a generated window, counted"

[units.percent-of-blocks]
nouns = ["block", "blocks", "exact", "exactness", "identical", "position", "positions"]
distinct = []
means = "share of the block positions in a generated window that agree with vanilla"

