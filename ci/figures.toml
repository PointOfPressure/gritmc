# THE WORLDGEN AGGREGATE, REFUSED — branch worldgen-aggregate, 2026-08-12
# ---------------------------------------------------------------------------
#
# `docs/DETERMINISM.md` §33. These four entries exist so that the refusal is a
# CHECKED artefact rather than a paragraph. Both aggregate entries are
# `quotable = false` because rule 6 fires on them — the composite residual sits
# under the composite floor — and registering them is what stops the next agent
# computing the same sum, getting the same plausible-looking 99.9%, and
# publishing it because nothing said no.
#
# The window fields on the two aggregates are deliberately unfillable. A
# `worldgen` window needs a dimension, a seed and a harvest order; an aggregate
# across three dimensions and two seeds has none of those, and `REQUIRED_WINDOW`
# forcing the incoherence to be written out in the record is the point.


# The live worldgen headline, restated where a reader actually looks. Same
# reason README carries `readme-restates-ow-r16-admissible`: `docs/PARITY.md`
# is the parity document, and its `## 2` table headlined a figure that had been
# superseded four times. The restatement carries the window and the floor in
# prose, and the window-match rule ties it to the measurement.
#
# `compare_keys` INCLUDES `dump_order`, and that is deliberate. The README
# restatement omits it, which is how that entry can sit at `quotable = true`
# against a source disqualified for uncontrolled chunk order — the
# discriminating key is missing from the comparison that exists to
# discriminate. `docs/DETERMINISM.md` §33.2.


