# it is red. Scoped to the four claim documents; `docs/BENCH.md` and
# `docs/WORKLIST.md` are append-only laboratory records whose historical
# entries carry their own dates, so their *headline* figures are registered
# individually below and their history is not scanned.
[coverage]
docs = [
    "README.md",
    "docs/PARITY.md",
    "docs/WIDE-WINDOW-R16-ALL-DIMENSIONS.md",
    "docs/DETERMINISM.md",
    # ADDED 2026-08-17, after measuring rather than guessing. Each of these
    # published exactness percentages while being scanned by nothing, and in
    # every case every number was ALREADY registered — so this costs no
    # re-measurement and refuses the next unregistered one.
    #   docs/AGENT-BRIEF.md     6 percentages, 0 unregistered
    #   docs/PARITY-ROADMAP.md  1 percentage,  0 unregistered
    #   docs/PRODUCT.md         1 percentage,  0 unregistered
    # AGENT-BRIEF is the sharpest of the three: it is the one file every agent
    # reads first and no agent re-checks, so a stale figure there is read more
    # often than one in any claim document.
    "docs/AGENT-BRIEF.md",
    "docs/PARITY-ROADMAP.md",
    "docs/PRODUCT.md",
    # ADDED 2026-08-17, closing the "next item" the block below used to name.
    # Their four percentages are now in the RETIRED list rather than registered
    # as figures, because three of the four are not measurements of this server:
    # two are inherited r18 seed-20260708 ratchet targets from another project
    # and one is a positive control. See the four [[historical]] entries.
    "docs/ORACLE.md",
    "docs/CI.md",
    "docs/PHASE0.md",
]

# NOT ADDED, and the reason is recorded so nobody re-opens it as an oversight:
#   docs/BENCH.md    74 percentages, 73 unregistered
#   docs/WORKLIST.md 92 percentages, 71 unregistered
# Both are append-only laboratory records whose historical entries carry their
# own dates, per the comment above; their headline figures are registered
# individually. Adding either would demand registering or retiring ~70 dated
# historical numbers apiece, which is a re-measurement programme and not a
# bookkeeping edit.
#   docs/ORACLE.md, docs/CI.md, docs/PHASE0.md — CLOSED 2026-08-17, and they are
# in the list above now. They held four distinct unregistered percentages and
# NONE of them wanted a `[[figure]]` entry: two are inherited r18 seed-20260708
# ratchet targets from another project with no artefact in this repo, one is a
# positive control proving two invocations agree, and one is a diagnostic
# before/after inside a narrative whose prose records no window. All four are
# retired instead, each with the reason it is not a level. Registering any of
# them would have meant inventing a window to satisfy the ledger, which is the
# defect the ledger exists to prevent (ORACLE rule 30, an assertion is not a
# stamp).
#
#   docs/PREREG-ruined-portal-blocks.md 2 — NOT an oversight and NOT the next
# item. That file is a pre-registration and those two percentages
# (99.971560%, 99.972025%) are PREDICTIONS made before the measurement. A
# prediction is a different kind of number from a published measurement:
# registering it would hand it an artefact and a window it never had, and a
# consumer enumerating this ledger mechanically would read it as a result. The
# file carries its own dated correction section instead — appended 2026-08-17,
# because a pre-registration's value is that it is not rewritten after the fact.
doc_globs = [
    # One file per branch, gaining one on every agent handoff, so a hand-kept
    # list would go stale by construction and nothing would say so.
    "docs/cold-start/*.md",
]
pattern = '[0-9]+\.[0-9]{4,}%'

# Every declared gate floor in these files must be a registered `gate-floor`
# figure. Generalised 2026-08-07 from a real miss: `min_binaries` moved 97 ->
# 106 on `main` and two NEW floors (`min_tests`, `max_ignored`) appeared with
# it. The moved one reddened because it was registered; the two new ones would
# have sat unregistered indefinitely. A floor is the number that decides
# whether a merge happens, so it is a published figure.
floor_files = ["ci/checks/*.toml"]

# MERGE-REGION BEGIN figures to-eof check=toml-figures
# Everything from here to EOF is the `[[figure]]` body, and every branch
# registers its figures by appending at EOF. Two branches appending different
# entries merge without a conflict; an EDIT to an entry that already exists
# still conflicts, because the driver only resolves a hunk whose base slice is
# empty. `check=toml-figures` re-parses the merged file and refuses a
# duplicate `id`, so a bad resolution cannot reach the ledger `check-figures.py`
# adjudicates. The `[meta]` and `[coverage]` floors above stay OUTSIDE the
# region on purpose: they are the ratchets, they are rewritten in place, and a
# concurrent change to one of them is a disagreement that wants hands.
# `ci/merge-docregions.py`; `.gitattributes`.

# ---------------------------------------------------------------------------
# OVERWORLD, r=16 — the headline window, and it no longer has one
# ---------------------------------------------------------------------------
#
# THE REFERENCE PAIR CHANGED, AND THAT IS WHY EVERY NUMBER BELOW MOVED —
# 2026-08-09. Every figure in this section carries `pair`. The entries marked
# `pair = "destroyed"` were taken against `gen-wide-20260722-r16-ow-a` and its
# `-b` twin as those existed before the 2026-08-07 disk failure. Neither
# directory survived the restore — `find / -xdev -name 'gen-wide*'` matched
# nothing anywhere on the box — so those figures are not reproducible by
# anyone running this tree, however sound they were when taken.
#
# The pair was regenerated from scratch the same day; `ci/ow-r16-window.sh`
# holds the exact command. This project's own rule is that **a floor belongs
# to the pair of runs that produced it, not to the seed and the window**, so
# the destroyed pair's floor of 35,531 could not be carried across. Measured
# on the regenerated pair, the same window's floor is 29,560 — 5,971 lower,
# which is the size of the error anyone re-deriving the old trio would have
# inherited.
#
# So the live entries were re-taken end to end on the regenerated pair at
# `main` 8e283f57 and are marked `pair = "regenerated-2026-08-09"`. The
# destroyed-pair entries are kept exactly as they were, because deleting a
# figure that was once published is how a ledger stops being a record; they
# are simply no longer anything a reader may quote. 35,531 survives in this
# file only inside those entries and this note.

# The one quotable r=16 overworld figure. Read `docs/DETERMINISM.md` §12
# before touching this entry: it is a DIFFERENT INSTRUMENT on the SAME window,
# not a re-cut of the window. `floor` is recorded because this window's
# vanilla-A-vs-vanilla-B disagreement is a real 29,560 and hiding it here
# would be the dodge — but that floor belongs to the *masked* instrument. This
# one masks nothing: every one of the 107,053,056 positions is adjudicated
# against the set of answers vanilla is known to give there, so there is no
# blind spot for rule 6's disqualifier to be about. Hence `quotable_override`,
# which is the field the checker provides for exactly this — a premise that is
# absent rather than a rule that is inconvenient.
#
# NOTE WHAT THE FLOOR NOW SAYS ABOUT THIS WINDOW. The residual is 29,605 and
# the floor is 29,560: our disagreement with vanilla is **45 blocks** above
# vanilla's disagreement with itself. The override is still sound — this
# instrument excludes nothing, so there is no blind spot to be larger than the
# residual — but the window is close to exhausted as an instrument, and
# `docs/PARITY.md` says so beside the figure rather than only here.
#
# AND IT IS MEASURING A CONDITION AS WELL AS A RESIDUAL — 2026-08-10, ORACLE
# rule 29, `docs/DETERMINISM.md` §15. This figure was taken with our dump
# walking chunks x-major against references harvested z-major
# (`GEN_ORDER=rows` forceloads one z row at a time), and chunk order is a
# condition of a comparison in the same way the seed is: the same instrument
# charges an **unmodified vanilla run 117,628 blocks** for having the wrong
# chunk order, against 3,804 for being a different run of the right one. With
# the order matched the N=8 charge falls 14,270 -> 2,450. **This figure is not
# withdrawn and it is not wrong** — it is an accurate `|ours not in {a,b}|` and
# every delta ever taken against it is still exact, because a delta holds the
# condition fixed on both sides. What it is not is a clean measure of our
# fidelity. Do not re-take the level until the dump order matches the
# reference's `HARVEST-ORDER` or the ensemble holds both orders; the successor
