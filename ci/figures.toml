floor_note = "208, and it is a floor in the exact sense rule 6 wants: it is what this IDENTICAL table yields when the instrument is wrong. `soundPitchDrawn` first shipped inferred from `usedRandom` — did the rule touch the RNG at all — and under that reading only 208 states were emittable, which is precisely the four families (lever 24, comparator 16, buttons 168) that `world_send::use_sound` had already transcribed by hand. So the wrong instrument returns the answer the change was supposed to improve on, and a green would have been indistinguishable from a no-op. Measured across SEEDS instead, the same file yields 1,509 — 7.3x its floor."
reason = "Re-taken 2026-09-04: the 247-block table adds sixteen states the table describes and the use path cannot reach (`unreached`, decorated pots and their kin, listed in the artefact), which sit in the denominator and not the numerator — 1,509 and 2,944 are unchanged. The states `world_send::use_sound` can emit from the extract alone, out of the states that sound. Registered because the number moved 208 -> 1,509 under a one-line change to how one column is decided, and because the roadmap row it appears in used to price this item as \"the sound column is a boolean, so give it an event id\" — which is half the story. The event id is necessary and closes only the states whose pitch is a constant. The complement, 2,944, sound with a pitch vanilla DREW: every door, trapdoor and fence gate. That half will never move by regenerating the table, only by reading each class, and reading it as an extraction shortfall is the misreading this entry exists to prevent. NOT A DEFECT COUNT and not a parity score: a silent state is not a wrong state, it is an absent packet, and `oracle-runner` drops sound.pitch so no corpus scenario grades any of this in either direction."
