# ---------------------------------------------------------------------------
# GATE FLOORS. A floor enforced by a gate is a published figure — it is the
# number that decides whether a merge happens — and it is the kind that rots
# most quietly, because nobody reads it until it fails to fire.
#
# The `doc` is where the floor is stated and enforced. The `artefact` is the
# ADJUDICATOR that reads it, so the tie catches the failure that matters here:
# a floor left sitting in the toml after the code that enforces it was
# removed. A floor nobody reads is exactly a check that cannot fail.
#
# These three replace an entry that was wrong from the day it was written.
# `t1-binaries` registered `T1 reaches 97` from `docs/CI.md` with
# `kind = "bench"` and a window of `view_distance = "n/a"` — a window field
# that means nothing about a test-binary count, carried only because `bench`
# was the nearest available shape. `kind = "gate-floor"` exists so the shape
# fits, and `WINDOW-PLACEHOLDER` in the checker is what stops the next fudge.
# ---------------------------------------------------------------------------

