# ---------------------------------------------------------------------------
# RESTATEMENTS. A figure quoted in a second document is a second place it can
# drift. These entries tie the restatement to the document that owns the
# measurement, so `docs/PRODUCT.md` cannot quietly disagree with
# `docs/BENCH.md`.
#
# AND A RESTATEMENT IS A SECOND PLACE ITS QUOTABILITY CAN DRIFT, WHICH IS THE
# HARDER ONE — 2026-08-13. The entry below sat `quotable = true` from
# 2026-08-10 to 2026-08-13 while `ow-r16-admissible-n2`, whose number it
# republishes to the block, was withdrawn on that same day for an uncontrolled
# chunk order. Rules 9 and 10 in `ci/check-figures.py` make the pair
# structurally unable to disagree again; what follows is what the figure
# became.
# ---------------------------------------------------------------------------

# WITHDRAWN 2026-08-13, INHERITING ITS SOURCE'S DISQUALIFICATION. The number is
# not re-derived and not replaced: the seed-20260722 r=16 overworld window
# carries no exactness figure at all, and the successor taken with the order
# matched (`ow-r16-admissible-matched`, 2,450) sits inside the 2,202..5,263 the
# same instrument charges an innocent vanilla run, so it is corroboration and
# not a level either. An estimate in its place would be worse than a hole.
#
# NOTHING IN `README.md` CHANGES, AND THAT IS THE POINT OF THE FIX RATHER THAN
# AN EXCUSE FOR ITS SIZE. The prose there was already correct on 2026-08-10 —
# it prints the figure as **not quotable**, names the **uncontrolled chunk
# order**, prices it at 117,628 blocks on a candidate that is vanilla, and
# leads with the 2,450 indistinguishability claim instead. Only the
# machine-readable half disagreed, which is the half a consumer enumerating
# this ledger would believe, and the reader-facing half is where this project
# has always been careful. The figure stays printed there for the reason the
# destroyed-pair entries stay in this file: a headline that changed with no
# trace of what it replaced is indistinguishable from a headline that was
# always this.
#
# `quotable_override = "no-mask"` was dropped rather than moved. It was sound
# on its own terms — the admissible instrument really does exclude nothing, so
# rule 6's blind-spot premise is absent — and it is exactly the wrong tool
# here, for the reason `ow-r16-admissible-n2`'s own `reason` field gives: a
# premise being absent does not make a condition controlled. An override
# answers "is there a blind spot bigger than the residual"; the disqualifier
# is "was the chunk order set on both sides", and no answer to the first is an
# answer to the second.
#
# `compare_keys` now names all eleven of the target's window keys, `dump_order`
# included, and the window records `dump_order` so the comparison can be made
# at all. Its absence is why rule 5 reported agreement: the two rows were
# compared on every axis except the one that had already been ruled fatal.
[[figure]]
id = "readme-restates-ow-r16-admissible"
kind = "worldgen"
unit = "percent-of-blocks"
question = "On the overworld seed 20260722 r=16 window against 2 references, what share of block positions is our generator charged for differing on?"
doc = "README.md"
claim = "99.972345%"
claim_count = 1
percent = "99.972345%"
residual = 29605
denominator = 107053056
floor = 29560
# Inherited from `ow-r16-admissible-n2` along with the number itself, and so is
# the mismatch: same twin-mask width against the same no-mask charge. Flagged
# here too rather than only on the source, because rules 9 and 10 make a
# restatement stand or fall with its target and a consumer reading THIS row must
# see the same refusal. 2026-08-17.
floor_comparable = false
floor_basis = "twin-mask width |A != B| on the masked window (denominator 107,023,496), inherited from ow-r16-admissible-n2. Not an innocent-candidate floor for the no-mask instrument; that one is 16,932 at N=2 and 29,605 does not clear it."
pair = "regenerated-2026-08-09"
quotable = false
disqualifier = "uncontrolled chunk order"
reason = "Restatement of `ow-r16-admissible-n2`, and it inherits that entry's withdrawal because it is that entry's number: same 29,605, same 107,053,056, same reference pair, same dump. See its `reason` in full — WITHDRAWN AS A LEVEL AND NOT AS A MEASUREMENT. It remains an accurate |ours not in {a,b}| and every delta taken against it is still exact, because a delta holds the condition fixed on both sides; what it is not is a measure of our fidelity, having been taken with our dump walking chunks x-major against references harvested z-major. README.md already said so in prose from 2026-08-10 and this ledger did not, for three days. The README is where a figure is most likely to be lifted without its window, which is the argument for registering the restatement at all and is now also the argument for the flag being right: a consumer enumerating this file mechanically reads `quotable`, not the paragraph."
baseline = "unmodified"
compare_to = "ow-r16-admissible-n2"
compare_keys = ["dimension", "seed", "radius", "centre", "chunks", "refs", "harvest", "dump_order", "mask", "order", "ybox"]
artefact = "docs/PARITY.md"
artefact_claim = "this port writes 29,605 blocks that match"
provenance = "main 8e283f57, re-taken 2026-08-09 on the regenerated reference pair; withdrawn 2026-08-13 on branch ci-figures-ledger off main a106314d, bookkeeping only — no dump was generated, no reference was read and no number moved"
window = { dimension = "overworld", seed = "20260722", radius = "16", centre = "64,64", chunks = "1089", refs = "2", harvest = "rows", dump_order = "x-major (UNMATCHED)", mask = "none", order = "vanilla-first", ybox = "full" }

