# ---------------------------------------------------------------------------
# BENCHMARKS. `docs/BENCH.md` and `README.md` are the ONE place a tracked file
# may name another server implementation, and that exception is deliberate and
# unchanged. The window-match rule below is the guard that stopped the
# r=7-against-r=32 verdict, so both radii are registered and pinned.
# ---------------------------------------------------------------------------

# claim_count 2 -> 4 on 2026-08-07 (`perf-surface-biome-id`). Both new
# occurrences were adjudicated, not counted: one names the figure as r=7 while
# explaining why the r=32 target has no verdict over it, the other is a
# published-vs-remeasured drift row whose two columns are the same radius.
#
# THE FIGURE IS STALE AND THE LEDGER CANNOT SEE IT. The same commit that added
# those occurrences remeasured this window at `main` 9b4afd4 and got 0.091481
# — **+11.1%** — with the r=32 row +10.3% beside it. `quotable` is left true
# because the figure is still true at its `provenance`, and retiring a
# headline before attributing its drift was the wrong order at the time. It
# is left here so the next reader of this entry cannot miss it. Note also
# that `artefact` is the document that publishes the claim, so rule 2
# compares this figure to itself and can never catch staleness — the same
# shape as the API tripwire that read its own record. Only a re-run can move
# it.
#
