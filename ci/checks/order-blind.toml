# ci/checks/order-blind.toml — what each gameplay check can see
# about ENTITY ORDER. Written by `ci/order-blind.py --ledger`.
#
# `--check` refuses the moment a check becomes CAN-GRADE-ORDER
# while ci/checks/entity-broadcast-order.json still records our
# order as differing from vanilla's. That is the whole point: a
# divergence nobody can see is one nobody has to fix, and it
# stays unfixed until a scenario lands that happens to see it,
# at which point it reads as a regression from that scenario.
#
# AND SINCE ROADMAP §103 CLOSED IT, `--check` also refuses if
# that pin ever records the order as differing again. The pin
# has a `--measure` that rewrites it, and with 0 of 108 checks
# able to grade this order, a re-measure is the only way a
# closed divergence could quietly reopen. `broadcast_order_closed`
# below is that floor. Removing the line disarms the refusal,
# which is deliberate — it must be a visible edit and not a
# side effect of running a tool.
#
# BLIND-BY-PROJECTION   observes no kind ServerEntity emits.
#                       Cannot start seeing order by accident.
# BLIND-BY-POPULATION   observes such a kind, but only ever one
#                       entity emits it. May stop being blind
#                       when the scenario's world changes.
# CAN-GRADE-ORDER       two or more entities, one order-bearing
#                       kind. Nothing is here yet.
#
# `entities_in_one_tick` is an OBSERVATION and not a gate
# floor, which is why it is not named `max_*`: the gate
# reads `status`, and a `max_` name here would register as
# a merge-blocking floor that nothing enforces.
#
broadcast_order_closed = true
N_distinct_recordings = 41
files = 41
serverentity_packets = ["ClientboundBundlePacket", "ClientboundMoveEntityPacket", "ClientboundMoveMinecartPacket", "ClientboundProjectilePowerPacket", "ClientboundRemoveEntitiesPacket", "ClientboundRotateHeadPacket", "ClientboundSetEntityDataPacket", "ClientboundSetEntityLinkPacket", "ClientboundSetEntityMotionPacket", "ClientboundSetEquipmentPacket", "ClientboundSetPassengersPacket", "ClientboundUpdateAttributesPacket"]
order_bearing_kinds = ["move_entity", "move_entity_heartbeat", "move_entity_rot", "remove_entities", "rotate_head", "set_entity_data", "set_entity_link", "set_entity_motion", "set_equipment", "set_passengers", "update_attributes"]

