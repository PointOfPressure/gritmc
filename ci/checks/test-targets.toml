[[bucket]]
id = "doctests"
runs_in = "t1"
reason = """
RECORDED — and recorded as an OPEN HOLE rather than as a decision, which is a
third state this ledger's `reason`/`unknown` split would otherwise flatten.

`docs/CI.md:70`, under the heading "What the gate's own commands can still be
green over", in a list its own text says was "measured and are **not** closed":
"**`cargo check --all-targets` does not compile doctests, and T0's `--lib
--bins` does not run them.** A doctest that does not compile takes T0 to `T0
GREEN`, measured. T1 catches it ... So the hole is T0-only, and T0 is what an
agent runs before a push."

So nobody decided to exclude doctests from T0; somebody measured that they are
excluded, wrote it down as a known hole, and left it open. This bucket exists to
stop that entry going stale silently: the 12 members are now enumerated, so a
thirteenth lib crate cannot join the hole without a red gate.
"""
measured = """
12 targets, 2.2 s, and until 2026-08-16 **the whole bucket contained 3
executable doc examples**: `rustmc-proto` 1, `rustmc-data` 1, `rustmc-api` 1.

**Nine of the twelve targets executed nothing** — eight entirely vacuous
(0 passed, 0 failed, 0 ignored: `rustmc-world`, `rustmc-behavior`,
`worldgen-assembly`, `rustmc-entity`, `rustmc-server`, `essentials-core`,
`permissions`, `worldedit-core`) and `rustmc-worldgen`, whose only fence was
` ```ignore ` (`crates/rustmc-worldgen/src/trace_switch.rs:52`) and which
therefore reported 0 passed and 1 ignored. `cargo test --doc` on any of them
could not fail and reported ok.

The 2026-08-10 note here said this was **not a defect to fix**, on the ground
that a crate is under no obligation to carry doc examples. That is true of a
crate and it was the wrong conclusion about a *ledger*: nine of the twelve
entries in a bucket whose whole subject is an open coverage hole were checks
that could not fail, and nothing in the tree could tell them from the three
that could.

All twelve now run an example, so all twelve can go red, and each was chosen to
document a property that has actually been got wrong somewhere in this problem
space rather than to satisfy a count — vanilla's `Direction` ordinal order, the
32-bit `imul` in `Mth.getSeed`, `>> 4` against a truncating divide at a negative
chunk border, an absolute data path against a `cargo test` binary's own cwd.
A doc target with no runnable example is now `EXECUTES NO ASSERTION`, and a doc
target may **not** be declared compile-only in its place: rustdoc does not
compile an `ignore`d fence, so there would be nothing for that category to be
true of.

`docs/CI.md`'s hole is unchanged and is still open: T0 runs no doctest, so a
doc example that stops compiling is still invisible until T1. What has changed
is that there is now something in each of them for T1 to catch.
"""
