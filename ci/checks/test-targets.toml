carries no `#[test]` of its own — the format and its goldens live in
`rustmc-world` — so it contributes a binary and zero assertions, which is why
the measured block below is unchanged.)

`--bins` is load-bearing and is named here as a reminder rather than a note:
`tools/oracle-runner` is a binary crate, so under `--lib` alone this bucket was
19 tests smaller and one of the missing ones was failing.
"""
measured = """
1455 assertions passed, 0 failed, 1 ignored, in 36.4 s wall (Threadripper,
2026-08-10, two other trees' suites running concurrently, so an upper bound).

**Read that number against the 150 assertions in the 88 targets T0 could not
reach when the audit began, because it is the correction to this whole file's
premise.** T0 is blind to 83% of the
workspace's targets and to 9.3% of its assertions (150 of 1,605). The blind spot
is wide and shallow. That does not make it safe — `tools/oracle-runner`'s 19
invisible tests were 1.2% of the assertions and one of them was failing — but it
does mean "T0 misses 88 of 106 targets" is a much more alarming sentence than
the coverage it describes, and anyone quoting it should quote 9.3% beside it.

# NINE OF THESE EIGHTEEN EXECUTED NO ASSERTION AT ALL — found and closed 2026-08-16

Re-measured by running the whole workspace suite in `~/rustmc-assertfloor` on
the Threadripper against 186d6f17 (110 result blocks, 98 binaries + 12
doctests, `skipping: no vanilla` count **0**, so nothing skipped for want of a
fixture). Per target rather than in aggregate, which is the count nobody had
taken:

    anvil-probe::bin::anvil-probe          0 passed, 0 failed, 0 ignored
    essentials-core::lib::essentials_core  0 passed, 0 failed, 0 ignored
    goldengen::bin::goldengen              0 passed, 0 failed, 0 ignored
    permissions::lib::permissions          0 passed, 0 failed, 0 ignored
    region-differ::bin::region-differ      0 passed, 0 failed, 0 ignored
    rustmc-api::lib::rustmc_api            0 passed, 0 failed, 0 ignored
    rustmc-server::bin::rustmc-server      0 passed, 0 failed, 0 ignored
    worldedit-core::lib::worldedit_core    0 passed, 0 failed, 0 ignored
    worldgen-dump::bin::worldgen-dump      0 passed, 0 failed, 0 ignored

**So T0 declared 22 targets and 13 of them could go red.** These nine
compiled, linked, ran, reported `test result: ok` and could not fail — the
limiting case of the class this whole ledger exists for, sitting inside the
bucket the ledger holds up as the covered half, and the `1455 assertions`
figure above is exactly what hid them: an aggregate over eighteen targets
cannot show that nine of them contributed nothing to it.

**The count was 14 in commit 186d6f17 and it was 13.** That commit's own
bullet list named eight of these nine — `worldedit-core::lib::worldedit_core`
was missing from it — while its total said 20, so the summary disagreed with
itself and the disagreement was in the direction that flattered the gate. The
list above is now derived mechanically by `ci/check-test-targets.py` from the
module tree each target roots, and cross-checked against the measured log.

**All nine now assert, and the fix was not the same in each.** Four bins had
pure decoders or argv parsers worth a test outright (`region-differ`'s window
parsers, `anvil-probe`'s block/chunk/region arithmetic, `worldgen-dump`'s
`ChunkPos.asLong` inverse, `goldengen`'s version scrape against the compiled
constant). `rustmc-server`'s bin had its flag reader extracted. The three
plugin stubs and `rustmc-api` were the interesting ones: their honest content
is type-level, so what they assert is the architectural rule the tree calls
`ENFORCED` — a `plugins/` crate may name no dependency but `rustmc-api` —
which was enforced by nothing and, until `rustmc-api` re-exported the types
its own signatures use, could not be obeyed either.

**It is a check now, and it is here rather than where 186d6f17 predicted.**
That commit named `ci/t1-allowlist.py` as the instrument, on the ground that
per-target counts only exist once a suite has run. They do — but a *static*
derivation from the sources cargo would build gives the same answer, was
calibrated against the measured log target for target in both directions, and
lands in T0 where an agent meets it before the push rather than at merge. See
`[assertions]` at the foot of this file and
`ci/check-test-targets-falsify.py`'s 24 new cases.
"""
members = [
