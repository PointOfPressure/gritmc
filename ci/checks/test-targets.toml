# ci/checks/test-targets.toml — every cargo target in this workspace, and which
# gate runs it.
#
# # WHY THIS LEDGER EXISTS
#
# `ci/t0.sh` runs `cargo test --workspace --lib --bins`. That selector cannot
# build anything in a `tests/` directory and runs no doctest, so when this audit
# began **88 of this workspace's 106 targets were invisible to T0**. For one
# bucket that was a deliberate budget decision with a comment behind it; for the
# other six nobody ever wrote anything down, and until this file existed nothing
# in the tree could tell those two states apart.
#
# It is 85 as of this commit: the audit promoted three (`t0-wiring`) and left
# the rest where they were, with a measured reason each. **The remaining 85 are
# not a backlog.** They are 9.3% of the workspace's assertions and most of them
# belong exactly where they are; the number that matters is not how many targets
# T0 skips but which of them nobody had ever decided to skip.
#
# The cost of not being able to tell them apart, twice:
#
#   * `--lib` alone matched no target in `tools/oracle-runner`, a **binary**
#     crate. Nineteen tests had never run in any gate and one was failing.
#     Fixed 2026-08-03 by adding `--bins`.
#   * an agent added an integration test under `tests/`, T0 came back GREEN,
#     and the green was the test binary never having been built. 2026-08-10.
#
# Both fixes were one target wide. This file is the general answer:
# `ci/check-test-targets.py` enumerates the tree with `cargo metadata` and
# reddens T0 on a target that is in the tree and in no bucket here. **Adding a
# test target without saying where it runs is a red gate.**
#
# # WHAT `runs_in` MEANS, AND THE THING IT IS EASY TO MISREAD
#
# `runs_in` is which gate is the **first** to execute the target. Note what the
# table below adds up to: **`t1` is not "excluded"**. `ci/t1.sh` is a bare
# `cargo test --workspace --no-fail-fast`, which reaches every one of these 110
# targets, so nothing in this workspace is outside every gate. The real
# quantity is the *exposure window*: T0 runs on every agent push, T1 runs on
# merge (`docs/CI.md` gate-tier table). A defect in any of the 88 is invisible
# from the push that introduces it until the merge gate, and `docs/CI.md`'s own
# "what the gate's commands can still be green over" section is the list of
# things that has already cost.
#
# The permitted values are `t0`, `t1` and `retired`, and there is no `t2`.
# **That is a measurement, not an omission.** `ci/t2-wire.sh`,
# `ci/t2-gameplay.sh`, `ci/t2-gameplay-subset.sh`, `ci/t2-gameplay-selfcheck.sh`,
# `ci/t2-memory.sh`, `ci/t2-regiondiff.sh`, `ci/t2-vanilla-loads-ours.sh` and
# `ci/t3-determinism.sh` were grepped for `cargo test` on 2026-08-16 and run
# none: T2 drives already-built binaries against recorded vanilla traces. So a
# target cannot be "covered by T2", nobody may claim it is, and
# `ci/check-test-targets.py` has no stage to check such a claim against.
#
# `retired` was spelled `never` until 2026-08-16 and nothing was ever in it. It
# means: no stage runs this target, on purpose, and the `reason` says why. It is
# the *only* way a target may be selected by nothing — anything else is
# `RUNS NOWHERE` and a red gate — and it is a claim that can be wrong in both
# directions, because a stage that still selects a retired target is
# `RETIRED BUT RUN`.
#
# # THE CLAIM IN THIS COLUMN WAS UNCHECKED FOR SIX DAYS — 2026-08-16
#
# Everything above was written on 2026-08-10 and every word of it was true, and
# **no line of code read `ci/t1.sh` until 2026-08-16**. `ci/check-test-targets.py`
# recomputed T0's argv and refused on a disagreement with the `runs_in = "t0"`
# buckets; the `runs_in = "t1"` buckets — 88 of the 110 targets, twelve buckets,
# every golden vector and every integration test in the tree — rested on this
# file's prose and on nothing else. Narrowing `ci/t1.sh` to `--lib --bins` would
# have taken all 88 out of every gate in the project and left T0 printing
# `110 targets declared, 22 run in T0, 88 do not`, which is what it printed
# anyway.
#
# That is the project's central defect class — a green that cannot be turned red
# — inside the ledger written to close it. It is fixed: `ci/t1.sh` now carries
# the same selector sentinel `ci/t0.sh` does, both are re-evaluated, a target
# selected by no stage is red unless it is `retired`, and
# `ci/check-test-targets-falsify.py` injects sixteen faults and asserts each
# refusal by name. The summary line changed too, and not cosmetically: `88 do
# not` named a hole of 88 where the measured hole is 0, and a check that cries
# wolf gets bypassed.
#
# # THE NEXT RING OUT, DELIBERATELY NOT CHECKED HERE — a null, so nobody re-runs it
#
# `runs_in = "t1"` now means two things and this file verifies one of them:
# that `ci/t1.sh`'s argv selects the target. It does **not** verify that
# anything invokes `ci/t1.sh`. The chain is `ci/handoff.sh` stage 5 →
# `ci/t1-gate.sh` → `ci/t1.sh`, one line, and deleting it would take 88 targets
# out of the merge gate with every check in the tree green — which is the same
# sentence as the defect above, one level up.
#
# It is not checked, on purpose, for two measured reasons:
#
#   * **Deleting stage 5 does not fail silently.** `ci/handoff.sh:489` is
#     `set -euo pipefail` and `T1_RC` is assigned only inside stage 5, so
#     stage 6's `[ "$T1_RC" -eq 0 ]` is an unbound-variable fatal. Checked on
#     2026-08-16, not assumed. The failure mode here is a dead gate, not a
#     green one, which is the opposite of and much cheaper than the class this
#     file exists for.
#   * **The check available is worse than the gap.** Shell invocation cannot be
#     established by substring — `ci/handoff.sh` names `ci/t1.sh` twice in
#     comments and executes it never — so any such check would have to strip
#     comments heuristically and would be biased toward *passing* on a false
#     match. A guard whose failure mode is a false green, defending against a
#     fault that has never occurred and would be loud if it did, is surface
#     without assurance. `docs/AGENT-BRIEF.md`: hold anything you build to the
#     bar of catching a real past instance.
#
# If a stage ever does get silently un-invoked, this paragraph is wrong and the
# check becomes worth writing. Nothing else about it needs re-deriving.
#
# # HOW TO EDIT IT
#
# Add your target to the bucket that describes it, or add a bucket. Two fields
# carry the justification and they are **not** the same claim:
#
#   * `reason` — what somebody actually WROTE DOWN, quoted with its file:line.
#     Where nothing was ever recorded this says `unknown`, and that is a
#     deliberate reading rather than a gap to be tidied away. An invented
#     rationale is worse than an admitted absence: it reads as a decision
#     somebody made and stops the question ever being asked again.
#   * `measured` — what the 2026-08-10 audit measured, so that the next person
#     arguing about T0's budget argues against numbers instead of adjectives.
#     Wall times were taken on the Threadripper with two other trees' suites
#     running concurrently, so every figure is an **upper bound**.
#
# # WHAT THIS FILE IS NOT
#
# It is not a claim that the excluded targets pass — two of them do not. It is
# a claim about *where they run*. `ci/checks/t1-known-red.toml` is the ledger
# for whether they pass, and it carries the two standing reds by signature.

[meta]
# A floor under the enumeration itself, for the reason `min_binaries` exists in
# t1-known-red.toml and the reason `SHELL_N` has a floor in `ci/t0.sh`: an audit
# over an empty target list passes byte-identically to a clean one. This is the
# measured count on 2026-08-10 (106) less a margin for a branch that
# legitimately deletes a crate.
#
# **It cannot catch the defect this file exists for, and that is why the file
# exists.** An unaccounted target makes the count go UP, and every floor in the
# tree passes trivially in that direction. A floor catches collapse; only a
# manifest catches addition.
min_targets = 96

# MERGE-REGION BEGIN buckets to-eof check=toml-buckets
#
# Every branch that adds a cargo target adds a `[[bucket]]` here, and — measured
# 2026-09-05 — it lands beside the bucket it is topically closest to rather than
# at a shared tail, which is `ci/t0.sh`'s shape rather than `ci/figures.toml`'s.
# So the region is the whole body and `check=toml-buckets` carries the weight:
# a duplicated `id`, a target listed in two buckets, or a file that stops
# parsing is a refusal, and a real edit both sides make still conflicts exactly
# as it did. 193 of the 630 pairs of the 36 branches ahead of main that touch
# this file conflicted on it before this marker, and 18 of 630 after. Do not
# move or delete this
# line — `ci/merge-docregions.py --check` runs in T0.

[[bucket]]
id = "t0-unit"
runs_in = "t0"
reason = """
RECORDED, `ci/t0.sh`: "Unit tests, and only the unit tests." These 19 are the
entire intersection of "exists" and "T0 runs it" — one unittest binary per lib
and one per bin. (18 until 2026-09-05, when `tools/level-probe` was added: it
writes and reads a world directory's `level.dat`, `data/minecraft/*.dat` and
