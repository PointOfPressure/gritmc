[[bucket]]
id = "t1-chunk-light-capture"
runs_in = "t1"
reason = """
Beside `golden_chunk_packet`, which is in the `t1` golden-vector bucket above
and which this follows exactly: both need a **capture that does not exist in a
clean clone and cannot be committed** — 4.6 MB of `level_chunk_with_light`
bodies from a real vanilla server, Mojang-derived like every other oracle world
here — and both skip loudly without `RUSTMC_CHUNK_CAPTURE`.

What `golden_chunk_light` grades is the one thing nothing else could: our light
against **vanilla's own light bytes, in the packet that carries the blocks it
was computed from**. Both sides read their blocks out of the same 117 packets,
so our generator is not consulted and no worldgen residual can reach the
number. 245 of 2,572,288 nibbles on a settled capture at seed 31415926.

It needs a *settled* capture and says so, which is the reason it can never be a
push gate on a freshly dumped one: vanilla's chunk packet carries light that
lags its own blocks by the fluid ticks that follow generation, and the same
instrument charges 5,261 block nibbles on a fresh capture against 55 on one
taken 120 s later from the same server. `ci/dump-chunks.sh` takes a settle
time for that.
"""
measured = """
Threadripper, 2026-09-05: 2 tests, 3.3 s with a capture present, instant
without. Capture taken by `ci/dump-chunks.sh <out> 25591 31415926 120`.
"""
members = [
    "rustmc-server::test::golden_chunk_light",
]

[[bucket]]
id = "t1-light-harvest"
runs_in = "t1"
reason = """
RECORDED, and on `session_joint`'s own criterion: "tests that need minutes and
the extract are T1".

`light_harvest` compares our engine's output against **a real server's saved
`BlockLight`/`SkyLight` nibbles**, in three dimensions, with both sides
reading the blocks out of the same region file so no worldgen residual can
leak into the figure:

    overworld  0 of 6,787,072 nibbles differ   289 chunks   r=8
    nether     0 of 7,409,664                  289 chunks   r=8
    the End    5,609 of 1,863,680               81 chunks   r=4

All 5,609 are sky and all are in section -1, the light-only padding section
below the End's world bottom; the test prints the `(section, vanilla, ours)`
census itself so the residual arrives attributed.

The nether and the End are in the table because both have `minSectionY == 0`,
which `docs/AGENT-BRIEF.md` names as the case that hides every off-by-one
between a mask index and a section Y. The dimension geometry and the sky flag
are read out of `generated-data/.../dimension_type/<name>.json` rather than
written down — 26.2's `the_end` says `"has_skylight": true`, contradicting
every older version, and a hand-written `false` scored 1,079,016 sky nibbles
wrong while reading exactly like a port defect.

It is here rather than in T0 for one reason and it is measured: reading and
decoding the three harvests is ~5,500 chunks, and in the DEBUG build `ci/t0.sh`
uses that costs **112 s** even with the harvests memoised for the life of the
binary — against 1.7 s for the two T0 light targets together. The engine is
still gated on every branch by those two; this one re-measures a published
number, which is a T1 job.

It does NOT skip when a harvest is absent: it panics naming the fix, because a
light comparison that quietly measures nothing is the defect this repo exists
to avoid. Its positive control picks the commonest non-air state in each
harvest's OWN window rather than naming a constant — `minecraft:stone` moves
0 of 7,409,664 nibbles in the nether, which is a green control measuring
nothing.
"""
measured = """
Threadripper, 2026-09-05: 38 s `--release` at radius 8/8/4, 112 s in a debug
build at the default radius of 2. Two tests, 14 assertions.
"""
members = [
    "rustmc-server::test::light_harvest",
]

