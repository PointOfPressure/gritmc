spawn tile: 25 chunks (81 with the margin) in 0.6s; more are generated as players walk into them. not generated: no structures: no villages, strongholds or shipwrecks
rustmc 26.2 listening on 0.0.0.0:25699 (not saving: pass --world <dir> to persist)
"""
# NOT READY, shape 3 of 3 — bound, but somewhere else. The probe asked for
