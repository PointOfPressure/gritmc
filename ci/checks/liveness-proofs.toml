script = "ci/readiness-falsify.sh"
what = "the freshly booted rustmc-server announced on the port this falsifier asked for, before any state is captured from it"
source_line = "if grep -q \"listening on 0.0.0.0:$READY_PORT[ ,]\" \"$W/ready/rustmc.log\" 2>/dev/null; then break; fi"
# NOT cross-examined by ci/readiness-falsify.sh's boot-and-cross-run pass, and
# this field says so rather than the proof being quietly absent from a list
# inside that script. `--check` refuses a proof naming rustmc.log that declares
# neither `contract` nor this.
