This is that script's OWN boot wait, not a harness proof of a subject the
harness then measures, and it is outside the `rustmc-ready` contract in three
ways: it reads $W/ready rather than $WORK, matches $READY_PORT rather than
$OUR_PORT, and it signals with `break` rather than RUSTMC_READY=1.

It is also circular. `$W/starting` is DEFINED as the log at the last moment
before this very loop's predicate went true, so this loop refusing it would be
true by construction and not by measurement, and `$W/ready` is the capture this
loop is what waits for. A proof cannot be cross-examined against captures its
own loop produced.

Registered with a negative fixture like every other, because `--check` still
runs its predicate against a log a not-ready subject produces, which is the
claim that matters. Only the boot-and-cross-run pass is skipped.
"""
