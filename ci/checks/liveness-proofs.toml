# liveness-proofs.toml — every place the harness treats output as evidence
# that a subject is alive, and the log each one must REJECT.
#
# Read by `ci/liveness-proofs.py --check`, which runs in `ci/t0.sh`. The
# `negative` fixture is not documentation: it is fed to `predicate` through a
# real `bash -c`, and a predicate that calls it ready is refused by name.
#
# ADDING A PROOF: `ci/liveness-proofs.py --discover` lists every wait loop in
# `ci/*.sh`. Anything it lists and this file does not is a T0 refusal.
#
# # 2026-08-13 — the three unsound entries are gone, and so is the allowance
#
# They waited on the bare string `listening on`, which
# `crates/rustmc-server/src/main.rs` printed *before* calling `status::listen`
# and therefore before the bind. No log containing that string is rejected by
# `grep -q 'listening on'`, so `unsound = true` was a statement of fact.
#
# Both halves are repaired on branch `ci-readiness-proofs`
# (`docs/PARITY-ROADMAP.md` §28):
#
#   * the server no longer says it before it is true. `status::listen` calls
#     back past the bind, from immediately before the first `accept`, with
#     `listener.local_addr()` — so the line carries the address the kernel
#     gave, and a bind that failed produces no such line at all;
#   * the proofs no longer stop at a string. Each matches the port it asked
#     for, and then asks the kernel whose LISTEN socket is on it
#     (`ready_socket_owner`); the two subset scripts also complete a status
#     exchange through the recorder's own client stack
#     (`ready_speaks_status`). See `ci/server-ready.sh` for why the arms
#     differ per site.
#
# `MAX_UNSOUND` in `ci/liveness-proofs.py` is **0**. A fourth is now a code
# change with a reviewer.
#
# # The fixtures below are transcripts, not prose
#
# Every one of them is the output of a real `rustmc-server` boot, taken by
# `ci/readiness-falsify.sh` on the Threadripper. That script boots the real
# binary into each of these states, runs every predicate in this file against
# the logs it actually produced, and additionally runs the pre-repair
# predicate against the not-ready log to confirm it still accepts it — which
# is the red-when-broken evidence for the repair, both directions, on the
# instrument itself. `positive` lines for vanilla are copied from
# `~/rustmc-dark/oracle-work/gameplay/dark-probe/vanilla/server.log`.
#
# The three rustmc entries carry *different* negatives on purpose. They are
# the three distinguishable ways to be not-ready, one each, so the file as a
# whole covers all three: bind refused, still starting, and bound to another
# port. `ci/readiness-falsify.sh` crosses them — every predicate against every
# negative — because this gate only ever runs each predicate against its own.
#
# `OUR_PORT` is set inside each predicate because `ci/liveness-proofs.py` runs
# it with nothing in the environment but `LOG` and `PATH`. That is the point:
# the port a proof matches has to come from somewhere, and a proof that
# matches any port is back to matching a string.

# --------------------------------------------------------------------------
# The full gameplay gate. Two arms — the post-bind line naming this port, and
# the kernel's word that the socket is ours. No status handshake: this is the
# script every branch runs under the box-wide corpus lock, and pricing a new
# connection to the subject would cost a forty-minute corpus run.
# --------------------------------------------------------------------------

[[proof]]
script = "ci/t2-gameplay.sh"
contract = "rustmc-ready"
what = "rustmc-server is bound on the port we asked for, and the socket is ours, before the corpus records"
source_line = "grep -q \"listening on 0.0.0.0:$OUR_PORT[ ,]\" \"$WORK/rustmc.log\" 2>/dev/null && ready_socket_owner \"$OUR_PORT\" \"$RUSTMC_PID\" && { RUSTMC_READY=1; break; }"
predicate = "OUR_PORT=26783; grep -q \"listening on 0.0.0.0:$OUR_PORT[ ,]\" \"$LOG\""
positive = """
spawn tile: 25 chunks (81 with the margin) in 0.5s; more are generated as players walk into them. not generated: no structures: no villages, strongholds or shipwrecks
rustmc 26.2 listening on 0.0.0.0:26783 (not saving: pass --world <dir> to persist)
"""
# NOT READY, shape 1 of 3 — the bind was refused. This is the failure the
# whole item is named after, and the line the old predicate broke out on is
# absent from it now: the repaired server prints nothing between the spawn
# tile and the error.
negative = """
spawn tile: 25 chunks (81 with the margin) in 0.5s; more are generated as players walk into them. not generated: no structures: no villages, strongholds or shipwrecks
listen: Address already in use (os error 98)
"""

