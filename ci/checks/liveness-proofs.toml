# The chunk-streaming probe. Two arms, the same pair `ci/t2-gameplay.sh` uses
# and for the same reason: this boots one server and then counts packets on a
# socket, so "our bind failed and the neighbour answered" would report a chunk
# count for somebody else's world. No status handshake — the probe's very
# next act is a full login, which is a stronger exchange than the handshake
# would be and would only be paying for it twice.
#
# The negative is shape 3 of the three in this file: bound, but to a
# different port. It is the one this proof is most exposed to, because the
# probe runs on a fixed default port (:25699) rather than a probed-free one,
# so a second copy of it is a routine event.
# --------------------------------------------------------------------------
[[proof]]
script = "ci/chunk-stream-probe.sh"
contract = "rustmc-ready"
what = "rustmc-server is bound on the port the probe asked for, and the socket is ours, before any chunk is counted"
source_line = "grep -q \"listening on 0.0.0.0:$OUR_PORT[ ,]\" \"$WORK/rustmc.log\" 2>/dev/null && ready_socket_owner \"$OUR_PORT\" \"$RUSTMC_PID\" && { RUSTMC_READY=1; break; }"
predicate = "OUR_PORT=25699; grep -q \"listening on 0.0.0.0:$OUR_PORT[ ,]\" \"$LOG\""
