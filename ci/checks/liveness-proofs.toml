# The two sentinel waits in `ci/run-detached-falsify.sh`. A different subject
# from a booting server, so a different not-ready shape: the payload is not
# "starting", it is DEAD without ever having written `DETACHED-DONE`.
#
# `grep -qa` is why these two were invisible — `-q\b` cannot match `-qa`,
# because `\b` after `q` needs a non-word character and `a` is a word
# character. `-a` is there because the wrapper's log is whatever the payload
# printed, and one NUL byte from a cargo progress line makes `grep` call the
# file binary and print nothing while exiting 1: without `-a` this predicate
# would call a FINISHED payload not-ready, which is the sound direction to
# fail in but still wrong.
#
# **Both fixtures are the wrapper's own output, taken on the Threadripper on
# 2026-09-05.** The positive is `~/.rustmc-detached/corpus-boxsetup.log` after
# a real payload returned; the negative is `corpus-killme2.log`, from a
# payload started under this same wrapper and `kill -9`ed four seconds in —
# `./ci/run-detached.sh --status` calls that one DETACHED-DIED, and a proof
# that reads it as done would have a suite pass on a payload that never ran.
[[proof]]
script = "ci/run-detached-falsify.sh"
what = "the detached payload wrote its own completion sentinel, not somebody else's and not none"
source_line = "grep -qa \"^DETACHED-DONE $name \" \"$log\" 2>/dev/null && return 0"
predicate = "name=corpus-boxsetup; grep -qa \"^DETACHED-DONE $name \" \"$LOG\""
positive = """
DETACHED-DONE corpus-boxsetup rc=0 2026-09-05T14:02:23+01:00
"""
negative = """
payload started: pretending to be a gate
"""

# The death-race recheck, one line down: `kill -0` has already said the
# wrapper is gone, and this asks once more whether the sentinel landed in the
# window between the payload's last write and its exit. Same predicate; the
# negative is the one that matters, because reaching this line at all means
# something ended and the only question left is whether it finished.
[[proof]]
script = "ci/run-detached-falsify.sh"
what = "the sentinel landed in the race between the payload's last write and the wrapper's exit — and if it did not, the payload DIED"
source_line = "kill -0 \"$(cat \"$pidf\" 2>/dev/null || echo 0)\" 2>/dev/null || { sleep 0.3; grep -qa \"^DETACHED-DONE $name \" \"$log\" 2>/dev/null && return 0; return 1; }"
predicate = "name=corpus-boxsetup; grep -qa \"^DETACHED-DONE $name \" \"$LOG\""
positive = """
DETACHED-DONE corpus-boxsetup rc=0 2026-09-05T14:02:23+01:00
"""
negative = """
payload started: pretending to be a gate
"""

