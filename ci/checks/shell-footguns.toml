# Shell idioms this project has got wrong more than once.
#
# A RATCHET, in the shape of `ci/checks/comment-guards.toml` and
# `ci/checks/t1-known-red.toml`, not a pass list. `ci/shell-footguns.py` reads
# this. A branch may LOWER `total` by repairing an instance; raising it means
# adding a line that says which instance is being left and why. A declared
# instance that stops being found is as red as a new one, because a stale
# declaration reads as authoritative and is worse than none.
#
# # WHY THESE TWO
#
# `pkill -f` matched its own caller and killed it **five separate times in one
# run**, and it was already documented when three of those happened:
# `ci/batch.sh:372` names the mechanism, `ci/batch-falsify.sh:67` says
# "PID-resolved, never `pkill -f`". Being written down is what this class has
# already had.
#
# `cmd | grep -c X || echo 0` emits `0\n0`, because `grep -c` prints 0 AND
# exits 1 on no match. It was made twice. It broke four cases of
# `ci/batch-falsify.sh` on their first run and read as a defect in
# `ci/batch.sh`, because the numeric comparison fails as a syntax error rather
# than as a tally of zero.
#
# # WHY THESE EIGHT ARE DECLARED AND NOT REPAIRED
#
# Every one is in a falsifier's cleanup path, killing processes it started
# itself in a temp directory it owns. They work today. The safe form is not a
# bracketing trick — `ci/batch.sh` says plainly that "the bracket form is not
# enough when the same command line also carries the plain path" — it is pgrep,
# skip `$$`, and compare `/proc/<pid>/environ`, which is a real rewrite of each
# cleanup. Rewriting eight of them blind, in the scripts whose whole job is to
# prove other checks can fail, is a worse risk than declaring them. What the
# ratchet buys is that a NINTH cannot be written.
#
# MEASURED 2026-08-19 on `work-method` by `ci/shell-footguns.py --emit`, over
# 8 shell instances with comments and heredoc bodies blanked. The raw grep
# returns twelve; four of them are comments warning against the idiom,
# including the two quoted above. A checker that counted those would report the
# documentation of a defect as the defect, and its number would rise every time
# somebody wrote a warning.
#
# GREP-C-OR-ECHO-ZERO stands at ZERO. The one live instance,
# `ci/handoff-merge-tail-falsify.sh:586`, was repaired in the same commit as
# this file rather than declared: it is one line and the replacement,
# `awk 'END{print NR}'`, is already the form used elsewhere in that file.

total = 13

[allowed]

