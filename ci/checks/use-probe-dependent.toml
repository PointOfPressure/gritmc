# The seven below entered the table on 2026-08-18, when `TableLevel` started
# answering `getBlockEntity` with the real block entity instead of `null`.
# Every one of them opens with `if (!(level.getBlockEntity(pos) instanceof
# XBlockEntity)) return PASS`, so with a null they returned `PASS` before
# reaching anything and had no row at all - not a refusal, no row. With a real
# block entity they reach `player.canUseGameMasterBlocks()`, which is
# `abilities.instabuild && permissions().hasPermission(GAMEMASTER)`, and that is
# a reading of the probe. They are probe-dependent because they were always
# probe-dependent; the harness could not see it until the ask was answered.

