# Every field the corpus projection removes before the comparison.
#
# Written and checked by `ci/projection-drops.py`. Read that file's header for
# what makes a drop different from an opaque field: `rest` digests the bytes
# the decoder did **not** consume and compares them exactly, so a field left
# unread is still live, and a field read without being emitted is gone. Every
# row here is the second kind.
#
# `impact` is the column the whole file exists for, and it has three values:
#
#   * `decides` — the drop removes what a live check turns on. Its green is
#     not evidence. This is the class `sound.pitch` was in.
#   * `armed`   — the field carries real server behaviour and merely happens to
#     be hard to compare. No check turns on it today; the next one that wants
#     it will find nothing there and no failure to tell it so. `damage_event`'s
#     unnormalised entity ids sat here for weeks.
#   * `note`    — the field carries **no** server behaviour: a random id, a
#     wall clock, a signature over a wall clock. Nothing can ever be decided by
#     it, so the drop is free. Listed so that a later reading of the wire
#     format cannot quietly move it into one of the other two.
#
# The axis is deliberately *not* "does any check observe this kind". Eleven
# checks observe `add_entity` and none of them could ever have wanted its uuid.
#
# `observed_by_count` is on every row and `observed_by` names the checks when
# there are few enough to read. Both are re-derived and both are checked: a
# count catches a check being added or retired, and the list catches one being
# renamed. A long list is carried as a count alone rather than as eighty names
# nobody would re-read.
#
# `stage` is the third checked column and it is the one that says what a drop
# costs to undo: a `decode` drop is gone from `rest` and needs the recorder
# rebuilt, a `project` or `informative` drop was recorded and needs only a
# projection edited. It is compared against the site carrying the marker, since
# 2026-08-19 and because it had been wrong for a day without anything noticing.
#
# Both are re-derived from `ci/checks/gameplay/*.toml` on every run and the
# check refuses a row that disagrees. That is deliberate: whether a drop
# matters is a property of the check files, which move far more often than the
# decoder does, so this ranking cannot be allowed to be a memory.

