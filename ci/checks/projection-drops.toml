# ---------------------------------------------------------------------------
# NORMALISATIONS — the third class, and the one that is easiest to mistake for
# a comparison that is still happening.
#
# A discard removes a field. A normalisation *rewrites* it, so something is
# still compared and the absolute value is not. `window = 7` against
# `window = 3` becomes `window = 1` against `window = 1`: the two menus are
# now the same menu as far as any check can tell, which is right — a container
# id is allocated per connection and no two runs agree — and is still a loss
# nobody had written down.
#
# These rows carry `anchor` instead of a marked site, because there is no one
# line to mark: the behaviour is the whole function. The checker requires the
# anchor to still exist in the named file, so deleting or renaming one of these
# goes stale rather than silently un-declaring the loss.

