# The other two read no fixture — 25 and 33 assertions over
# `rustmc_entity::pathfinder`, `rustmc_entity::ai` and a grid level built in
# memory — so they are `ci/t1-sabotage.sh`'s case and they took two arms to
# settle. **The first arm fired and moved neither, and that is recorded here
# so nobody re-runs it:** `path-tiebreak`, relaxing `BinaryHeap.upHeap`'s
# strict `<` to `<=`, gave `fired=1` with both binaries green, 8 and 7 tests
# passing. Every grid in those two files is a straight line or one detour whose
# optimal path is unique in shape, so no equal-`f` choice reaches an assertion.
# `path-accuracy` — `PathFinder.findPath`'s `accuracy` forced to 0, the shape
# of that loop before the argument was ported — does reach them:
# `ground_path::accuracy_stops_short` asserts the path ends at `(4, 64, 0)` for
# a target at `(5, 64, 0)`, and every `move_to` in `navigation` paths at
# accuracy 1 and counts 5 nodes. Both pairs are in `ci/t1-sabotage.sh`'s
# `PAIRS_DEFAULT`, which is where a `sabotage` grade is recorded — this file
# carries the count and the four non-grade classes by name, and the sweep
# carries the pairs.

