# What has ever been shown to make each T1 test binary fail.
#
# A RATCHET, in the shape of `t1-known-red.toml`, not a pass list.
# `ci/check-t1-controls.py` reads this. `demonstrated` may be RAISED freely;
# lowering it means a control stopped working and has to be explained in the
# same commit, and a binary moving from a demonstrated grade to `instrument` is
# as red as a declared red that stopped failing.
#
# # THE QUESTION THIS ANSWERS
#
# `docs/PARITY-ROADMAP.md` §73.7 counted, over T1's 80 test binaries, how many
# have a positive control — anything ever shown to make them fail. Five are
# named by a falsifier in `ci/`, one carries a real control in its own file,
# and **74 have neither**. §73.7 is careful about what that does and does not
# mean: not that the 74 are worthless, but that "for 74 binaries nobody has
# ever demonstrated a red, so nobody knows which of them are in the same state
# `can_survive_matches_vanilla_where_both_sides_answer` was in an hour ago".
#
# Every figure below is a measurement, not an argument. §84 has the method.
#
# # THE GRADES ARE ORDERED, AND THE WEAKEST IS NOT ENOUGH ALONE
#
#   absent            the fixture is moved aside and the binary goes red
#   perturbed         ONE number inside the fixture is changed and it goes red
#   perturbed+rebuild same, for a fixture `include_str!` bakes into the binary
#   sabotage          a named wrong implementation makes it go red
#
# 59 of the 78 were forced by fixture (40 `absent`, 19 `perturbed`), 4 by
# sabotage (`golden_rng`, `plugin_storage`, `ground_path`, `navigation`) and 1
# by perturb-and-rebuild (`random_tick_pos`). 64 demonstrated; the other 14 are
# the three classes below, each named individually.
#
# §73.4 graded 70 tests by removal alone, and §73.7 says of that method that it
# "is by fixture removal, which is one axis and not the only one". The reason
# to care is exact: **a binary that goes red when its golden file is deleted
# has proved that it opens the file, and nothing more.** A test that loads a
# vector and never compares it fails in precisely the same way. `perturbed` is
# the grade that tells those apart and it costs one integer.
#
# # AND THE NON-GRADES, WHICH ARE FINDINGS RATHER THAN GAPS
#
#   instrument     `println!` with no assertion that can fail. Not a gate, so
#                  there is nothing to control. Named individually below.
#   unforceable    the fixture exists in no tree on this box, so the comparison
#                  has never run. §73.10's class. Named individually.
#   declared-red   already failing at its declared signature in
#                  `t1-known-red.toml`; forcing it measures nothing.
#
# MEASURED 2026-08-18 in ~/grit/work-t1pc on `t1-positive-controls`, base
# `t1-audit` restacked onto main cb358498c. Three rounds:
# `ci/logs/t1-controls.tsv`. Fixture axis 57 of 74; the rest below.
