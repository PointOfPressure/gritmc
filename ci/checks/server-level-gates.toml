# Every probe rule gated on `instanceof ServerLevel`, what the gate hides, and
# whether this project can take the branch.
#
# Derived by `ci/server-level-gates.py`; `--check` refuses if the jar and this
# file disagree. `hides` and `columns` are **derived, not declared** — they are
# here so a change in the jar has to be acknowledged, not so a human can assert
# them. `verdict`, `guard` and the prose are the only judgements.
#
# WHAT MAKES THIS DIFFERENT FROM THE OTHER TWO LEDGERS
#
#   ci/refusal-ledger.py    what the generators said they could not answer
#   ci/probe-absences.py    what they never said anything about
#   this                    what they said CONFIDENTLY AND WRONGLY, because the
#                           harness is not a ServerLevel and the rule returned
#                           a plausible value without running
#
# `instanceof` is answered by the JVM against the object's class. A `Level`
# subclass cannot observe the question, so six of these rows look exactly like
# a block that genuinely does nothing. `SignBlock` is the only one vanilla
# announces, via `Util.pauseInIde`, and it is the only one already refused.

[meta]
# Refused if any of these moves. Derived by `--check`; see `## 87.` in
# docs/PARITY-ROADMAP.md for what each one means.
# **Two blocks, and the smaller one is checked in every tree.**
#
# `[meta.totals]` is `setPlacedBy` and `useWithoutItem`, the two probes every
# tree with `data/vanilla` can measure. `[meta.totals_full]` adds `useItemOn`,
# whose table most trees never build, and is checked only where it was. So the
# subtotal cannot quietly rot in a tree that has all three, and a tree that has
# two is not asked to reproduce a number it has no way to reach.
[meta.totals]
rules = 8
blocks = 82
silent_rules = 7
silent_blocks = 34
# Cells carrying a row that is FALSE in a column the table has. This is the
# number to quote: not an absence and not a refusal, but a row a consumer
# reads as a fact about the block.
#
# Counted over the cells the **guard admits**, not over every recorded cell of
# the rule. The two are the same for all eight rules here and differ for four
# of the seven below, because a `use_item_on.json` cell is a (state, item)
# pair and five of those rules branch on the item first.
false_cells = 404
false_blocks = 34

[meta.totals_full]
rules = 15
blocks = 138
silent_rules = 14
silent_blocks = 90
#     404   the two required probes
#   3,197   with `useItemOn`: +2,784 SignBlock, +8 BeehiveBlock, +1 PumpkinBlock
#
# 2,784 of the 2,793 new ones are signs, and they are new only because
# `SignBlock.useItemOn` does not call `Util.pauseInIde` while
# `SignBlock.useWithoutItem` does — the same 48 blocks are 1,344 refusals on
# one half of the click and 2,784 silent false cells on the other.
false_cells = 3197
false_blocks = 85

