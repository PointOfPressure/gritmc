# Thirteen entries stood here this morning, covering 90 registry blocks — 48
# signs, 17 candle cakes, 13 fences and twelve singletons — and every one of
# them was `environment`. They are gone because the table has a row or a
# refusal for all 90, not because the standard moved:
#
#   48 signs               refusal, on vanilla's own `Expected to only call
#                          this on server`
#   17 candle cakes + 1 cake     probeOnly on `hungry` and `invulnerable`
#   13 fences              row, `reads: ["no-entities"]`
#    3 command blocks, 1 structure block, 1 jigsaw, 1 test block,
#    1 test instance block       probeOnly on `game_master`
#    1 chiseled bookshelf, 1 bell    faceOnly
#    1 decorated pot, 1 jukebox      row, `consumes: true`
#
# `ci/probe-absences.py --check` refuses an entry for a class the table now
# represents, so this section cannot quietly grow back: a regression puts the
# block back in the derived set and the check says UNEXPLAINED, which is louder
# than a stale entry ever was.
