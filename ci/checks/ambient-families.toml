# ci/checks/ambient-families.toml — the measurement behind every
# `trace::FAMILIES` row. WRITTEN BY `ci/ambient-census.sh`; do not
# hand-edit. `ci/ambient-falsify.py --check` reads it in T0.
#
# `self_consistent` is TWO INDEPENDENT VANILLA RUNS agreeing about
# the ordered sequence of this family's decoded fields, scenario by
# scenario, over the whole censused set. A family neither run
# emitted scores `self_consistent = false` and `measured = false`,
# never a vacuous true: every empty sequence equals every other one,
# so silence would otherwise read as the most stable family here.
#
# `self_consistent_stepped` adds the STEP each observation landed
# after, which `compare::project` puts into the compared value. It
# is the one a check lives or dies by and the one `graded` requires;
# the gap between the two separates `vanilla is nondeterministic`
# from `vanilla is fine and the harness cannot pin the arrival`.
#
# `emitter_sites` is `new` instructions for the packet's class
# anywhere under net/ in the pinned jar, from
# `ci/packet-emitter-sites.py`. -1 means the scan did not cover the
# family (the two synthesised kinds have no class of their own).
#
# `projected` counts vanilla observations inside the censused
# scenarios that name the kind in their own `observe` list — only
# those reach a projection. A `Class::Graded` row with
# `projected = 0` is refused.

