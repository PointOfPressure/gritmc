# Two distinct projections over six runs, and they differ in the packet TYPE
# of the outbound walk rather than in any field of it: four runs send
# `entity_position` at [0, 0, 3] (a forced sync) and two send
# `move_entity d = [0, 0, 12288]` (a delta), at 62-87 ms. The return walk is a
# delta in all six.
field = "the outbound walk's packet type — a forced position sync, or a delta"
why = """
`ServerEntity.sendChanges` offsets 648-691 choose a forced
`ClientboundEntityPositionSyncPacket` over the `move_entity_*` deltas on any of
five conditions, and the fifth is `wasOnGround != entity.onGround()`. The
scenario's first step walks three blocks with the on-ground bit CLEAR, so it is
written to cross exactly that disjunct.

**Vanilla does not always take it, and the reason is inside vanilla.**
`handleMovePlayer` does not trust the client's bit: it calls
`player.move(MoverType.PLAYER, vec)` and `setOnGroundWithMovement(...)`, and
the server's own tick then puts the player back on the superflat floor it is
standing on. So `entity.onGround()` is true again within the tick, and whether
`sendChanges` reads it before or after that restoration decides which packet
the observer gets. Measured 4 of 6 one way and 2 of 6 the other, arrival
62-140 ms against 64-87 ms — the same 50 ms grid as every other entry here,
seen through a boolean instead of through a counter.

Both branches are vanilla behaving correctly, no implementation can align the
phase, and the check keeps all of its power: it still fails on a server that
sends neither packet, and `540`'s own header records the falsification — with
`|| self.was_on_ground != e.on_ground` deleted from `crate::tracker` this
server emits nothing here at all.

**IT MEASURED `silent` UNTIL 2026-08-09 AND THAT WAS THE COMPARATOR, NOT
VANILLA.** `ci/corpus-floor.py` reported "2 of 6 runs (r5, r6) recorded nothing
at all" and the evidence line read "the other said nothing more" about two
recordings that both hold the delta above. `compare::place` was remembering
where a player had been announced, `530-walking-away-drops-a-standing-player-from-view`
announces one with `add_entity` inside its own window 32 blocks earlier, and a
delta packet carries no position of its own — so in the two runs where vanilla
sent no positioned packet, every observation in this scenario was bounded out
and the projection came out empty. A player is no longer placed; the
derivation and the recordings are on `compare::place`, and case 4 of
`an_entity_is_bounded_by_where_it_is_and_never_by_a_position_nobody_sent` pins
it. Before the repair this name was `silent` and would have been filed as a
repair order against our own harness; after it, the residual is vanilla's and
it is filed here."""

