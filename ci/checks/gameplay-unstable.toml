# EVERY ENTRY NAMES THE ENSEMBLE ITS RATE CAME FROM — 2026-08-18, and this file
# held three ensembles' worth of rates before it did.
#
# A rate belongs to the ensemble that produced it, exactly as a floor does.
# `docs/PARITY.md` 4.1 states the rule for the corpus floor's 9 and 7 and says
# what follows from it: quote whichever you like WITH ITS ENSEMBLE, and never
# quote one against the other as a movement. This file is where that rule was
# not being kept.
#
#   four entries    an unnamed N = 26 sweep, main 92f1658, 2026-08-04, corpus 61
#   one entry       twin-homog-20260809, N = 6
#   the standing floor  coverage92-selfcheck-n6-20260811, N = 6, corpus 92
#                       (ci/checks/gameplay-floor.toml)
#
# **The disagreement this hid is real and is not a contradiction.**
# `a-player-that-leaves-the-ground-is-resynced` reads 8/15 here and 5/15 in the
# floor file — the same scenario, the same N = 6, the same 15 pairs, two
# different ensembles. Neither number was wrong and neither said which ensemble
# it belonged to, so nothing could tell the difference between that and a
# regression.
#
# **It was not cosmetic.** `ci/corpus-floor.py`'s EVIDENCE DOES NOT REPRODUCE
# check is guarded on `evidence.distinct_projections`, and with no `[evidence]`
# table at all it was unreachable on five entries out of five — a check that
# could not fail, switched off by a field nobody supplied rather than by anyone
# deciding to switch it off. `ci/corpus-floor.py emit` has printed the
# sub-table since it was written; these five predate it. UNSTAMPED and
# UNVERIFIABLE now red, and `ci/corpus-floor-falsify.sh` cases 29 and 30 hold
# both open.
#
# WHAT WAS KEPT AND WHY. `water-spreads` is here while its scenario is parked
# in `ci/checks/gameplay/open/` and loaded by nothing, so no current ensemble
# measures it and the floor file's evidence does not list it. That absence is
# the scenario being parked, not the scenario stabilising, and the entry stays:
# this file is a measurement record and not a gate input
# (`ci/corpus-floor-falsify.sh` case 11 pins that the gate does not read it),
# and 24/25 at N = 26 cannot be re-taken at the N = 6 the current ensembles
# run. `ci/checks/gameplay-baseline.toml` made the opposite call for the same
# name and was right to: a name in a GATE INPUT that no scenario answers to is
# a line nobody can act on. The two files differ because one is read by the
# gate and one is not.
#
# Checks the REFERENCE cannot reproduce against itself.
#
# Not a list of things we are allowed to fail. A list of things **vanilla
# fails**, measured by `ci/t2-gameplay-selfcheck.sh`, which records the whole
# corpus against twelve cold-booted vanilla servers and diffs each run
# against the first. Every name here is a check whose projection includes a value that
# vanilla draws fresh on every run, so the check can never come back `match`
# for anybody — not for us, and not for vanilla against itself.
#
# This file is **declared, and the selfcheck verifies it**. It is not written
# by the selfcheck. If the measured set and this file disagree in either
# direction the selfcheck exits non-zero:
#
#   * something newly unstable means an instrument regression, or a check
#     that has grown a dependency on a random field, and it must be looked
#     at rather than absorbed;
#   * something no longer unstable means this file is stale, and a stale
#     caveat list reads as authoritative and is worse than none.
#
# # Why this exists at all, and what it costs
#
# `ci/t2-gameplay-selfcheck.sh` was written on 2026-08-03 and first run on
# 2026-08-03. It came back **34/37, not all-match**, and all three failures
# were vanilla disagreeing with itself.
#
# That is the mirror image of the failure mode this project keeps finding.
# The usual one is a check that cannot fail. These are checks that cannot
# **pass**: no matter how correct this server becomes, they report `diverge`
# forever. Left unlabelled they are read as three defects we do not have, and
# they cap the corpus — which matters more as the corpus grows into entities,
# because the field that moves is on `add_entity` and every entity check
# carries one.
#
# The direction of the error is at least the safe one. An unstable check
# makes this server look worse than it is, never better, and the ratchet in
# `gameplay-baseline.toml` still works because the verdict is stable at
# `diverge`. So this is a labelling problem, not a correctness hole.
#
# Measured 2026-08-03, vanilla 26.2, protocol 776, superflat, Threadripper.
#
# # One of this class was FIXED rather than declared, and that is the shape
# # to prefer
#
# `ClientboundSoundPacket` carries a `long seed` that `Level.playSound` fills
# from `soundSeedGenerator.nextLong()` — a fresh 64-bit draw per sound. The
# trace digested the packet body whole, so **every check naming `sound` in
# its projection was permanently unmatchable**, exactly like the entries
# below, and two checks added on 2026-08-03 walked into it
# (`a-comparator-switches-to-subtract-mode` and
# `a-note-block-retunes-when-right-clicked`).
#
# It is not listed here because it did not have to be: the seed is the only
# random field in that packet and everything else in it — the sound, the
# source, the position, the volume, the pitch — is behaviour. `crate::trace`
# now decodes the packet and drops the seed, with a test that two bodies
# differing only in their seed produce the same observation.
#
# **Prefer that. An entry in this file is an admission that a mechanism
# cannot be compared; a decoder is the thing that removes the need for one.**
# The entries below are here because vanilla's randomness, or vanilla's own
# tick alignment, *is* the observable value rather than a field beside it.
#
# # A note on what "measured" means when the phenomenon is probabilistic
#
# This file demands set equality with what the selfcheck measured, in both
# directions. That is right when every declared instability fires on every run,
# and it is **not** what several of these do: `a-bystander-sees-a-chest-open`
# reproduced in one pair of runs and failed to in another three, because its
# cause is a window boundary landing either side of a 250 ms repeat. So a
# declared entry that does not reproduce is only evidence of staleness if the
# run had the power to catch it, which is why the default `SELFCHECK_RUNS` is
# 12 and why the arithmetic for that number lives in the script's header.
# A short run that reports NO LONGER UNSTABLE is a statement about N.
#
# # The five added 2026-08-03, and what they cost
#
# The corpus grew 37 -> 55 and the selfcheck was not re-run against the new
# checks until after they had been baselined. When it was, vanilla reproduced
# only **48/55** against itself: seven unstable, of which three were declared
# and four were not. Raising the selfcheck from two runs to twelve then found
# two more that the two-run design had never seen — `chest-opens-a-screen`,
# declared below, and `a-lever-lights-a-lamp`, which turned out to be a rig
# straddling a chunk boundary and was **fixed** rather than declared. All of
# them are `absent` or `diverge` for this server today, so nothing in the
# baseline moves — but they are the ceiling the corpus can reach the
# moment entities and containers land, and three of the four are on exactly
# the channels that work is about.
#
# Each was traced to its mechanism in vanilla's bytecode before being written
# down, because "these two runs differed" is a symptom and this file is a list
# of causes. One of the four had a *second*, separable cause that is ours
# rather than vanilla's; it is recorded on the entry rather than hidden,
# because it will outlive the entry.
#
# # `flaps` AND `comparisons` ARE THE MACHINE-READABLE FORM OF `measured`
#
# Added 2026-08-04. `measured` is prose and was only ever read by people;
# `flaps` and `comparisons` are the same two integers in a form
# `ci/selfcheck-aggregate.py` can do arithmetic with, and it does. When a run
# does not see a declared entry, the aggregator computes
# `(1 - flaps/comparisons) ** C` for that run's comparison count `C` and, above
# alpha = 0.05, prints `UNRESOLVED AT THIS N` with the arithmetic instead of
# `NO LONGER UNSTABLE`, and does not fail.
#
# **This is not a softening of the gate. It is the gate finally being able to
# tell the two claims apart.** "This entry is stale" and "this run was too
# small to see this entry" were reported identically for as long as this file
# existed, and the cost is written out four times below on
# `chest-opens-a-screen` alone: declared, removed, re-declared, removed, and
# re-declared at N = 26 with the rate unchanged the whole way. Every one of
# those readings was honest. The instrument simply had no way to say "I could
# not have seen this", so it said "this is gone".
#
# The direction that is NOT power-tested is `NEWLY UNSTABLE`, deliberately: an
# observed flap is a fact about the reference at any N, and only absence is a
# claim about the sampling.
#
# **These two numbers are declarations like every other field here, and they
# must be updated only from a measurement, with its N.** An entry whose
# `flaps`/`comparisons` are absent, zero or nonsensical is failed closed by the
# aggregator rather than exempted — an exemption that switches itself on when
# its input is missing is the failure mode this file is a catalogue of.
#
# Every rate below is from the N = 26 run of 2026-08-04, reports 2..26 in
# `oracle-work/gameplay-selfcheck`, read out by `ci/selfcheck-aggregate.py`
# itself; the invocation is in the commit message.
#
# **How many entries there are is deliberately not written here.** That
# sentence read "All seven rates below" over five `[[unstable]]` entries: the
# set had moved and the sentence had not, which is this project's oldest small
# defect — a count in a comment is a count every reader takes on trust and
# nobody re-checks. It is a bad line to leave in *this* file in particular,
# which is a catalogue of instruments that stopped meaning what they said. The
# entries are immediately below and countable, and the set is adjudicated
# rather than described: `ci/t2-gameplay-selfcheck.sh` compares declared
# against measured in both directions and exits non-zero on either mismatch,
# so a set that has moved is a red run and not a stale sentence.
#
# ===========================================================================
