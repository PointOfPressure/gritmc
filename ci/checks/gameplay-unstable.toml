#
# `compare::rebase_session_counters` already rebased `seq` and `window` onto
# the scenario. `state` is the third counter of exactly that class and was the
# last one still compared raw. It is now rebased too, scoped per
# **(connection, window)** rather than per connection, because
# `AbstractContainerMenu.stateId` is an instance field and each menu counts on
# its own.
#
# THE MECHANISM, READ OFF THE PINNED JAR RATHER THAN OFF THESE THREE ENTRIES.
# Three entries agreeing is three readings of code and ORACLE rule 9 says
# readings of code do not move suspects, so it was re-derived before anything
# was built on it. `javap -p -c -constants`, server-26.2.jar:
# `AbstractContainerMenu` holds `private int stateId`; `incrementStateId` is
# `stateId = (stateId + 1) & 32767` and returns the incremented value;
# `ServerPlayer$1.sendSlotChange` — the `ContainerSynchronizer` — builds
# `ClientboundContainerSetSlotPacket(containerId, incrementStateId(), slot,
# stack)`, and `sendInitialData` calls the same method for
# `container_set_content`. `broadcastChanges` walks every slot once a tick into
# `synchronizeSlotToRemote`, which sends only where `RemoteSlot.matches` is
# false. So the wire value counts packets sent on that menu since it opened,
# not changes made, and which 50 ms tick sweep saw which intermediate state
# decides whether an earlier write cost one packet or two. Every later packet
# on that menu inherits the difference.
#
# REBASED, NOT DROPPED, AND THAT DIFFERENCE IS THE WHOLE DELIVERABLE. A decoder
# that dropped the field would stop all three flapping too and would be wrong:
# how far the counter moves *between two packets on one menu* is real behaviour
# a check may legitimately assert. Both halves are pinned by tests, and both
# wrong decoders were injected on the Threadripper and confirmed to redden
# them:
#
#   drop the field (every state -> 0)   5 tests fail, incl.
#                                       two_streams_differing_in_the_gap_...
#   no rebase at all                    7 tests fail, incl.
#                                       two_streams_differing_only_in_session_
#                                       history_project_the_same
#
# WINDOW 0, STATED EXPLICITLY, BECAUSE IT IS THE CASE ALL THREE LAND ON. The
# `window` FIELD of the player's own inventory is the constant 0 and is still
# left alone — it is a name, not a draw. The `state` COUNTER on that same
# window 0 is rebased like any other, and it is the one that pays:
# `InventoryMenu` is created with the player and never closes, so window 0 is
# the only menu whose counter accumulates across the whole corpus run. That is
# what `ci/checks/gameplay/README.md` is about when it requires `790` to stay
# the highest-numbered check.
