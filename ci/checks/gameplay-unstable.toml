vanilla's: the normalised `entity` field also moved, 1 in one run and 0 in the
other. `Normalizer::entity` numbered ids by order of first sighting **across
every packet recorded on the connection**, including packets the check's own
`observe` list excludes; in one run a stray `move_entity` for the other player
arrived before the drop and took number 0, and in the other it did not.

**Fixed 2026-08-04** — the numbering moved into `compare::project`, over the
observations a check actually looks at, and `crate::trace::entity_ref` records
the raw id until then. It did not remove this entry and was never going to:
