field = "add_entity — the spawn rotation; AND set_entity_data — the sound variant (2026-08-19)"
why = """
`EntityType.spawn` calls
`entity.snapTo(x, y, z, Mth.wrapDegrees(serverLevel.getRandom().nextFloat() * 360.0F), 0.0F)`.
The yaw of any spawned mob is a fresh draw from the level's shared RNG,
which is unseeded and whose stream position depends on everything else the
level has done. No implementation can match it, including vanilla.

CORRECTED 2026-08-19, branch `mobs-tick-surface`: the paragraph above is
sufficient to explain the FLAP and it is not sufficient to explain what a fix
would have to address. There are TWO unseeded draws in this scenario's
projection, on two different packets, and this row named one.

Measured by `ci/mob-projection-search.py` over 16 distinct recordings on one
recorder schema, 120 pairs (see `ci/checks/mob-projection.json`):

    observe as declared                          0/120     0.0%
    observe, minus y_rot + y_head_rot           34/120    28.3%
    {add_entity} minus y_rot + y_head_rot      120/120   100.0%
    {set_entity_data} alone                     34/120    28.3%

Removing the rotation takes `add_entity` to EXACT and takes the scenario to
28.3%, not to 100%, because `set_entity_data` is independently unstable. Its
cause, from the jar:

    Pig.finalizeSpawn -> PigSoundVariants.pickRandomSoundVariant(
                             registryAccess(), level.getRandom())
                      -> Registry.getRandom(RandomSource) -> setSoundVariant

a uniform pick over `minecraft:pig_sound_variant`, three entries in the shipped
jar: `big`, `classic`, `mini`. Same unseeded generator, different call site,
different packet.

The other two sources in that blob are `Mob.finalizeSpawn`'s
`nextFloat() -> setLeftHanded` (a 5% draw) and `AgeableMob.finalizeSpawn`'s
`nextFloat() -> setAge`. Five distinct payloads over 16 runs at 8/3/3/1/1 reads
as three sound variants with two rarer left-handed ones beside them — the
recorded field is a digest, so that decomposition is inference and is not
claimed as more.

AND ONE DRAW THAT DOES NOT REACH A CLIENT, which is the row that would
otherwise be mis-filed here. `Mob.finalizeSpawn` also calls
`RandomSource.triangle(0.0, 0.11228)` into a `FOLLOW_RANGE` modifier — a
CONTINUOUS draw, which looks like the worst case there is. It is not a case at
all: `{update_attributes}` alone is 120/120 identical over the same sixteen
runs. `Attributes` registers `FLYING_SPEED` through
`RangedAttribute.setSyncable(true)` at offsets 420-424 and registers
`FOLLOW_RANGE` at 430-451 with NO `setSyncable` call, so `isClientSyncable()`
is false and no client is ever told. A divergence in the server is not a
divergence on the wire.

The `flaps`, `comparisons` and `runs` above are untouched: they were measured
at N = 26 in 2026-08-04 and they were right. Only the mechanism was
under-described, which is the field this file exists to carry."""

