# Cargo.lock versions that must not drift silently.
#
# WHY THIS EXISTS
#
# `crates/rustmc-server` depends on `grit-plugin-api` via a PATH dependency on
# the sibling `../plugins` checkout (docs/AGENT-BRIEF.md, "THE TREE DOES NOT
# BUILD ALONE"). A path dependency still gets a `version` in `Cargo.lock`, and
# cargo re-resolves it from whatever the sibling's own `Cargo.toml` currently
# says every time the lock is regenerated. Every worktree on this box shares
# one `../plugins` checkout, and it moves on its own schedule: found
# 2026-08-17 sitting at 0.3.0 while `origin/main`'s `Cargo.lock` pins 0.2.1,
# with no branch having bumped it on purpose. Any agent that builds, and every
# agent builds, re-resolves the lock to 0.3.0 in its own worktree; the next one
# that commits `Cargo.lock` — for any reason, in any diff that happens to
# touch it — carries that bump into main with no review and no mention.
#
# WHY A RATCHETED PIN AND NOT A PATH PIN ON THE SIBLING
#
# The sibling is deliberately NOT frozen. AGENT-BRIEF.md ships it fresh on
# every `ci/t0-remote.sh` run for the same reason `data/vanilla` is copied
# rather than symlinked: "a directory nobody re-checks is how a gate ends up
# measuring whichever branch last touched it." Pinning the checkout to a fixed
# rev would fight that design and would need `../plugins` and this repo to be
# bumped in lockstep by hand forever. A version bump here should be visible
# and reviewed, not impossible — this file is what makes it a diff instead of
# a silent drift.
#
# ADDING A PIN: add it here. BUMPING ONE: change the version in the same
# commit that intentionally moves the dependency, and say why.

[[pin]]
package = "grit-plugin-api"
version = "0.3.0"  # bumped from 0.2.1 on landing, 2026-09-04: main's Cargo.lock has carried 0.3.0 since cb358498c 2026-08-18 Cargo.lock: grit-plugin-api 0.2.1 -> 0.3.0, which every cargo run was rewriting, matching ../plugins (workspace version 0.3.0); the pin was written before that commit and is the stale side
why = "path dependency on the sibling ../plugins checkout, which is shared and unpinned by design; see the header above"
