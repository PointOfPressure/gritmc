# Every entity type a check in `ci/checks/gameplay/` puts in the world.
#
# Read `ci/entity-reach.py`'s header first. The short version is that the
# interesting column is **`rotation`**, not the type:
#
#   * `chosen` — the route passes a rotation the server decided. The four
#     rotation bytes of `add_entity` are then comparable and the type is
#     GRADEABLE.
#   * `drawn`  — the route draws the rotation from an unseeded `RandomSource`,
#     so vanilla cannot reproduce it against itself and neither can anything
#     else. The type is reachable and UNGRADEABLE on those bytes, whatever the
#     server does.
#
# `drawn` is not a defect and it is not a work item. It is a property of the
# jar, and the only honest responses to it are a declaration in
# `ci/checks/gameplay-unstable.toml` (which is where `080-spawn-egg-makes-a-mob`
# and the two item-drop checks already are) or a narrower comparison that
# removes exactly the drawn field and nothing else (which is what
# `compare::project`'s `y_rot` arm does for `minecraft:item`).
#
# `ci/entity-reach.py --check` re-derives both directions against the check
# files: a row naming a type the jar does not have, a row naming a check that
# is gone, and a check that observes `add_entity` and is not named here. The
# third is the one that matters — it is the same failure `ci/checks/
# projection-drops.toml` exists to prevent for fields, which is a loss nobody
# wrote down.
#
# `route` is a bytecode site on the pinned jar, `javap -p -c -constants`,
# 26.2. Nothing here is inferred from a decompiler or from another server.
#
# ===========================================================================
# `residue` — WHAT THE CHECK LEAVES IN THE WORLD, WHICH IS A FACT ABOUT THE
# CHECKS AFTER IT
# ===========================================================================
#
# A corpus run is ONE server and ONE session, so an entity a check spawns is
# still there when the next check runs. `ci/checks/gameplay/README.md` has a
# rule for this and the rule is narrower than the class: it is written for a
# golem that WALKS, and `ci/entity-leak-audit.py` measured, over 61 vanilla
# recordings, that five of the six leaking scenarios drop an ITEM. An item does
# not walk. It does not need to — it lives for five minutes and
# `EntityType.ITEM.trackDeltas()` is true, so it emits a `set_entity_motion`
# every time its velocity changes for the whole of that.
#
#   `session`   a player. Present for every scenario by design; not a leak.
#   `resolves`  the entity is gone before the window closes — a falling block
#               lands and becomes a block.
#   `persists`  it stays in the world and emits nothing more. Stationary
#               furniture: an item frame, an end crystal, a parked minecart.
#               Safe, and safe for a stated reason rather than by hope.
#   `drifts`    an item entity. Positionless packets for its whole despawn
#               timer.
#   `walks`     a mob with AI. The same, plus it changes chunk.
#
# **`drifts` and `walks` are both UNBOUNDED, and that is the finding this
# column exists to carry.** `compare::near` is named as the mitigation and
# cannot act on any of it: 0 of 4,496 leaked observations over 61 recordings
# carried a position, because `set_entity_motion`, `move_entity`,
# `rotate_head` and `move_entity_heartbeat` do not have one and `near` fails
# open on an observation it cannot place. Scenario ORDER is the whole
# mitigation and not a backstop.
#
# So a new check with `residue = "drifts"` or `"walks"` is a check about every
# check after it. `ci/entity-reach.py --check` requires the column, which is
# the cheap half; the expensive half is that the number in `residue_why` has to
# have been measured, at a stated N, by `ci/entity-leak-audit.py`. A margin
# measured once is not a bound — `ci/checks/gameplay/README.md` records what
# that cost at N = 2.

# ---------------------------------------------------------------------------
# ROUTE: item-placed. `useOn` builds the entity and hands it a rotation taken
# from the placement, so two runs of one server agree and two servers can be
# compared. This is the whole of the gradeable half of the corpus's entity
# surface, and it is why `773`-`777` exist.
# ---------------------------------------------------------------------------

[[spawns]]
type = "minecraft:item_frame"
check = "an-item-frame-hangs-on-a-blocks-side"
residue = "persists"
residue_why = "an item frame is stationary furniture: it never moves and emits nothing after its spawn. Measured absent from every leak row in ~/grit/logs/entity-leak-audit-20260818.log"
route = "item-placed"
rotation = "chosen"
site = "HangingEntityItem.useOn — the direction comes off the clicked face"

[[spawns]]
type = "minecraft:end_crystal"
check = "an-end-crystal-sits-on-obsidian"
residue = "persists"
residue_why = "stationary; no leak row over 61 recordings"
route = "item-placed"
rotation = "chosen"
site = "EndCrystalItem.useOn"

[[spawns]]
type = "minecraft:minecart"
check = "a-minecart-sits-on-a-rail"
residue = "persists"
residue_why = "stationary on a level rail; no leak row over 61 recordings"
route = "item-placed"
rotation = "chosen"
site = "MinecartItem.useOn — the rail's shape decides the facing"

[[spawns]]
type = "minecraft:oak_boat"
check = "a-boat-is-placed-by-right-clicking-the-world"
residue = "persists"
residue_why = "stationary on land; no leak row over 61 recordings"
route = "item-placed"
rotation = "chosen"
