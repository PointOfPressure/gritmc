# ---------------------------------------------------------------------------
# ROUTE: carved pumpkin. The second of the two `Mob` routes in this jar, and
# the only one that puts a MOB in the world with a rotation anything can
# compare. Verified on the pinned jar 2026-08-18:
#
#   CarvedPumpkinBlock.spawnGolemInWorld(Level, BlockPatternMatch, Entity, BlockPos)
#      2  invokestatic  clearPatternBlocks
#     33  fconst_0
#     34  fconst_0
#     35  invokevirtual Entity.snapTo:(DDDFF)V      <- literal zero yaw, zero pitch
#     40  invokevirtual Level.addFreshEntity
#   and no `finalizeSpawn` call anywhere in the method.
# ---------------------------------------------------------------------------

[[spawns]]
type = "minecraft:copper_golem"
check = "a-carved-pumpkin-on-copper-makes-a-copper-golem"
residue = "walks"
residue_why = "a live wandering mob. UNBOUNDED by `within` — every kind it emits is positionless. Mitigated by ORDER alone: numbered 788, the last checks before 790. docs/PARITY-ROADMAP.md §30.4"
route = "carved-pumpkin"
rotation = "chosen"
site = "CarvedPumpkinBlock.spawnGolemInWorld offsets 33-35"

[[spawns]]
type = "minecraft:iron_golem"
check = "a-carved-pumpkin-on-iron-makes-an-iron-golem"
residue = "walks"
residue_why = "a live wandering mob, same disposition as 788, numbered 789"
route = "carved-pumpkin"
rotation = "chosen"
site = "CarvedPumpkinBlock.spawnGolemInWorld offsets 33-35"

# ---------------------------------------------------------------------------
# ROUTE: gravity. `FallingBlockEntity` is not a `Mob`, takes neither route
