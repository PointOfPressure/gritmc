# ---------------------------------------------------------------------------
# ROUTE: spawn egg. `drawn`, and the reason 88 more entity types being one
# `hold` away is a warning rather than a queue.
#
#   EntityType.create(ServerLevel, PostSpawnProcessor, BlockPos,
#                     EntitySpawnReason, boolean, boolean)
#     103  invokeinterface RandomSource.nextFloat:()F
#     111  invokestatic    Mth.wrapDegrees:(F)F
#     115  invokevirtual   Entity.snapTo:(DDDFF)V
#     168  invokevirtual   Mob.finalizeSpawn:(...)
#
# `080-spawn-egg-makes-a-mob` is declared in `ci/checks/gameplay-unstable.toml`
# at 25 flaps in 25 comparisons over N = 26 cold vanilla servers, and is one of
# the four names in the standing floor.
# ---------------------------------------------------------------------------

[[spawns]]
type = "minecraft:pig"
check = "spawn-egg-makes-a-mob"
residue = "walks"
residue_why = "864 leaked observations over 61 recordings, 0 placeable, reaching `chest-opens-a-screen` in 40 of 61 and `redstone-torch-powers-wire` in 17 of 61. A live wandering mob at check 80 of 115, which the live-mob ordering rule does not cover and cannot: 080 predates the rule and moving it would renumber a third of the corpus"
route = "spawn-egg"
rotation = "drawn"
site = "EntityType.create offsets 103-115"

[[spawns]]
type = "minecraft:bat"
check = "a-bat-left-far-away-despawns-and-a-pig-does-not"
residue = "resolves"
residue_why = "the check's own mechanism: the bat is 150 blocks from both players and `Mob.checkDespawn` discards it (Bat inherits `Mob.removeWhenFarAway`, iconst_1) before the actor walks back, so it is gone before the window closes. Rowed when `mob-in-world` was rebased onto 3611 and this gate found 082 undeclared"
route = "spawn-egg"
rotation = "drawn"
site = "EntityType.create offsets 103-115"

[[spawns]]
type = "minecraft:pig"
check = "a-bat-left-far-away-despawns-and-a-pig-does-not"
residue = "walks"
residue_why = "`Animal.removeWhenFarAway` is iconst_0, so the pig survives the despawn the check measures and is re-announced on the last step; it is a live wandering mob for every check after 082, like 080's. Unmeasured: no leak audit has been taken over a recording that carries 082"
route = "spawn-egg"
rotation = "drawn"
site = "EntityType.create offsets 103-115"

