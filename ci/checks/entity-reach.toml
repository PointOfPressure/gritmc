# ---------------------------------------------------------------------------
# ROUTE: console summon. `SummonCommand.createEntity` builds the entity with
# `EntityType.create` — for an orb the two-argument constructor
# `ExperienceOrb(EntityType, Level)`, which draws only `Entity.<init>`'s uuid —
# loads the tag, and `snapTo(x, y, z, getYRot(), getXRot())` keeps the zero
# rotation it was built with. So the four rotation bytes and the movement are
# deterministic. (`ExperienceOrb.award`'s orbs go through the four-argument
# constructor, which draws a yaw and a velocity at offsets 20-102; no check
# here observes one.) The orb is picked up inside each window — vanilla's own
# recording carries the `remove_entities` in all three, `xp-orbs` run r2.
# ---------------------------------------------------------------------------

[[spawns]]
type = "minecraft:experience_orb"
check = "an-orb-beside-a-player-is-picked-up"
residue = "resolves"
residue_why = "touched on the actor's next doTick and discarded; vanilla's recording carries the remove_entities inside the window (xp-orbs r2, 2026-10-01)"
route = "summon"
rotation = "chosen"
site = "SummonCommand.createEntity -> ExperienceOrb(EntityType, Level): no yaw or velocity draw; snapTo keeps yRot 0"

[[spawns]]
type = "minecraft:experience_orb"
check = "an-orb-four-blocks-away-creeps-to-the-player"
residue = "resolves"
residue_why = "follows the actor and is taken about 2 s in; vanilla's recording carries the remove_entities inside the 8 s window (xp-orbs r2, 2026-10-01)"
route = "summon"
rotation = "chosen"
site = "SummonCommand.createEntity -> ExperienceOrb(EntityType, Level): no yaw or velocity draw; snapTo keeps yRot 0"

[[spawns]]
type = "minecraft:experience_orb"
check = "an-orb-of-count-two-is-taken-twice"
residue = "resolves"
residue_why = "taken twice two ticks apart and discarded at count 0; vanilla's recording carries the remove_entities inside the window (xp-orbs r2, 2026-10-01)"
route = "summon"
rotation = "chosen"
site = "SummonCommand.createEntity -> ExperienceOrb(EntityType, Level): no yaw or velocity draw; snapTo keeps yRot 0"

# ---------------------------------------------------------------------------
# ROUTE: dropped item. `drawn`, and this is the one drawn route the corpus has
# a narrow answer for.
#
#   ItemEntity(EntityType, Level) offsets 39-52
#     setYRot(this.random.nextFloat() * 360.0F)      <- unseeded RandomSource
#
# `compare::project` removes `y_rot` and ONLY `y_rot`, and only when `kind_id`
# resolves to `minecraft:item`, leaving `x_rot`, `y_head_rot` and `data` under
# comparison — all three are a constant 0 for every item vanilla has spawned.
# `ci/checks/projection-drops.toml` carries the row as
# `add_entity.y_rot_of_an_item`.
#
# The exemption does not rescue the whole packet. `350` and `500` are two of
# the four names in the standing floor, and their first difference is not the
# yaw: it is `at` (the spawn position) for `350` and `set_entity_motion.v` for
# `500`, which are four further unseeded draws that no projection removes.
# ---------------------------------------------------------------------------

[[spawns]]
type = "minecraft:item"
check = "a-dropped-item-goes-into-your-inventory"
residue = "drifts"
residue_why = "448 leaked observations over 61 recordings, 0 placeable. The pickup is the point of the check and it happens, so what leaks is the item between spawn and pickup"
route = "dropped-item"
rotation = "drawn"
site = "ItemEntity(EntityType, Level) offsets 39-52"

[[spawns]]
type = "minecraft:item"
check = "dropping-an-item-throws-it-on-the-floor"
residue = "drifts"
residue_why = "912 leaked observations over 61 recordings, 0 placeable. Nothing picks this item up; it lives its full despawn timer"
route = "dropped-item"
rotation = "drawn"
site = "ItemEntity(EntityType, Level) offsets 39-52"

[[spawns]]
type = "minecraft:item"
check = "container-click-throw-drops-one-item"
residue = "drifts"
residue_why = "148 leaked observations over 61 recordings, 0 placeable"
route = "dropped-item"
rotation = "drawn"
site = "ItemEntity(EntityType, Level) offsets 39-52"

[[spawns]]
type = "minecraft:item"
check = "container-click-throw-drops-the-whole-stack"
residue = "drifts"
residue_why = "816 leaked observations over 61 recordings, 0 placeable"
route = "dropped-item"
