[[spawns]]
type = "minecraft:item"
check = "shears-shear-a-sheep"
residue = "drifts"
residue_why = "0 leaked observations over 2 recordings (pm-rec3 runs 1 and 2, the 640-659 subset, ci/entity-leak-audit.py), 0 placeable: the one to three wool items fall into the pit at z -641, out of every later rig's view. Measured on a subset, not a corpus order"
