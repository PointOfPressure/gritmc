# corpus-shard-equivalence.toml — does RUSTMC_CORPUS_SHARDS change what T2 measures?
#
# Written by `ci/corpus-shard-equivalence.py compare` over three recordings of one
# scenario set in one tree: a serial run, a second serial run (the CONTROL — vanilla's
# own floor at N=2), and a sharded run. A scenario is a shard effect only if it
# disagrees sharded-vs-serial and NOT serial-vs-serial, under the recorder's own
# projection in both directions, per side, and in the report verdicts; declared
# vanilla-unstable scenarios are excused on the vanilla/verdict sides only.
# `--check` (T0) refuses a SHARDS default with no controlled EQUIVALENT run here over
# >= 50 scenarios. Pairs are [sharded-vs-serial, control-vs-serial].
# Box: sayer-desktop, Threadripper 1920X, 24 threads; trees ~/rustmc-cpar-a and -b.
# The full-corpus sharded runs recorded while ANOTHER full serial run was recording
# in the other tree, so they are also the pool's concurrency test.

[[run]]
id = "s23-shard4-1-20260924"
shards = 4
scenarios = 23
controlled = true
verdict = "RED"
commit = "5698acbce"
serial_wall_s = 625.5
control_wall_s = 612.6
sharded_wall_s = 128.0
run_rc = [0, 0, 0]
rustmc_disagree = [1, 0]
vanilla_disagree = [3, 2]
verdict_flips = [0, 0]
shard_effect = ["a-daylight-detector-inverts-when-right-clicked"]
