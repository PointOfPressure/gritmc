# ---- 2026-10-01, the third serial control (full-C, 67aa6fb6b, recorder identical
# to 0ec801e1f) and a fresh 8-shard run (full-S8b), both under one corpus-lock
# hold in ~/rustmc-sheq (walls: seconds from the lock being held or inherited to
# the run's last line); every isolated sharded run re-scored against TWO serial
# controls (the floor is their union). One effect is left at every count, in
# the first shard: `084-a-pig-tempted-from-outside-its-pit-turns-its-head-and-
# stays-put`. Its strict verdict follows whether a pig ambient `sound` lands in
# the window on EITHER side — vanilla 3 and ours 2 of the ten full recordings
# here; every serial run had one on exactly one side, no sharded run had one on
# either. `Mob.baseTick`'s roll (`nextInt(1000) < ambientSoundTime++`, from 0
# at spawn) gives it ~30% per side in this window, so this is chance, not load
# (corrected; the first reading said 3/3 vs 0/3 on our side), and no window
# placement removes it. Still a verdict a sharded gate could read differently. RED; the default stays 1. A vanilla floor over
# full-A/B/C (ci/corpus-floor.sh, N=3) does not list 084 as unstable either, so
# `gameplay-floor.toml` would not excuse it and was not rewritten.

