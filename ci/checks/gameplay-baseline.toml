# THE SIGN FAMILY. `ServerboundSignUpdatePacket` (61) is the verb; these are
# its checks. All three are `absent`: vanilla answers a valid sign edit with
# two packets and this server answers with none.
#
# **They measure the VERB and not the placement, which is not obvious and is
# the reason the rig is shaped the way it is.** The sign is placed in
# `[[setup]]`, and `record.rs` pumps setup into a scratch recording it throws
# away, then settles, before the measured window opens. So the placement gap —
# which is real, and is what `270` and `460` are diverging on — contributes
# nothing here. What vanilla emits inside the window is
# `SignBlockEntity.updateSignText`'s own tail: `sendBlockUpdated(pos, state,
# state, 3)`, which re-broadcasts the *same* state and so shows up as a
# `block_update` carrying `oak_sign[rotation=8,waterlogged=false]`, plus the
# `block_entity_data` holding the text. Measured 2026-08-05.
#
# THE GREEN THAT WOULD HAVE BEEN THE BUG. `handleSignUpdate` has TWO silent
# refusals — no `SignBlockEntity` at the position, and a sender who is not
# `getPlayerWhoMayEdit()` — and each returns with no packet and no error, the
# whole effect being one LOGGER.warn. This server has no sign block entities
# anywhere, so at any position that is not a sign it is byte-identical to
# vanilla. A check that simply sent `sign_update` somewhere would have recorded
# silence against silence and reported `match`. All three therefore PLACE the
# sign themselves as the same player: `SignBlock.setPlacedBy` -> `openTextEdit`
# is the only thing that ever sets the permitted editor, and it is what makes
# vanilla's answer unconditional.
#
# 571 is the discriminating one and it is 561's shape. `updateSignText` calls
# `setAllowedPlayerEditor(null)` at offsets 57-61 BEFORE it broadcasts, so the
# token is spent and a second `sign_update` at the same position is refused:
# vanilla emits ONE `block_entity_data` from two identical edits, not two. The
# obvious wrong implementation — "write the text and broadcast" — passes 570
# and fails here. That cannot be watched failing until signs exist at all,
# which is stated rather than implied: today all three are `absent` for the
# same reason, and 571 only starts discriminating once 570 can pass.
typing-on-a-sign-you-placed-sets-its-text = "match"
a-second-edit-of-the-same-sign-is-ignored = "match"
a-sign-update-for-the-back-face-is-carried = "match"

