# `ci/checks/gameplay-falsifiable.toml` corroborates the mechanism from the
# other side. `update_attributes.entity` and `update_attributes.rest` are two
# of the twelve `[[unaskable_field]]` pairs — "the reference records this and
# this server never sends it, so axis B has nothing to perturb" — which is
# exactly the population a coverage change like this exists to shrink.
#
# **It is commented out, and the reason is this file's own rule twelve
# hundred lines up: "A baseline entry may only ever be written from the full
# gate."** Two things stop that here and neither is a matter of taste:
#
#   1. **The row cannot be written without the scenario edit, and the
#      scenario is not this area's file.** `530-…​.toml`'s `observe` list
#      belongs to the packets lane. Writing `diverge` here against an
#      unmodified scenario would ratchet the check DOWN for a reason that
#      does not exist in this tree yet: `ci/t2-gameplay.sh` would read the
#      unchanged check as `match`, and a baseline row below the measured
#      verdict is not a refusal, it is silent slack — the ratchet would stop
#      catching a real fall to `diverge` from any other cause.
#   2. **The 98 is not a figure taken on `main`.** It comes from the packets
