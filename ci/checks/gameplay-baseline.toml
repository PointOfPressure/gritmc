#   560  diverge -> diverge    the wrong fix buys nothing
#   561  match   -> DIVERGE    "we also sent: container_set_slot"
#   562  diverge -> diverge    vanilla fills slot 0 with the recipe result
#                              where the fake echoed slot 1
#
# So 561 can fail, it fails for its own reason, and the fix it refuses gains
# nothing on the other two. The arm was reverted; it is not in this branch.
#
# All three depend on the window counter, like the four menu checks above:
# `nextContainerCounter` runs for the life of the player and one actor plays
# the whole corpus, so these open menus 5, 6 and 7 and say so. See
# `ci/checks/gameplay/README.md` — the menu checks are one indivisible item in
# corpus order and these three join the end of it.
