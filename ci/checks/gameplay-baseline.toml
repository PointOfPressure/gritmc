# BLOCK ENTITIES, 760-772 — 2026-08-12, branch `gameplay-block-entities`.
#
# Thirteen checks, all entering at `match`, which is unusual enough in this
# file to need saying why: the mechanism was **ported in the same branch that
# wrote the checks**, off payloads recorded from a real 26.2 socket by
# `ci/block-entity-probe.sh`. They are not a discovery that this server was
# already right.
#
# What they cover: eleven `minecraft:block_entity_type`s that had never been
# observed by any check. `BlockEntity.getUpdatePacket()` is
# `aconst_null; areturn` and 29 of the 49 registered types inherit it, so
# vanilla never sends `block_entity_data` for them at all, which caps THAT
# channel at 20 of 49. `docs/PARITY-ROADMAP.md` §25.
#
# **That was written here as a ceiling on the census ROW, and as of `788`
# below it is not one.** The row's second channel is the chunk payload, which
# vanilla fills with every block entity in the chunk and applies no
# `getUpdatePacket` filter to; it was invisible only because
# `trace::is_housekeeping` dropped `LEVEL_CHUNK_WITH_LIGHT` before any decoder
# saw it, and it no longer does. The 20 keeps its rule, its section and its
# channel. What caps the row is open. §31.
#
# **Shown able to go red before being trusted**, per §20.7. Two defects were
# injected and the subset re-run on 2026-08-12, Threadripper, on a third cold
# vanilla:
#
#   * `for_state` no longer recognising `minecraft:decorated_pot`
#   * `Kind::HangingSign.id()` answering `minecraft:sign` — one wrong integer
#     on the wire and every other byte of the packet correct
#
# and the four checks those touch went red while 762, 767 and 770 stayed
# `match` as the controls that the run itself was sound. See the commit.
#
# Stability: the payloads were identical across three separate cold vanilla
# boots on 2026-08-12 (the probe, the subset, the falsification run). The
# three types whose payload is **not** stable are deliberately not here —
# `mob_spawner` redraws `Delay` as `min + nextInt(max - min)`, `vault` rerolls
# `display_item` and carries a per-run uuid, and neither could ever be `match`
# for anybody.
