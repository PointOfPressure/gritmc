# COMBAT — the first two checks in this corpus that hit something.
#
# A read-only sweep on 2026-08-05 enumerated 92 mechanics and found 33 with
# zero checks, and the top of that list was not an unwritten check: it was an
# unwritten **verb**. `scenario.rs`'s `Step` enum had no way to express hitting
# anything, so `damage_event`, `set_health`, `entity_event` and `animate` were
# not untested, they were untestable — no `.toml` could have observed them
# whatever either server did. All four have had decode arms in `trace.rs` the
# whole time, and one of them (`damage_event`) had already been repaired for a
# trap nothing had ever sprung.
#
# Both are `absent` and both are honest: this server sends neither the swing
# broadcast nor anything at all in response to an attack.
#
#   attacking-another-player      vanilla plays sound 1304,
#                                 `minecraft:entity.player.attack.nodamage` —
#                                 the target is a creative player, so
#                                 `hurtServer` refuses the damage and the
#                                 no-damage sound is what survives
#   attacking-from-out-of-range   attacks twice in one scenario, far then
#                                 near, and vanilla answers with exactly ONE
#                                 sound — `handleAttack` returns at its reach
#                                 test on the far one before touching the
#                                 target
#
# The second is the discriminating one. A server that answers the attack packet
# the moment it arrives — no reach test — reaches `match` on the first and
# produces two sounds here, which is the defect a single combat check would
# have locked in.
#
# `absent` is the honest floor for both. It fails loudly if either is fixed,
# and it cannot be reached by deleting anything.
#
# THE SECOND ONE FAILED ITS FIRST GATE, AND THE REPAIR IS WHY IT IS ONE FILE.
#
# It was originally two files: one attack from far away, asserting silence.
# That measured `absent` in a chain dir and **`vacuous` in `~/rustmc-gate`** —
# same commit, different directory, different verdict — because its entire
# vanilla trace was a single `animate` broadcast to the observer, and
# `ChunkMap$TrackedEntity.updatePlayer` gates entity broadcasts on
# `isChunkTracked(player, entityChunkX, entityChunkZ)`. The actor stood in
# chunk z 1 and the observer had no other reason to have streamed it; deep in a
# 67-scenario run it had not.
#
# A check asserting an absence, whose only positive content is one incidental
# packet, is one perturbation from proving nothing. Both attacks now live in
# one scenario so the near one's sound keeps the trace non-empty by
# construction, and both files observe `from = "actor"` only — the actor's own
# attack sound sits in the chunk the actor is standing in, which it necessarily
# tracks. `animate` is out of both `observe` lists: it is precisely the fragile
# packet, and `Step::Swing` is where swing coverage belongs.
attacking-another-player = "match"
attacking-from-out-of-range = "match"

