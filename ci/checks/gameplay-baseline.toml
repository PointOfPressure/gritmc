# **`diverge`, and it was `match` for exactly one gate. The correction is the
# point of this comment.**
#
# It was locked at `match` on 2026-08-04 with the 1-in-25 flap written out
# beside it, on the argument that a softer floor would hide a real fall. The
# very next gate run went red on it. **Disclosing a risk is not mitigating
# one**, and the argument was wrong on its own terms — see below.
#
# THE MEASUREMENT, from the two recordings the red gate compared:
#
#     vanilla  6 events   59 254 519 737 987 1237 ms   gaps 195 265 218 250 250
#     ours     5 events   64 264 514 764 1014     ms   gaps 200 250 250 250
#
# Same `b0`/`b1` (1, 1), same position, same block id, same start (~60 ms),
# same mean gap — 235.6 ms against 237.5 ms. **Nothing about the mechanism
# differs.** Our sixth repeat would have landed at 1264 ms and vanilla's sixth
# landed at 1237, so the window edge sits somewhere in a **27 ms band** and
# decided the verdict. Our cadence is in fact the *more* regular of the two:
# exactly 250 ms every time, against vanilla's 195-265 jitter.
#
# WHY `match` WAS AN UNSUPPORTABLE FLOOR, WHICH IS THE PRINCIPLE
#
# A ratchet floor is an assertion about what the **reference** can reproduce.
# `verdict_for` is exact sequence equality, and here the reference is not
# deterministic in the number of repeats it emits inside the window. So
# `match` was never a property of this server — it was a property of this
# server *and* a coin toss, and locking a coin toss into a gate asserts
# something no single run can support. That is the same error as publishing a
# figure from one run, which this project already forbids everywhere else.
#
# The old argument — "a floor of `diverge` would hide a real fall to
# `diverge`" — assumed a fall to `diverge` is a distinguishable event. For
# this check it is not: `diverge` is a legitimate outcome of a *healthy*
# server about one run in ten. You cannot protect against a transition you
# cannot observe.
#
# WHAT THIS FLOOR DOES AND DOES NOT CATCH, STATED SO NOBODY ASSUMES
#
# Caught: the lid mechanism dying entirely (`absent`), which is below this
# floor. NOT caught: a wrong `b1`, a wrong position, or a wrong block id,
# because all three keep the verdict at `diverge`. **That hole is real and it
# is the price of this floor.** It is closed properly by the projection change
# proposed in `docs/WORKLIST.md`, not here.
#
# ⚠ **THE WARNING BELOW IS SPENT, AND ONLY BECAUSE THE CAUSE WAS REMOVED.**
# It read: do not re-lock this at `match` when the gate prints `BETTER`, it
# will print `BETTER` nine runs in ten, and locking it is what produced the red
# gate of 2026-08-04. That was correct for as long as the projection sampled
# the repeat count. **It is not a warning against locking a floor; it is a
# warning against locking a floor the reference cannot reproduce.** If the
# cadence ever re-enters this check's projection, it applies again unchanged.
#
# `collapse_repeats = ["block_event"]` landed 2026-08-05. A run of identical
# consecutive observations compares as one, so the reference is no longer
# sampling how many of a 5-tick repeat fall inside `settle_ms`, and `match`
# becomes a floor a single run can support. Measured, not argued:
# `ci/selfcheck-recompare.sh` over the **same 26 saved vanilla recordings** the
# old rate came from gives 1/25 with the line stripped and **0/25** with it,
# and every one of those flaps was the last `block_event` alone — byte
# identical in `at`, `b0`, `b1` and `block`. See `gameplay-unstable.toml`.
#
# The hole the old floor left open — a wrong `b1`, a wrong position or a wrong
# block id all reading as `diverge` and so being invisible above a `diverge`
# floor — is closed by this lock, which was the point of making the change
# rather than widening the verdict set.
#
# What this check no longer tests is the cadence itself. That coverage is
# `rustmc_server::containers::tests::
# the_wire_cadence_is_one_signal_every_check_tick_delay_ticks`, which measures
# the gap rather than the count and shipped in the same branch.
