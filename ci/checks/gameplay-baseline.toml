# The accepted state of the gameplay corpus.
#
# A **ratchet**, not a pass list. Most of this is `diverge` or `absent`, and
# that is the honest description of a server whose gameplay half is young.
# A gate demanding `match` everywhere would mean nothing could ever land.
#
# What the gate refuses:
#   * a scenario going backwards — `match` becoming `diverge`, `diverge`
#     becoming `absent`;
#   * a scenario that is not listed here at all, so a new check has to state
#     where it starts, which is the moment somebody reads it;
#   * `vacuous`, `inert` or `error`, which are never listed because none of
#     the three says anything about the server. Those fail regardless of this
#     file.
#
# Measured 2026-08-03 against vanilla 26.2, protocol 776, on superflat, on
# the Threadripper. Seed 20260803, `spawn-radius=0`, workspaces at absolute
# `(-(n+1) * 32, spawn_y, 0)`.
#
# **Corpus 37 -> 51.** The fourteen added on 2026-08-03 went into the three
# areas with almost no coverage — redstone had three checks for the whole
# subsystem, block entities had one, and inventory could only watch itself
# change as a side effect of a block. Nine of the fourteen came back
# `diverge` and five `absent`, and **all fourteen are live**: the corpus is
# still 0 vacuous, 0 inert, 0 error, which matters more than the match count
# and is the property that must not regress.
#
# Every new line below names a mechanism somebody can go and build, and the
# missing observation kinds say which:
#
#   block_event            4 checks — pistons, the note block, the chest lid
#   open_screen            2 — a furnace menu and a crafting table menu
#   add_entity             1 — an item entity for a dropped stack
#   container_set_slot     1 — the offhand swap
#   open_sign_editor       1 — placing a sign opens its editor
#   section_blocks_update  2 — one packet where we send two
#
# Three of the new checks are missing **no kinds at all** and diverge only on
# content, which puts them closest to green: the redstone-torch inverter
# (5 observations against our 3), the observer pulse (6 against 4) and the
# repeater delay, which is **8 against 7** — one observation short.
#
# **Two checks in this file can never reach `match`.** `spawn-egg-makes-a-mob`
# and `a-dropped-item-goes-into-your-inventory` are declared in
# `ci/checks/gameplay-unstable.toml`: vanilla disagrees with *itself* about
# them, because a mob's spawn yaw and a dropped item's position are fresh
# draws from `level.getRandom()`. They are baselined at their honest verdict
# and the ratchet still works, but do not read them as two defects.
#
# It said **three** until 2026-08-10, the third being `water-spreads`, which is
# now parked in `ci/checks/gameplay/open/` and is not loaded at all. Its
# instability is a different mechanism from these two — not a random draw but
# which tick's broadcast each spread landed in — and it is still recorded in
# `gameplay-unstable.toml`, which is measurement and not a gate input.
#
# Three things no check here can exercise, so a green result must not be read
# as covering them: section `z` is never negative (workspaces sit at `z = 0`),
# no scenario changes blocks in two chunks at once, and none fires two
# actions inside one tick.
#
# **`lever-flips-when-right-clicked` is `match` as of the 2026-08-03 evening
# run** — the first check moved by the `useWithoutItem` path. It went
# `diverge -> match` on `crate::useblock` porting `LeverBlock`, exactly as
# predicted from its shape: it was missing no observation kinds and was one
# observation short, vanilla sending `lever[powered=true]` where this server
# sent `powered=false`.
#
# **`a-repeater-delays-the-signal-it-passes-on` went `match` on the
# `use_without_item.json` extraction, and that `match` was not earned.**
#
# It was recorded here as having "falsified the prediction written beside it"
# — the check was expected to need redstone signal propagation for the wire in
# front of the repeater and appeared not to, cycling DELAY being the whole
# gap. Measured 2026-08-03 against vanilla on both selfcheck runs: the
# repeater stayed `powered=false` for the whole scenario and **no
# `block_update` was ever recorded at the wire, in vanilla either**. The rig
# was inverted, so no propagation happened for anybody and the check was
# resting on its resyncs.
#
# `DiodeBlock.getStateForPlacement` sets `FACING` to
# `getHorizontalDirection().getOpposite()`, pointing it back at the placer, and
# `getInputSignal` reads `level.getSignal(pos.relative(FACING), FACING)` — the
# block FACING names is the repeater's **input**. The rig fed the redstone
# block into the output side. The check now feeds the input side and the entry
# below records what it measures with a working rig, which is a lower verdict
# than the broken one earned. A prediction is not falsified by an experiment
# that did not run.
#
# Five more moved closer without closing, and each names what is left:
#
# ```text
#   button-unpresses-itself       5 vs 4, no missing kinds. We press; the
#                                 un-press is a scheduled tick's EFFECT, and
#                                 Block.tick takes a ServerLevel.
#   door-opens-when-right-clicked 4 vs 4, missing section_blocks_update --
#                                 blocked on `setPlacedBy`, not on this: we
#                                 place ONE door half, so there is no upper
#                                 half for the open to propagate to.
#   a-comparator-...              6 vs 5, missing `sound` and nothing else.
#   a-note-block-...              6 vs 4, missing block_event and sound.
#   a-redstone-torch-...          5 vs 4, no missing kinds. The lever flips
#                                 now; the torch needs redstone.
# ```
#
# **Do not ratchet `strict`.** It moved 5/51 -> 3/51 across two runs whose
# only server change was the lever, which cannot account for two checks, and
# on 2026-08-04 it moved 5/55 -> 7/55 across two runs of a tree that had not
# changed at all. Strict carries vanilla's own run-to-run nondeterminism
# inside each scenario's box. Only the declared verdict is ratcheted, and only
# declared should be read as progress.
#
# This used to cite "the selfcheck's measured ceiling (16/37 on vanilla
# against itself)" as the reason. **Corrected 2026-08-04: there is no
# ceiling** — see the block at the foot of this file. 16/37 was one comparison
# at N = 2; at N = 12 vanilla reproduced itself under strict on 0 of 55 — and
# after the heartbeat exemption of 2026-08-04, on 35 of 60. Quantity A, vanilla
# against itself, never a parity claim.

[expect]
