# The `animate` family, added 2026-08-06 on branch `chain-signs-eviction-swing`.
#
# `animate` had **zero** coverage: the packet had a projection in
# `crate::trace` and no scenario had ever produced one. `Step::Swing` existed
# as a bare unit variant — main hand, 60 ms — and no check in the corpus used
# it, which is why the gap was invisible rather than merely open.
#
# 60 ms is the number worth keeping: it is **one tick**, and one tick after a
# swing `swingTime` is 0, which is inside the window `swing` swallows. So the
# old verb could not have expressed 581 at all — two consecutive `swing` steps
# under it produce one animation on vanilla and the scenario would have read
# as though the second packet had simply been lost. The verb now carries the
# hand and the delay, and its default is 200 ms — past the swallow — so a
# scenario lands in that branch only by saying so.
#
# All three are `observe_from = "observer"`. `LivingEntity.swing(hand)` passes
# `iconst_0` to `swing(hand, boolean)`, which selects
# `sendToTrackingPlayers` over `...AndSelf`, and `seenBy` never contains the
# entity's own player — so the swinger receives nothing and a check reading
# the actor's stream would compare silence with silence.
#
# Measured against real vanilla on the Threadripper, 2026-08-06, ports
# 26414/26415, and each one watched failing against an injected server bug
# before it was recorded here. See `docs/WORKLIST.md` for the sweep.
