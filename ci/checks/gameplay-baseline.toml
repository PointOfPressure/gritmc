# 560 and 562 are `diverge` because this server has no block entities, so a
# chest has nowhere to keep an item and a crafting table has no grid to run a
# recipe over. Both diverge at the *first click*, not at the open: vanilla
# corrects the slot that moved and this server answers nothing.
#
# 561 IS THE DEGENERATE HALF AND IT WAS WATCHED FAILING BEFORE IT WAS LOCKED.
#
# It is 560 with one number changed — `slot = 54` becomes `slot = 0` — so both
# clicks land on an empty slot with an empty cursor and vanilla, having run the
# whole click path, correctly sends nothing. The wrong fix it forbids is the
# cheap one: answer every container click with a correction for the slot that
# was clicked. That server would reach `match` on 560 without a container.
#
# Measured, not argued. A throwaway arm was put in `world_send.rs` doing
# exactly that and the subset re-run against real vanilla
# (`~/rustmc-logs/chain-container-FALSIFY.log`):
