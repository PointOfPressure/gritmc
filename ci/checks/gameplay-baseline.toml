# **Written down as a prediction, before the run that measures it**, in the
# same shape as the line above and for the same reason.
#
# The first check in this corpus whose subject is a visibility change caused
# by the *walker's* own movement rather than by the entity's, so it is the
# only one that reaches the `movedPlayers` sweep at the foot of
# `ChunkMap.tick`. It walks two round trips, one inside vanilla's 64-block
# tracking limit and one past it, so it pins the limit and not only the
# sweep.
#
# Vanilla should be silent on the first trip and emit one removal and one
# re-add on the second. This server has no server view distance: the number
# that reaches `updatePlayer` is the spawn tile's radius, which
# `ci/t2-gameplay.sh` sets to 2, so its limit is 32 blocks and it should
# remove the observer on **both** trips — four observations against two,
# which is `diverge`. The check's own file carries the derivation, including
# the first version of this prediction, which believed a false doc comment in
# our own source and guessed 160 blocks.
#
# **MEASURED, AND THE PREDICTION HELD — then the rig turned out to be the
# thing being measured.** First run: `diverge`, our extra `remove_entities` at
# step 0, exactly as written. But vanilla emitted *nothing at all*, on either
# run, because `Session::hop_to` walked 8 blocks a packet and vanilla refused
# it — `oracle moved too quickly! 0.0,0.0,16.0`, three teleports, the actor
# never further than 24 blocks from the observer. A verdict that agrees with
# the prediction is not the same as a verdict that measured it.
#
# With a legal `hop_to` (75e821c, corrected to four blocks a packet in
# b202955) vanilla emits exactly two observations, `remove_entities` at step 2
# and `add_entity` at step 3, and no rubber-band. The red/green pair on that
# rig is the one that means something:
#
#   server unfixed  diverge  vanilla removes at step 2, we remove at step 0
#   server fixed    match
#
# — which is the 64-blocks-against-32 difference and nothing else, so this
# line is `match` and it is a line that can still fail.
#
# ⚠ **LOWERED TO `diverge` ON 2026-08-05, AND THIS IS A FLOOR WEAKENING —
# READ BEFORE ACCEPTING IT.** The paragraph above is still correct about the
# *visibility* mechanism. It is wrong that `match` is a verdict this check can
# hold, and it is wrong for the second time in this file for the same reason:
# **two greens on a check written the same day are not evidence of
# reproducibility.** That is precisely what `chest-opens-a-screen` cost, and
# this line was locked at `match` under the same mistake three days later.
#
# THE MEASUREMENT, from three independent corpus runs whose traces all still
# existed on the Threadripper (`ci/verdict-diff.py` on each run's report,
# digests read out of the saved traces):
#
#   gate  2026-08-04   ours 449516d9252be94f   vanilla 449516d9252be94f  match
#   menus 2026-08-04   ours 449516d9252be94f   vanilla 449516d9252be94f  match
#   chain 2026-08-05   ours 449516d9252be94f   vanilla ec94da22c1882da2  diverge
#
# **Our bytes are identical in all three, on three different trees**, so the
# branch that exposed this did not cause it — it could not have, because the
# packet it is accused of changing is byte-for-byte what the two earlier trees
# sent. Vanilla's moved, and moved again *within* the third run: the observer's
# stream carried a third value, `2737654eceda12b3`.
#
# The field is `add_entity`'s **movement**, established by exhaustion rather
# than by eye — the decoder consumes id, uuid, type and the three position
# doubles, so `rest` is `movement | xRot | yRot | yHeadRot | data`; ours is five
# zero bytes and reproduces `449516d9252be94f` exactly; and no assignment of the
# 256³ rotation triples against `data` in {0,1,2} with the movement pinned at
# zero reproduces either vanilla value. It is
# `ServerEntity.getLastSentMovement()` for a player who is standing still, which
# depends on which tick vanilla's last motion packet went out on. A coin toss
# vanilla makes.
#
# **RE-LOCKED AT `match` 2026-08-05, AND THIS IS NOT THE TRAP.** The warning
# that stood here said: do not re-lock when the gate prints `BETTER`, because
# `match` is the modal outcome and that is how it got locked the first time.
# That warning was right and is deliberately preserved above in the history of
# this file. What makes this different is that the *cause was removed and then
# measured*, rather than the verdict being observed to be green again:
#
#   * ORACLE rule 26 was applied. `add_entity`'s movement —
#     `ServerEntity.getLastSentMovement()`, the only field that ever moved, and
#     established by exhaustion plus digest arithmetic — is now consumed and
#     discarded by `trace::decode`. The check is about visibility, not
#     velocity, and no check in this corpus claims to test a velocity.
#   * **Vanilla now reproduces itself on this check 25 times out of 25.**
#     `SELFCHECK_RUNS=26 ./ci/t2-gameplay-selfcheck.sh`, 26 cold-booted vanilla
#     servers, run 1 against runs 2..26, corpus 63, this branch, Threadripper,
#     2026-08-05: **0/25 flaps, all 25 `match`.** Under the old projection the
#     same recordings reproduce every previously published rate.
#   * Two full corpus runs against this server, either side of an unrelated
#     fix, both `match` with `reference_obs 2, subject_obs 2` and no missing or
#     extra kinds.
#
# Our own bytes were never in question: identical across three corpus runs on
# three trees before the exemption, and the tail digest is now
# `dc545a7f9dce13f5`, which is `trace::digest` of four zero bytes and was
# computed by hand before the run that confirmed it.
#
# So `match` is a floor this check can hold, and a fall to `diverge` is now a
# real signal rather than a coin toss. That is the whole point of the exercise.
walking-away-drops-a-standing-player-from-view = "match"
