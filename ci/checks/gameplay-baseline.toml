# **RED-BEFORE, observed 2026-08-07 at the rebase onto `add7297a`.** Both were
# baselined off a first run that was green, and this branch's stated control
# for them — `ci/chat-commands-falsify.sh` — is a control for the *unit tests*:
# it mutates source and runs `cargo test`. Whether a corpus check can go red
# depends on its projection, its `observe` list, its settle window and the
# runner's step, and the sweep exercises none of those. So the red was taken
# afterwards, with `ci/t2-gameplay-subset.sh` over exactly these two checks,
# against a server built to not implement either behaviour: the command
# registry with its `uuids` subnode deleted, and the serverbound CHAT packet
# still recognised and consumed (so the frame reader cannot desync and poison
# the session) but not handled.
#
#     unmutated   match   server-answers-list-uuids   match   a-player-says-something
#     mutated     absent  server-answers-list-uuids   absent  a-player-says-something
#
# `absent` requires a NON-empty reference and an empty subject, so the same
# observation also rules out the vacuous reading: vanilla did speak in both
# windows, and it was our silence that was scored.
#
# `server-answers-list-uuids` is the check that the command registry is a
# **tree** rather than a string compare: `list uuids` is a distinct node with a
# distinct reply, and until this branch the server matched the whole command
# text against `list` and would have answered it with nothing. Its component is
# gated byte-for-byte against vanilla's own codec in `ci/commands-golden.sh`,
# so a divergence here would mean the dispatch picked the wrong node rather
# than that the bytes are wrong.
#
# `a-player-says-something` is the first chat check this corpus has ever had,
# because until this branch there was no serverbound chat packet id at all —
# the packet was unnameable, not merely unhandled. It observes `player_chat`
# from the **observer**, so it measures the broadcast rather than an echo to
# the speaker.
#
# **`player_chat` is the one packet in this corpus that cannot be digested
# whole.** `SignedMessageBody.unsigned` substitutes `Instant.now()` for the
# client's timestamp, so the body carries the sending server's wall clock and
# vanilla-against-vanilla would diverge under a zero-consuming projection.
# `trace`'s `player_chat` arm consumes exactly as far as that field and stops;
# everything after it — salt, the empty last-seen list, the absent unsigned
# content, the filter mask, the chat-type holder and the sender's display-name
# component — is still compared byte for byte in `rest`.
server-answers-list-uuids = "match"
