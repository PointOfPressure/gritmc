# The seventeen candles, and these are the real debt. `CandleBlock.useItemOn`
# is `if (stack.isEmpty() && player.getAbilities().mayBuild && state.getValue(LIT))
# { extinguish(...); return SUCCESS; }` - so whether an empty-handed click puts
# a candle out is a fact about the probe's build permission, and the table
# records the permitted answer for all seventeen.

