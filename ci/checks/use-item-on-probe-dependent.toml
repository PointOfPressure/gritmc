# use-item-on-probe-dependent.toml - every row of `data/vanilla/use_item_on.json`
# whose recorded answer is a reading of the probe's own player rather than of
# the block.
#
# The sibling of `ci/checks/use-probe-dependent.toml`, enforced by the same
# `ci/check-use-probe.py` against the same twelve `UseGolden.STANCES`. Read that
# file's header for what an allowlist here means and why carrying an entry is
# worse than porting the block; nothing in it is repeated.
#
# # What is different about this half of the use path
#
# `useItemOn` is handed the held stack and `useWithoutItem` is not, and the
# stack is the thing a player's *game mode* acts through. `ItemStack.consume`
# is `if (entity == null || !entity.hasInfiniteMaterials()) shrink(n)`, and
# `Player.hasInfiniteMaterials` is `abilities.instabuild` - so every rule that
# takes the item off you reads the probe's ability set, and the recorded
# `stackAfter` is a fact about that. That is why `game_master` is the axis on
# eight of the entries below and appears nowhere in the other file: it is the
# only stance in the sweep that sets `instabuild`.
#
# **These are not defects to be ported away, and that is the difference between
# the two files.** In `use-probe-dependent.toml` an entry is a debt: the
# fence gate really does flip to face the player, and the table records one
# quarter of the circle. Here, eight of the twenty-five entries are the
# *creative-mode* branch of item consumption, which our server has to implement
# on both sides anyway - the row is right for a survival player and right for a
# creative one, and the table simply cannot hold both under one probe. The
# closing move for those is a consumer that reads `instabuild` itself, not a
# hand port. The seventeen `CandleBlock` entries are the other kind and are a
# real debt: `mayBuild` gates whether a candle can be added to a cake at all.
#
# # How to add an entry
#
# Measure it. Every field below was read out of the table
# `ci/use-item-on-golden.sh` refused to write, which is the only way an entry
# gets here: the generator names the block, the class and the exact axes, and
# `axes` is compared for equality rather than membership.

[meta]
recorded = "2026-08-12"
# Every stance in `UseGolden.STANCES`, `base` included. Pinned for the same
# reason as in the sibling file, and checked against it by
# `ci/check-use-probe-falsify.sh`: two allowlists declaring the same sweep are
# two places for that number to drift, and an allowlist pinned to the wrong
# sweep width is the `sweep-shrank` injection arriving by copy-paste.
# 12 -> 14 on 2026-08-18, matching `ci/checks/use-probe-dependent.toml`.
# `hungry` and `invulnerable` are the two halves of `Player.canEat(false)`; see
# that file's header. Neither moves a row in this table, and the count is pinned
# here for the same reason it is pinned there — a sweep that quietly stops
# sweeping makes every row look constant.
stances = 14
# Empty since 2026-08-12, and the emptiness is the finding.
# `full_inventory` was unavailable in both tables until
# `UseGolden.bindItemComponents` was added: `new ItemStack` reads
# `Holder.Reference.components()`, which `Bootstrap.bootStrap()` alone does not
# bind. `useItemOn` cannot be probed at all without an `ItemStack`, so this
# table could not have existed under that limit - which is why the fix landed
# with it rather than after it.
unavailable = []

# The eight `game_master` entries. `instabuild` is the only ability the
# sweep sets that `ItemStack.consume` and `ItemUtils.createFilledResult`
# read, and both are how a rule takes the item off you - so what moves in
# these rows is `stackAfter`, not the block write. Measured 2026-08-12; the
# call chains below were read out of the pinned jar with
# `javap -p -c -constants`, not inferred from the axis.

[[block]]
id = "minecraft:cake"
class = "CakeBlock"
reads = ["ItemStack.consume -> LivingEntity.hasInfiniteMaterials"]
axes = ["game_master"]
unknown = []

