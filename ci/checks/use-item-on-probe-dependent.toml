# --- the 48 signs, 2026-08-18 --------------------------------------------
#
# These entered the table when `UseGolden.TableLevel` started answering
# `getBlockEntity` with the real block entity. Until then this dumper refused
# on the *ask* — 2,593 refusals, one cause, no others — so every sign was
# `NoBlockEntity` for every item and no stance could move a row that did not
# exist.
#
# With a real `SignBlockEntity`, `SignBlock.useItemOn` reaches
# `player.mayBuild()` before it will let an item edit or wax a sign, and
# `no_build` is the stance that turns it. This is the **same kind of entry as
# the seventeen `CandleBlock` ones** and not the creative-consumption kind: it
# is a real gate on whether the interaction happens at all, and the table
# records the answer for a player who may build.

