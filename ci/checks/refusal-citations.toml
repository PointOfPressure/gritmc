# Every sentence in the tree that quotes one of the four golden tables'
# populations, tied to the value it quotes.
#
# Checked by `ci/refusal-ledger.py --cite`, which renders each `quote` with the
# **derived** value — in both plain and thousands-separated form — and refuses
# if neither rendering appears in the file. Two different refusals:
#
#   CITATION       the sentence is there with a different number in it. That is
#                  the `199` against a table of `160` case, caught at the
#                  sentence instead of never.
#   CITATION-GONE  no rendering matches at all: reworded or moved. A reworded
#                  claim is an unchecked claim, so it is red until re-tagged.
#
# The five figures this branch repaired by hand had all been wrong for days.
# Every one of them would have been caught here on the commit that broke it.
#
# `value` is a path into `ci/refusal-ledger.py`'s derivation, split on `.json.`
# because every table name contains a dot:
#
#   <table>.json.refused / .answered / .population / .universe
#   <table>.json.other.<name>          connective, quiet, tickRows, ...
#   <table>.json.causes.<cause>        the per-cause refusal counts
#
# Put `{}` where the number goes. Keep the quote long enough to be unique and
# short enough to survive an unrelated edit to the same paragraph.
#
# # THE TWO SELF-ASSERTIONS, AND WHY A LEDGER-DRIVEN CHECK NEEDS THEM
#
# `ci/check-figures.py`'s header names the defect class this must not join:
# "register nothing and it passes, register only figures you already verified
# and it passes forever". So this ledger asserts against itself as well:
#
#   min_cites   a floor on how much is registered. Emptying it is red.
#   scan        every occurrence of a derived value in these files must sit
#               inside a registered citation, so the ledger cannot rot by
#               omission while the docs grow. Four digits and up only: `12` and
#               `160` occur all over a codebase for unrelated reasons, and a
#               scan that cries wolf is a scan that gets switched off.

[meta]
# RE-TIGHTENED 2026-08-18 on `shape-three-position-extract`, and the reason is
# the one `ci/figures.toml`'s own meta block was re-tightened for the same day:
# **this floor had stopped guarding anything.** It read 15 against a ledger of
# 38, so a lane could have deleted twenty-three citations — every sentence
# tying the shape tables to their derivation — and stayed green. That is the
# failure the floor exists to make impossible, wearing the number that made it
# impossible when the ledger was a third of its size.
#
# `ci/figures.toml` was fixed and this file was not, which is worth naming: the
# two ledgers are the same mechanism against different artefacts, and repairing
# one of a matched pair is how the other keeps its defect.
#
# It is a FLOOR and not a COUNT, so it keeps a deliberate gap beneath the live
# number. Retiring a citation is a normal operation and must not require
# editing this block; what is refused is a lane that removes a tenth of the
# ledger without noticing.
min_cites = 38            # 42 today
scan = [
    "docs/SERVER.md",
    "docs/cold-start/redstone-power.md",
    "crates/rustmc-server/src/power.rs",
    "crates/rustmc-server/src/useblock.rs",
    "crates/rustmc-server/src/placedby.rs",
    "crates/rustmc-server/src/shapes.rs",
    "tools/goldengen/vanilla/ShapeGolden.java",
]

