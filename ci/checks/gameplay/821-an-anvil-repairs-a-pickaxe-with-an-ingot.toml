name = "an-anvil-repairs-a-pickaxe-with-an-ingot"
about = "an iron pickaxe at damage 200 of 250 beside one iron ingot is `AnvilMenu.createResult`'s material arm (offsets 178-287): one unit heals `min(damage, maxDamage / 4)` = 62 and costs 1, so the result is the pickaxe at damage 138 with `REPAIR_COST` 1 and the `cost` slot reads 1 — both numbers move with the damage the harness put on the stack, which a constant result cannot follow"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

# The damage arrives as a `minecraft:damage` component on the creative slot
# packet, which the server must read for this check to mean anything.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:anvil"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:iron_pickaxe"
components = [{ type = "minecraft:damage", varint = 200 }]

[[setup]]
do = "hold"
item = "minecraft:iron_ingot"
slot = 1

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_click"
slot = 31

[[step]]
do = "container_click"
slot = 1
