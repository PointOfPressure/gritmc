name = "taking-planks-from-two-logs-refills-the-result"
about = "with two oak logs stacked in one cell, taking the planks spends one of them; the `removeItem` recomputes the recipe on the spot, the remaining log still matches, and the result slot is sent FULL again — directly, before the grid cell's correction to one log. This is what separates a take that recomputes per consumed cell from one that leaves the grid alone (the result is sent empty) or that recomputes once after the click (the cell is sent before the result)"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, hotbar 0 is 37 and hotbar 2 is 39.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:oak_log"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 39

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
