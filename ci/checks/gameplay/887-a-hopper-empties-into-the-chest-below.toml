name = "a-hopper-empties-into-the-chest-below"
about = "a hopper on a chest, locked by a floor lever beside it (on a stone block: a hopper's side face is not sturdy, so a lever clicked onto it has nowhere to hang), holds the coal clicked into it; flipping the lever off is `HopperBlock.neighborChanged` -> `checkPoweredState` writing `enabled=true` with flags 2 (one `section_blocks_update` with the lever), and the hopper's next `pushItemsTick` runs `ejectItems` into the chest through its UP face, which the open hopper menu's per-tick `broadcastChanges` shows as slot 0 corrected to empty. So the check needs both halves: a server with no hopper transfer never empties slot 0, and a server that transfers but ignores `ENABLED` empties it at the click instead of after the lever. Hopper menu slot 32 is hotbar 0"
observe_from = "actor"
observe = ["container_set_slot", "block_update", "section_blocks_update"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:chest"

[[setup]]
do = "place"
on = [2, -1, 1]
face = "up"

# Sneaking, because a chest and a hopper both have a use. The hopper lands on
# the chest facing DOWN; the lever goes on the hopper's east face.
[[setup]]
do = "hold"
item = "minecraft:hopper"

[[setup]]
do = "sneak"
on = true

[[setup]]
do = "place"
on = [2, 0, 1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "place"
on = [3, -1, 1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [3, 0, 1]
face = "up"

[[setup]]
do = "sneak"
on = false

[[setup]]
do = "hold"
item = "minecraft:coal"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

# Lever on: the hopper is written enabled=false.
[[setup]]
do = "place"
on = [3, 1, 1]
face = "up"

[[step]]
do = "place"
on = [2, 1, 1]
face = "south"

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 0

# Lever off, with the hopper menu still open.
[[step]]
do = "place"
on = [3, 1, 1]
face = "up"
