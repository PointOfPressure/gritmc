name = "digging-a-bed-takes-both-halves"
about = "breaking the foot of a bed removes the head as well — the same shape of claim as 260 for a door but along a *horizontal* axis chosen by the state, and BedBlock.updateShape is a different rule from DoorBlock's in three ways: the direction comes from FACING and PART rather than the Y axis, the answer copies only OCCUPIED onto the subject's own state rather than taking the neighbour's whole state, and it tests `nb.is(this)` — the same block — where the door tests `instanceof`. A server that generalised one rule across both gets all three wrong"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:red_bed"

# Facing south, so the foot lands at [1, 0, 0] and the head at [1, 0, 1].
[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[step]]
do = "dig"
at = [1, 0, 0]
face = "up"
