name = "two-pigs-in-love-four-blocks-apart-never-breed"
about = "two pigs in love in separate pits four blocks apart never breed: each BreedGoal finds the other inside its eight-block search, but BreedGoal.tick only breeds under three blocks (distanceToSqr < 9) and neither pig can leave its pit, so for the whole window nothing new is paired"
observe_from = "actor"
observe = ["set_entity_data", "entity_event"]
within = 336
settle_ms = 1500
measured_step = "silent"

[[gamerule]]
rule = "mob_drops"
value = "false"
restore = "true"

# THE PLAYER STANDS BETWEEN THE PITS, AND WHY (2026-10-01). The first rig
# copied `099`'s stance at x=0, and from there the far pit is out of vanilla's
# block reach: `isWithinBlockInteractionRange(pos, 1.0)` is (4.5 + 1.0)^2 =
# 30.25 against the box of [5,-3,-321] at 38.1 from the eye, and [5,-2,-321]
# at 31.9. So vanilla dug half the far shaft and placed no second pig, and the
# `newest` interact landed on the pig already in love (`092`). Our server has
# no block reach check on dig or use at all and placed it — see
# `docs/FINDINGS.md`. From x=3 every dig and place is under 15 and both pigs
# are inside the 6.0 entity range.
# `entity_event` is observed beside `set_entity_data` so the check has a
# heartbeat: the two love events (18) the feeds force are what vanilla says,
# and a breed would add the breeder's 18 and the baby's data.
# THE CONTROL FOR `099`. Same rig, the second pit four blocks along x:
# `getFreePartner` (range 8, `bb.inflate(8)`) finds the partner, BreedGoal
# runs and paths and counts — and `distanceToSqr` is 16.0 on every tick, so
# `breed()` is never reached; at loveTime 60 `canContinueToUse` drops it and it
# starts again until the 600-tick love runs out. A server that measured the
# distance on the wrong axis, against the wrong threshold, or between box
# corners rather than positions, makes a baby here and `set_entity_data`
# arrives. The measured step is the 5 s wait.
# THE RIG, AND WHY IT IS OUT HERE. The pit is `083`'s: digging [1,-1] and
# [1,-2] leaves a 1x1 shaft two deep whose floor has no walkable neighbour, so
# every path a pig in it is ever given is its own node and it never moves —
# its unseeded `RandomStrollGoal` and look goals cannot reach anything this
# check observes. The rig sits -320 blocks out on z, past `083`-`089`'s
# rigs at +-80 and +-160 and alternating sign with its neighbours here (same
# sign 64 apart on x and 80 on z), so no other scenario's mob is tracked from
# it and nothing it leaves is tracked from theirs: the actor tracks to 64
# blocks at view-distance 4. `within` is opened to reach the rig; the observer
# stays at the workspace and tracks none of it, hence `observe_from = "actor"`.
# Coordinates in the steps carry the offset.


[[setup]]
do = "walk"
to = [3.0, 0.0, -320.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, -321]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, -321]
face = "up"

[[setup]]
do = "dig"
at = [5, -1, -321]
face = "up"

[[setup]]
do = "dig"
at = [5, -2, -321]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:pig_spawn_egg"

[[setup]]
do = "place"
on = [1, -3, -321]
face = "up"

[[setup]]
do = "place"
on = [5, -3, -321]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:carrot"

[[setup]]
do = "walk"
to = [3.0, 0.0, -319.95]

[[setup]]
do = "wait"
ms = 1500

[[step]]
do = "interact"
target = "minecraft:pig"
pick = "oldest"

[[step]]
do = "interact"
target = "minecraft:pig"
pick = "newest"

[[step]]
do = "wait"
ms = 5000
