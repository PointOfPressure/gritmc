name = "a-dye-colours-a-sheep"
about = "lime dye used on a sheep makes it lime: the stack's interactLivingEntity answers after Mob.interact passes, setColor writes the low nibble of DATA_WOOL_ID and the next sendChanges carries it"
observe_from = "actor"
observe = ["set_entity_data"]
within = 656
settle_ms = 1500

# THE MECHANISM:
#
#   Player.interactOn        49-106  entity.interact -> PASS (Sheep.mobInteract:
#                                    not shears; Animal: not #sheep_food;
#                                    AgeableMob: not a golden dandelion)
#                           107-145  stack.interactLivingEntity on a COPY for a
#                                    creative player
#   DyeItem.interactLivingEntity
#                             0-53   a Sheep, alive, not sheared, a DYE
#                                    component of another colour
#                            56-72   playSound(player, sheep, DYE_USE, ...) —
#                                    not to the player
#                            85-89   setColor(LIME): wool & 240 | 5
#
# The sheep's colour at spawn is SheepColorSpawnRules' draw from the unseeded
# level random (white 81.8%, else black, gray, light gray, brown, pink); lime is
# none of them, so the set always changes the value and the packet always
# carries accessor 18 = 5 — the spawn colour is overwritten whatever it was.
#
# THE RIG. `083`'s pit: digging [1,-1] and [1,-2] leaves a 1x1 shaft two deep
# whose floor has no walkable neighbour, so the mob hatched at its bottom never
# moves — its unseeded stroll and look goals reach nothing observed here. The
# rig sits +640 blocks out on z, perpendicular to the line the workspaces are
# laid along (`-(n+1) * 32` on x), alternating sign with its neighbours in this
# block and 80 further out every pair (640/641 at +-480 ... 652/653 at +-960),
# so the nearest same-side rig is 64 blocks away on x and 80 on z: nothing it
# leaves is tracked from another scenario and nothing another leaves is
# tracked from it — the actor tracks to 64 blocks at view-distance 4. The mob is SILENT
# (`minecraft:entity_data` `Silent` on the egg, applied by
# `EntityType.updateCustomEntityTag` through `Entity.load`), because
# `Mob.baseTick`'s ambient roll (`nextInt(1000) < ambientSoundTime++`, unseeded)
# can land in any window; `Entity.playSound` refuses every sound of a silent
# entity and the roll still happens, so its random stream is unchanged.

[[setup]]
do = "walk"
to = [0.0, 0.0, 640.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 641]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 641]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:sheep_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:sheep", silent = true }]

[[setup]]
do = "place"
on = [1, -3, 641]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, 640.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:lime_dye"

[[step]]
do = "interact"
target = "minecraft:sheep"
