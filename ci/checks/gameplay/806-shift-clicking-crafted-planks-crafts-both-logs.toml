name = "shift-clicking-crafted-planks-crafts-both-logs"
about = "a shift-click on the planks a crafting table offers for two stacked logs runs `CraftingMenu.quickMoveStack`'s result arm under `doClick`'s QUICK_MOVE loop: move the planks into the inventory (10..46, reversed, so the last hotbar slot), `onTake` spends a log and recomputes the result directly, and the loop goes round again while the result still holds planks — eight planks in hotbar 8, an empty grid. A server with no crafting quick-move declines the click and answers nothing; one that moves once leaves a log and four planks behind"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, hotbar 0 is 37 and hotbar 2 is 39.
# 801 with the take as a shift-click.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:oak_log"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 39

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
input = "quick_move"
