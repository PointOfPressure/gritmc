name = "a-fed-furnace-lights-on-the-next-tick"
about = "coal into the fuel slot and raw iron into the ingredient slot of an open furnace menu, and `AbstractFurnaceBlockEntity.serverTick` writes `AbstractFurnaceBlock.LIT` with `setBlock(pos, state, 3)` on the next tick. This is the only check in the corpus whose observation comes from `Level.tickBlockEntities` rather than from the handler that ran: the two container clicks change no block, and the `block_update` arrives one tick later because `tickBlockEntities` is the LAST of `ServerLevel.tick`'s own passes — after `ServerChunkCache.tick`, which is where the block broadcast lives. The write happens only when `wasLit != isLit`, so a furnace that stays lit sends nothing and a server that rewrote the state every tick would show a stream of them. Slot 30 is hotbar 0 in an `AbstractFurnaceMenu`: three container slots then `addStandardInventorySlots`, so 3 + 27. **There is no `block_entity_data` here and there cannot be** — `AbstractFurnaceBlockEntity` does not declare `getUpdatePacket`, so the four counters reach a client only as the menu's data slots, and this check does not observe those because nothing on this server moves them yet"
observe_from = "actor"
observe = [
    "block_update",
    "section_blocks_update",
    "container_set_slot",
    "block_changed_ack",
]
settle_ms = 2500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:furnace"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

# Hotbar 0 is the coal and hotbar 2 the raw iron; hotbar 1 holds the stick and
# is left selected, because a selected block would build on top of the furnace
# instead of opening it.
[[setup]]
do = "hold"
item = "minecraft:coal"

[[setup]]
do = "hold"
item = "minecraft:raw_iron"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

# Hotbar 0 -> the cursor -> the fuel slot.
[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 1

# Hotbar 2 -> the cursor -> the ingredient slot. The furnace has fuel and an
# input only after this click, and `serverTick`'s light branch is
# `isLit || (hasFuel && hasInput)`, so this is the click the `lit` update is
# downstream of.
[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 0
