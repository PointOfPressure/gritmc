name = "a-blast-furnace-is-not-a-furnace"
about = "a blast furnace opens `MenuType.BLAST_FURNACE` with the title container.blast_furnace, and its slot layout and four data slots are identical to the furnace of check 470 -- so the registry id and the title are the whole of the difference on the wire, and a server that routes every AbstractFurnaceBlock to MenuType.FURNACE passes 470 and fails here"
observe_from = "actor"
observe = ["open_screen", "container_set_content"]
settle_ms = 1500

# `open_screen` decodes the `minecraft:menu` **registry id** as its own field
# and digests the rest of the body, which is the menu's title component. The
# `container_set_content` that `initMenu` sends immediately after it digests
# the whole slot list. So this check pins three independent things about the
# menu — which registry entry, which title, and how many slots — and a server
# that answered with a chest here would miss on all three.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:blast_furnace"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
