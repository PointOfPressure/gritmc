name = "a-smithing-table-upgrades-a-diamond-sword"
about = "a netherite upgrade template, a diamond sword and a netherite ingot match `smithing_transform` `netherite_sword_smithing`, and `SmithingTransformRecipe.assemble` is `createWithOriginalComponents(result, base)` — a netherite sword carrying the base's patch — so the third input is answered with the result slot; `hasRecipeError` stays 0 because something matched"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

# SmithingMenu: template 0, base 1, addition 2, result 3, then the 36 —
# hotbar 0 is 4 + 27 = 31. One data slot, `hasRecipeError`, set to 0 in the
# constructor and to 1 only when all three inputs are full and nothing
# matched.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:smithing_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:netherite_upgrade_smithing_template"

[[setup]]
do = "hold"
item = "minecraft:diamond_sword"
slot = 1

[[setup]]
do = "hold"
item = "minecraft:netherite_ingot"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 31

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 33

[[step]]
do = "container_click"
slot = 2
