name = "an-enchanting-table-offers-nothing-for-a-stone"
about = "a stone has no `ENCHANTABLE`, so `EnchantmentMenu.slotsChanged` takes its empty arm (offsets 30-61): costs 0 and every clue -1, which is what the menu already holds — no data slot moves and the click is answered with the input slot alone"
observe_from = "actor"
observe = ["container_set_data"]
settle_ms = 1000
measured_step = "silent"

# EnchantmentMenu: item 0, lapis 1, then the 36 — hotbar 0 is 2 + 27 = 29.
# Ten data slots: costs 0..2, the seed at 3, enchantClue 4..6, levelClue
# 7..9. The seed is `Player.enchantmentSeed`, 0 for a player with no save
# file — which every corpus actor is — so the offers are a function of the
# item and the bookshelf count (none here) and nothing else.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:enchanting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0


