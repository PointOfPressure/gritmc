name = "a-smoker-cooks-raw-beef-in-a-hundred-ticks"
about = "coal into the fuel slot and beef into the ingredient slot of an open smoker. The next serverTick lights it, consumes the coal and starts the timer at 1; the tick after, the block broadcast sends lit=true and ServerPlayer.doTick's broadcastChanges sends the emptied fuel slot. One hundred ticks after lighting the timer equals cookingTotalTime (if_icmpne at offset 270 — equality, not >=) and burn() puts cooked beef in slot 2 and shrinks slot 0, and the next broadcastChanges sends both corrections in slot order, 0 then 2. Settle is 7 s against the 5 s the cook takes. A server that cooked but never swept the open menu shows the light and nothing else; one with no cook total never finishes"
observe_from = "actor"
observe = ["container_set_slot", "block_update"]
settle_ms = 7000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:smoker"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:coal"

[[setup]]
do = "hold"
item = "minecraft:beef"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 0
