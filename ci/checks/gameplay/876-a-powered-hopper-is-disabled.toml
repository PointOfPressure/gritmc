name = "a-powered-hopper-is-disabled"
about = "`HopperBlock.neighborChanged` -> `checkPoweredState`: a lever beside a hopper makes `hasNeighborSignal` true and the hopper is rewritten `enabled=false` with flags 2, in the same tick as the lever, so both land in one `section_blocks_update`. Nothing schedules; a server that does not port it sends the lever alone"
observe_from = "actor"
observe = ["block_update", "section_blocks_update"]
settle_ms = 1000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:hopper"

[[setup]]
do = "place"
on = [3, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [4, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [4, 0, 2]
face = "up"
