name = "a-double-chest-opens-a-six-row-menu"
about = "two chests side by side open one menu of `MenuType.GENERIC_9x6` with twice the slots and the title container.chestDouble -- ChestBlock.getMenuProvider runs a combiner and returns a different menu type from the single chest of check 090, which is the pair a server that hardcodes GENERIC_9x3 behind every chest passes half of"
observe_from = "actor"
observe = ["open_screen", "container_set_content"]
settle_ms = 1500

# `ContainerOpenersCounter.recheckOpeners` re-arms every 5 ticks while a
# chest is open and calls `openerCountChanged` unconditionally, so
# `ChestBlockEntity.signalOpenCount` puts the same `block_event` on the wire
# every 250 ms for ever. That is check 090's finding and its comment carries
# the measurement; it is declared here for the same reason 560 and 601-608
# declare it without observing it -- the strict projection ignores `observe`,
# so an un-collapsed lid destabilises this check through a channel it never
# names. The cadence itself stays covered by 090, 490 and
# `rustmc_server::containers::tests::the_wire_cadence_is_one_signal_every_check_tick_delay_ticks`.
collapse_repeats = ["block_event"]

# `open_screen` decodes the `minecraft:menu` **registry id** as its own field
# and digests the rest of the body, which is the menu's title component. The
# `container_set_content` that `initMenu` sends immediately after it digests
# the whole slot list. So this check pins three independent things about the
# menu — which registry entry, which title, and how many slots — and a server
# that answered with a chest here would miss on all three.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:chest"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "place"
on = [2, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
