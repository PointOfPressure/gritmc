name = "a-crafter-opens-a-three-by-three-menu-that-is-not-crafting"
about = "a crafter opens `MenuType.CRAFTER_3x3`, not `MenuType.CRAFTING` -- a 3x3 grid with no result slot and ten data slots -- `SimpleContainerData(10)`, nine disabled-cell flags and the trigger state, off a block entity; this is the pair for check 480, which a server that maps every 3x3 grid to the crafting table passes"
observe_from = "actor"
observe = ["open_screen", "container_set_content"]
settle_ms = 1500

# `open_screen` decodes the `minecraft:menu` **registry id** as its own field
# and digests the rest of the body, which is the menu's title component. The
# `container_set_content` that `initMenu` sends immediately after it digests
# the whole slot list. So this check pins three independent things about the
# menu — which registry entry, which title, and how many slots — and a server
# that answered with a chest here would miss on all three.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafter"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
