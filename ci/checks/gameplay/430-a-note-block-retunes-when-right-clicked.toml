name = "a-note-block-retunes-when-right-clicked"
about = "right-clicking a note block raises its pitch and plays it — `NoteBlock.useWithoutItem` cycles NOTE and then `playNote` goes through `Level.blockEvent`, so the sound reaches a client as a block event queued to the tick boundary and not as anything derivable from the block's state"
observe_from = "actor"

# **THIS CHECK'S SOUND IS UNGRADEABLE ON PITCH, AND WILL STAY THAT WAY.**
#
# `corpus-projection-audit`, `docs/PARITY-ROADMAP.md` §60 and §51. `pitch.rs`
# grades a pitch per call site — exactly when the site writes a literal, as a
# range when it draws one — and `block.note_block.*` is neither.
# `NoteBlock.playNote` reaches `Math.pow(2.0, (note - 12) / 12.0)`, so the
# pitch is a transcendental of the note and equal to the reference **to one
# ulp**. Comparing it exactly makes an honest server diverge on a rounding
# difference; comparing it as a range accepts every note in the scale. Neither
# is a check, so it is classified as unclassified and the field is dropped —
# which is the default, and is `569323e`'s behaviour.
#
# **What this check does and does not rest on, therefore.** The retune is
# carried by `block_update` (`note=N` in the state string) and the play by
# `block_event`, and both are compared: a server that failed to cycle the note,
# or failed to play it, reddens. What is not compared is that the *frequency*
# matches the note — the one place where this file's `about` and its evidence
# come apart. Closing it needs an exact-to-N-ulps float rule that nothing else
# in this corpus would use.
observe = [
    "block_update",
    "section_blocks_update",
    "block_event",
    "level_event",
    "sound",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:note_block"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
