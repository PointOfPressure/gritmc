name = "swapping-to-the-offhand-shows-on-both-channels"
about = "moving the held item to the offhand is one action with two audiences — `container_set_slot` down the acting connection and `set_equipment` broadcast to everyone tracking the player — so it is the inventory version of the direct-send/broadcast split, and a server that only answered the actor would look correct to the actor"
observe = ["set_equipment", "container_set_slot", "container_set_content"]
settle_ms = 2000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stone"

# Deliberately no `observe_from`: the default reads both streams, and
# reading both is the point. The actor should see the slots change and the
# observer should see the equipment change, and neither alone is the answer.
[[step]]
do = "swap_offhand"
