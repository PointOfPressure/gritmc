name = "shears-shear-a-sheep"
about = "shears used on a dyed sheep shear it: the shear sound on the entity, one to three lime wool items at its back whose count comes from the shearing loot table's own random sequence, and the sheared bit in DATA_WOOL_ID"
observe_from = "actor"
observe = ["sound", "add_entity"]
within = 656
settle_ms = 1500

# THE MECHANISM:
#
#   Sheep.mobInteract           6-75  SHEARS && readyForShearing() -> shear(...);
#                                     SUCCESS_SERVER (animate is not observed)
#   Sheep.shear                 0-9   level.playSound(null, this, SHEEP_SHEAR,
#                                     PLAYERS, 1F, 1F) — sound_entity, to all
#                              12-24  dropFromShearingLootTable(SHEAR_SHEEP, ...)
#                              27-29  setSheared(true): wool | 16
#   shearing/sheep              one roll of an alternatives over sixteen nested
#                               tables conditioned on colour and sheared:false;
#                               shearing/sheep/lime rolls uniform(1, 3) of
#                               lime_wool — ONE nextInt(3) + 1, drawn from the
#                               OUTER table's random_sequence,
#                               minecraft:shearing/sheep:
#                               RandomSequences.get(id, level seed) — seeded by
#                               the world seed, created on first use. The
#                               corpus's vanilla is a fresh world of seed
#                               20260803 every run, so its first shear drops the
#                               same count every run; ours is booted with
#                               --level-seed 20260803.
#   Sheep.lambda$shear$0        spawnAtLocation(stack.copyWithCount(1), 1F) per
#                               item: add_entity at (x, y + 1, z), its yaw and
#                               movement drawn from the item's own random (both
#                               dropped by the comparison)
#
# The dye in setup pins the colour (see `644`), so the wool item is lime and
# the loot's nested table is shearing/sheep/lime. NOT observed:
# set_entity_data — the wool byte's 5 -> 21 rides it, but so does every
# vanilla wool item's DATA_ITEM count as `ItemEntity.tick` merges the one to
# three stacks inside this window, which this server's item tick
# (`crate::itementity`, train-f) postdates the recording of. `646`, parked in
# train-f as vacuous, was to grade the sheared bit through its consequence.
#
# THE RIG. `083`'s pit: digging [1,-1] and [1,-2] leaves a 1x1 shaft two deep
# whose floor has no walkable neighbour, so the mob hatched at its bottom never
# moves — its unseeded stroll and look goals reach nothing observed here. The
# rig sits -640 blocks out on z, perpendicular to the line the workspaces are
# laid along (`-(n+1) * 32` on x), alternating sign with its neighbours in this
# block and 80 further out every pair (640/641 at +-480 ... 652/653 at +-960),
# so the nearest same-side rig is 64 blocks away on x and 80 on z: nothing it
# leaves is tracked from another scenario and nothing another leaves is
# tracked from it — the actor tracks to 64 blocks at view-distance 4. The mob is SILENT
# (`minecraft:entity_data` `Silent` on the egg, applied by
# `EntityType.updateCustomEntityTag` through `Entity.load`), because
# `Mob.baseTick`'s ambient roll (`nextInt(1000) < ambientSoundTime++`, unseeded)
# can land in any window; `Entity.playSound` refuses every sound of a silent
# entity and the roll still happens, so its random stream is unchanged.

[[setup]]
do = "walk"
to = [0.0, 0.0, -640.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, -641]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, -641]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:sheep_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:sheep", silent = true }]

[[setup]]
do = "place"
on = [1, -3, -641]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, -640.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:lime_dye"

[[setup]]
do = "interact"
target = "minecraft:sheep"

[[setup]]
do = "hold"
item = "minecraft:shears"

[[setup]]
do = "wait"
ms = 500

[[step]]
do = "interact"
target = "minecraft:sheep"
