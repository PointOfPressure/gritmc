name = "the-off-hand-swings-with-a-different-action"
about = "the hand's ordinal on the serverbound packet is 0 or 1 and the `animate` action it produces is 0 or **3** — `ClientboundAnimatePacket.WAKE_UP` sits at 2 in between — so a server that forwarded the ordinal sends a legal packet naming a different animation"
observe_from = "observer"
observe = ["animate"]
settle_ms = 1000

# **`within = -1` — unbounded, and this is not a convenience.**
#
# `animate` carries an entity id and **no coordinates at all**, so the only
# spatial information the comparator has for it is where that entity was last
# *seen*. For an item or a mob that memory is true. For one of the two clients
# it is false by construction: `record::run_one` walks them to the next
# workspace between scenarios, outside every measured window, so no packet
# ever says they moved.
#
# `530-walking-away-drops-a-standing-player-from-view` makes a player leave a
# tracking range and come back, which emits an `add_entity` for a **player**
# inside a measured window — the one case `compare::place`'s own doc assumed
# could never happen. Measured on the corpus run of 2026-08-06 it placed the
# actor at absolute (-1984, -60, 73) and left it there; twelve scenarios later
# this file's anchor is (-2368, -60, 0), so the `animate` was bounded against a
# position **384 blocks** away, vanilla's projection came out empty, and this
# check went `vacuous` — gate-red, and unable to pass however right the server
# was. It read `match` in `ci/t2-gameplay-subset.sh` because a subset that does
# not include 530 never makes the placement.
#
# **A subset run is not a gate, and this is what that sentence costs.**
within = -1

# The whole content of this check is one `if_acmpne` at offset 61 of
# `LivingEntity.swing`:
#
#     56: aload_1                              the hand
#     58: getstatic InteractionHand.MAIN_HAND
#     61: if_acmpne 68
#     64: iconst_0                             SWING_MAIN_HAND
#     65: goto 69
#     68: iconst_3                             SWING_OFF_HAND
#
# and the constants it names: `SWING_MAIN_HAND = 0`, `WAKE_UP = 2`,
# `SWING_OFF_HAND = 3`, `CRITICAL_HIT = 4`, `MAGIC_CRITICAL_HIT = 5`.
#
# **A wrong number here is never a decode error.** The action is a single
# byte with no range check on either side, so a server forwarding the hand's
# own ordinal sends action 1 — which is not one of the five constants at all
# and simply animates nothing — and a server that mapped off-hand to 2 would
# lay the bystander's view of the player down as if it were waking up. Both
# are well-formed packets, and only the digest of the action tells them
# apart.
#
# `hand` is spelled out rather than left to the default for the same reason
# `container_click` refuses an unknown `ContainerInput`: this is the one check
# whose entire subject is which hand it named.

[[step]]
do = "swing"
hand = "off"
