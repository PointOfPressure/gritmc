name = "taking-crafted-planks-spends-the-log"
about = "taking the four planks a crafting table offers for one oak log runs `ResultSlot.onTake`, which removes one item from every cell of the positioned input through `TransientCraftingContainer.removeItem` — and that call runs `slotsChanged`, so the emptied result is sent DIRECTLY, on its own state id, before `broadcastChanges` corrects the emptied grid cell and the cursor. A server that hands out the planks and leaves the log answers with the result slot and the cursor only; one that recomputes after the click instead of inside the take sends the cell before the result"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, then the 36 — hotbar 0 is 10 + 27 = 37.
# The first three steps are 562's; the fourth is the take.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
