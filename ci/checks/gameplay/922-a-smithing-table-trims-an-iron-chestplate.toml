name = "a-smithing-table-trims-an-iron-chestplate"
about = "a coast armor trim template, an iron chestplate and redstone match `smithing_trim` `coast_armor_trim_smithing_template_smithing_trim`, and `SmithingTrimRecipe.applyTrim` copies the chestplate at count 1 and sets `TRIM` to `ArmorTrim(redstone, coast)` — the material from the addition's `PROVIDES_TRIM_MATERIAL`, the pattern from the recipe — so the third input is answered with a result carrying a `minecraft:trim` patch and `hasRecipeError` stays 0. A server that matches the trim but cannot assemble it sends no result and flips `hasRecipeError` to 1"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

# SmithingMenu: template 0, base 1, addition 2, result 3, then the 36 —
# hotbar k is 31 + k. The rig is 850's with a trim template and redstone.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:smithing_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:coast_armor_trim_smithing_template"

[[setup]]
do = "hold"
item = "minecraft:iron_chestplate"
slot = 1

[[setup]]
do = "hold"
item = "minecraft:redstone"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 31

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 33

[[step]]
do = "container_click"
slot = 2
