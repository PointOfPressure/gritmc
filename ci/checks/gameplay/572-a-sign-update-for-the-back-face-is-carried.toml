name = "a-sign-update-for-the-back-face-is-carried"
about = "the packet's `isFrontText` boolean decides which of a sign's two texts is written, and nothing on the server re-derives it — `updateSignText` passes it straight to `updateText`, so a port that assumed the front writes the wrong side of the sign and says nothing about it"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

# 26.2 signs have two texts. `SignBlockEntity.updateSignText(player, isFront,
# lines)` takes the boolean from the packet and hands it to `updateText`
# unchanged; the permission test above it does **not** consult the face, so the
# token `openTextEdit` set for the front authorises an edit to the back just as
# well.
#
# That is the fact this check exists to pin, and it is worth a file of its own
# because the failure is invisible in every other one: a server that hard-coded
# the front would still send a `block_entity_data`, still at the right
# position, still with four lines in it. Only the digest of the NBT differs —
# `back_text` against `front_text` — which is exactly what this projection
# compares and what a check asserting "a packet arrived" would miss.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:oak_sign"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[step]]
do = "sign_update"
pos = [1, 0, 0]
front = false
lines = ["behind", "", "", ""]
