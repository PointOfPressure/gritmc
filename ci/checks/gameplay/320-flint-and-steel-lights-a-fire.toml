name = "flint-and-steel-lights-a-fire"
about = "flint and steel used on the side of a block puts fire against it — an item that places a block it is not, at the clicked face, and the only mechanic in this corpus whose result is expected to keep changing on its own afterwards"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]
settle_ms = 2000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "place"
on = [2, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:flint_and_steel"

[[step]]
do = "place"
on = [2, 0, 0]
face = "up"
