name = "an-anvil-renames-a-stone-for-one-level"
about = "typing a name into an anvil holding a stone is `ServerboundRenameItemPacket`, and `AnvilMenu.setItemName` reruns `createResult`: the rename arm (offsets 756-846) charges 1, so the result is the stone with `CUSTOM_NAME` set to the literal text and `REPAIR_COST` left at 0 (a rename-only result keeps the prior-work penalty, offsets 1021-1039), and the `cost` data slot moves from 0 to 1"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

# AnvilMenu: left 0, right 1, result 2, then the 36 — hotbar 0 is 3 + 27 =
# 30. One data slot, `cost`. Before the rename the stone alone produces
# nothing (`createResult` reaches `i <= 0` at offset 877), so the only cost
# packet in this window is the one the name causes.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:anvil"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "rename_item"
name = "Pickle"
