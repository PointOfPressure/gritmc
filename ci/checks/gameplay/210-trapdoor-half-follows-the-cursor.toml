name = "trapdoor-half-follows-the-cursor"
about = "a trapdoor clicked high on a side face becomes a top trapdoor and low on the same face a bottom one — TrapDoorBlock reads the cursor against 0.5 like a slab does, but takes its `facing` from the clicked face DIRECTLY, so the two properties come from two different parts of the same click. Corrected 2026-08-05: this said 'the clicked face's opposite', which is the OTHER branch. TrapDoorBlock.getStateForPlacement tests `!replacingClickedOnBlock() && clickedFace.getAxis().isHorizontal()` and jumps to offset 88, where FACING is set from the clicked face as-is with no getOpposite; `getHorizontalDirection().getOpposite()` is offset 46-49, reached only when the click replaces the block it hit or lands on a vertical face. A side-face click, which is exactly what this check does, takes the branch that uses the face itself"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "place"
on = [2, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_trapdoor"

[[step]]
do = "place"
on = [2, 0, 0]
face = "north"
cursor = [0.5, 0.9, 0.0]

[[step]]
do = "place"
on = [2, 0, 0]
face = "south"
cursor = [0.5, 0.1, 1.0]
