name = "a-plain-potion-over-gunpowder-brews-for-twenty-seconds-and-stays-a-potion"
about = "a component-less potion, gunpowder and blaze powder into an open brewing stand. PotionBrewing.hasMix(potion, gunpowder) is a container mix (potion -> splash_potion), so the stand is brewable: it takes the fuel, starts a 400-tick brew, and at zero doBrew mixes every bottle, shrinks the gunpowder and sends level_event 1035. But mix() returns its input unchanged when POTION_CONTENTS.potion() is empty (offsets 26-34), so the bottle is never corrected — the only container slots that move are the fuel (on the first tick) and the gunpowder (400 ticks later). Settle is 22 s against the 20 s the brew takes. A server that refused the mix table never brews; one that converted by item id sends a splash potion into slot 0"
observe_from = "actor"
observe = ["container_set_slot", "block_update", "level_event"]
settle_ms = 22000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:brewing_stand"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:potion"

[[setup]]
do = "hold"
item = "minecraft:gunpowder"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:blaze_powder"
slot = 3

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_click"
slot = 34

[[step]]
do = "container_click"
slot = 3

[[step]]
do = "container_click"
slot = 35

[[step]]
do = "container_click"
slot = 4
