name = "a-bat-hatched-under-glass-takes-off-at-once"
about = "a bat is born roosting, and one hatched in a glass cell takes off on its first tick with the take-off level event at its own block: Bat.<init> sets the resting flag and customServerAiStep clears it and fires 1025 when the block above is not a redstone conductor, which glass is not"
observe_from = "actor"
observe = ["level_event", "set_entity_data"]
within = 176
settle_ms = 1500

# THE MECHANISM, read from the pinned jar:
#
#   Bat.<init>                 29-37   !isClientSide -> setResting(true)
#   Bat.customServerAiStep     6-14    pos = blockPosition(); above = pos.above()
#                              16-19   isResting() ?
#                              28-38   level.getBlockState(above)
#                                        .isRedstoneConductor(level, pos) ?
#                              108-124   NO -> setResting(false);
#                                        if !isSilent: levelEvent(null, 1025, pos, 0)
#   Bat.tick                   5-43    isResting ? pin y to floor(y) + 1 - 0.9
#                                      : deltaMovement * (1, 0.6, 1)
#
# Nothing on that path draws from the bat's random: the resting branch's
# `nextInt(200)` head twitch (offsets 42-70) is only reached UNDER a conductor.
# So on every run vanilla hatches the bat resting and, on its first tick,
# clears the flag and plays 1025 at the block the egg put it in, (2, 0, 1).
# `set_entity_data` is observed with it because the flag is the other half of
# the same statement: a server that plays the sound without clearing the
# DATA_ID_FLAGS bit, or that hatches the bat awake, differs there.
#
# WHY A GLASS CELL. A bat that has taken off flies a random walk
# (`customServerAiStep` 131-290, seven-wide targets from its own unseeded
# random) and `ci/checks/gameplay` marches workspaces 32 blocks apart: a free
# bat drifts into later checks' windows. Glass is not a redstone conductor, so
# the cell's roof cannot make the bat roost again (offsets 481-509 test the
# block above for exactly that), and it stays in its 1x1x1 cell for the rest
# of the run. The flight inside it is random and is NOT observed —
# `move_entity` and `rotate_head` stay out of `observe`.
#
# RIG. Four glass walls round (2, 0, 1) on the ground, a fifth on the east
# wall's top so the roof has a face to go on, and the roof at (2, 1, 1). The
# egg goes on the floor inside, (2, -1, 1) face up. All of it inside one chunk
# on z, in the far field `083` explains.


# THE RIG IS OUT AT z = -160, AND `within` IS OPENED TO REACH IT. See the
# FAR FIELD note in `083`'s header.
[[setup]]
do = "walk"
to = [0.0, 0.0, -160.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:glass"

[[setup]]
do = "place"
on = [1, -1, -159]
face = "up"

[[setup]]
do = "place"
on = [3, -1, -159]
face = "up"

[[setup]]
do = "place"
on = [2, -1, -160]
face = "up"

[[setup]]
do = "place"
on = [2, -1, -158]
face = "up"

[[setup]]
do = "place"
on = [3, 0, -159]
face = "up"

[[setup]]
do = "place"
on = [3, 1, -159]
face = "west"

# THE EGG CARRIES `LeftHanded:1b`, AND WITHOUT IT THIS CHECK FLAPS ON EITHER
# SERVER. `Mob.finalizeSpawn` 63-83 sets handedness from `level.getRandom()
# .nextFloat() < 0.05`: vanilla's level random is unseeded, and ours is a
# seeded stream whose position moves with every tick a mob draws on it, so on
# both servers one bat in twenty pairs with `DATA_MOB_FLAGS_ID` bit 2 set. The
# step-0 `set_entity_data` then reads `1d9712d93be2c49c` for `0015ab265976fe41`
# (087 in 1 of the 12 newest cached references, `0c4e740e`; 086 on the
# be-furnace-brewing corpus of 2026-10-01 for vanilla, and for OURS on the
# structures-2 gate of 2026-10-03 08:03).
#
# `EntityType.create` applies the egg's tag (javap 179) AFTER that roll
# (javap 168), and `SynchedEntityData.set` marks an entry dirty only when its
# value changes. So the override has to be TRUE, not false:
#   * `LeftHanded:0b` fixes the pairing packet but not the first dirty one. A
#     roll of true then a load of false changes the byte twice, it is dirty at
#     its default, and the tick-one `set_entity_data` carries `[15, 0, 0]`
#     (`b36d8f2e368125d6`, ours, `fix-flappers` subset s0-3) where every
#     other run carries none;
#   * `LeftHanded:1b` changes the byte from the roll's false (19 in 20) or
#     leaves the roll's true (1 in 20), and in both it ends set and dirty: the
#     pairing and the first dirty packet carry `[15, 0, 2]` on every run.
# Handedness does nothing else to a bat. `Silent:0b` is the default; the
# harness writes it on every entity_data egg.
[[setup]]
do = "hold"
item = "minecraft:bat_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:bat", silent = false, left_handed = true }]

[[step]]
do = "place"
on = [2, -1, -159]
face = "up"
