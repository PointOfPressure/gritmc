name = "a-cartography-table-takes-paper-beside-its-map"
about = "`CartographyTableMenu$4.mayPlace` admits paper, an empty map or a glass pane in the additional slot, so a click carrying paper onto slot 1 stores it and is answered with that slot and an empty cursor; 871 is the same click with a stone"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CartographyTableMenu: map 0, additional 1, result 2, then the 36 — hotbar 0
# is 3 + 27 = 30.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:cartography_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:paper"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 1
