name = "right-clicking-crafted-planks-takes-all-four"
about = "a right-click on a crafting table's four planks asks `Slot.tryRemove` for `(4 + 1) / 2 = 3`, but the result slot sits over a `ResultContainer`, whose `removeItem(int, int)` is `ContainerHelper.takeItem(itemStacks, 0)` and never reads the count — so the cursor gets all four and the log is spent. A server that splits the stack as a chest slot would hands out three and leaves one plank in the result"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, then the 36 — hotbar 0 is 10 + 27 = 37.
# 800 with the take as a right-click.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
button = 1
