name = "an-enchanting-table-offers-three-enchantments-for-a-book"
about = "a book on an enchanting table with no bookshelves runs `lambda$slotsChanged$0`: the menu's random is seeded from the seed data slot, three costs are drawn from `getEnchantmentCost` before any clue, then each row reseeds to `seed + i` and picks its clue — so placing the book is answered with the costs, enchantment ids and levels the client shows, all fixed by seed 0"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

# EnchantmentMenu: item 0, lapis 1, then the 36 — hotbar 0 is 2 + 27 = 29.
# Ten data slots: costs 0..2, the seed at 3, enchantClue 4..6, levelClue
# 7..9. The seed is `Player.enchantmentSeed`, 0 for a player with no save
# file — which every corpus actor is — so the offers are a function of the
# item and the bookshelf count (none here) and nothing else.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:enchanting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:book"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0


