name = "slab-half-follows-the-cursor"
about = "a slab clicked high on a side face becomes a top slab and low on the same face a bottom one — SlabBlock is one of only four block classes that read the click location, against a 0.5 threshold, and nothing about the yaw or the face can stand in for it. Corrected from 'three' 2026-08-05 by a jar-wide search of every class constant pool for getClickLocation: DoorBlock, SlabBlock, StairBlock and TrapDoorBlock, plus UseOnContext which defines it and FireworkRocketItem which is not a block. DoorBlock was the one missing — it reads the click location at offset 296, against the clicked position's x, to choose the hinge"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]

# The rig is the point, and its absence is why this check was wrong from the
# day it was written until 2026-08-03.
#
# It used to click the **north face of the ground**, whose neighbour is also
# ground, so the placement was refused and nothing was ever placed. Vanilla's
# own resync said so — `[1, -1, -1] grass_block` — and this server, which
# would have got the slab right, produced exactly the same nothing. Two
# servers agreeing to do nothing is a match, and the check passed for months
# on it. The `inert` verdict is what finally caught it.
#
# A slab needs a *raised* side to be clicked on, so the block it goes into is
# air.
[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_slab"

[[step]]
do = "place"
on = [1, 0, 0]
face = "north"
cursor = [0.5, 0.9, 0.0]

[[step]]
do = "place"
on = [1, 0, 0]
face = "south"
cursor = [0.5, 0.1, 1.0]
