name = "a-crafting-table-opens-a-menu-with-no-block-entity"
about = "a crafting table opens a menu and has no block entity at all, which separates two things a client cannot tell apart — an implementation that hangs menus off block entities gets the chest and the furnace right and this one wrong, and nothing else in the corpus would notice"
observe_from = "actor"
observe = ["open_screen", "container_set_content", "block_entity_data"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
