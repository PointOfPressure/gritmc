name = "pressing-the-selected-stonecutter-button-again-sends-nothing"
about = "`StonecutterMenu.clickMenuButton` opens with `if (selectedRecipeIndex.get() == id) return false`, and `handleContainerButtonClick` broadcasts only on true — so a second press of the button already selected is answered with nothing at all; a server that re-ran `setupResultSlot` on every press would still send nothing new, so this pairs with 815, whose press does reach the broadcast"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000
measured_step = "silent"

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stonecutter"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_button_click"
button = 9

[[step]]
do = "container_button_click"
button = 9
