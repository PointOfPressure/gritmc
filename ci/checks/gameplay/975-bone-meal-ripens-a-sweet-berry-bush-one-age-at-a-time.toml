name = "bone-meal-ripens-a-sweet-berry-bush-one-age-at-a-time"
about = "bone meal on a sweet berry bush adds exactly one age per use and draws nothing — unlike a crop's 2..5 — so three uses walk it 0 -> 1 -> 2 -> 3 with a bone-meal particle event after each write, the same on every run"
observe = ["block_update", "level_event"]
settle_ms = 1500

# `SweetBerryBushBlock` (javap -p -c -constants, 26.2):
#
#   isValidBonemealTarget  age < 3
#   isBonemealSuccess      iconst_1; ireturn         — no draw
#   performBonemeal        i = Math.min(3, age + 1); setBlock(pos, AGE=i, 2)
#
# and `BoneMealItem.useOn` sends `levelEvent(1505, pos, 15)` after
# `growCrop` returns true, so each use is one `block_update` then one
# `level_event`, in that order. `growCrop` shrinks the stack outright —
# creative included — so the hand is re-filled before every use.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:sweet_berries"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"
