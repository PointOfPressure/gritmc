name = "a-second-golden-dandelion-after-the-cooldown-unlocks-the-age"
about = "a golden dandelion used again on an age-locked baby pig, once the 40-tick cooldown has run out, unlocks it: the cooldown counts down in AgeableMob.aiStep on the server too, setAgeLockedData toggles AGE_LOCKED back to false, and the next sendChanges carries the false"
observe_from = "actor"
observe = ["set_entity_data", "animate"]
within = 416
settle_ms = 1500

# THE MECHANISM, read from the pinned jar:
#
#   AgeableMob.aiStep          116-133 ageLockParticleTimer =
#                                      makeAgeLockedParticle(level, this, timer,
#                                      isAgeLocked())
#   AgeableMob.makeAgeLockedParticle
#                                0-104 timer > 0: (client: a particle) then
#                                      timer-- on EITHER side; return timer
#   AgeableMob.canUseGoldenDandelion   timer == 0
#   AgeableMob.setAgeLockedData        setAgeLocked(!isAgeLocked())
#
# The first dandelion is in the measured window (it locks: accessor 17 true),
# then 2.5 s — 50 ticks, ten past the cooldown — then the measured second
# one, which must unlock (accessor 17 false). A server whose cooldown never
# ran out on the server says nothing for the second, and one that ignored the
# cooldown entirely is `094`'s business.

# THE RIG, AND WHY IT IS OUT HERE. The pit is `083`'s: digging [1,-1] and
# [1,-2] leaves a 1x1 shaft two deep whose floor has no walkable neighbour, so
# every path a pig in it is ever given is its own node and it never moves —
# its unseeded `RandomStrollGoal` and look goals cannot reach anything this
# check observes. The rig sits +400 blocks out on z, past `083`-`089`'s
# rigs at +-80 and +-160 and alternating sign with its neighbours here (same
# sign 64 apart on x and 80 on z), so no other scenario's mob is tracked from
# it and nothing it leaves is tracked from theirs: the actor tracks to 64
# blocks at view-distance 4. `within` is opened to reach the rig; the observer
# stays at the workspace and tracks none of it, hence `observe_from = "actor"`.
# Coordinates in the steps carry the offset.

[[setup]]
do = "walk"
to = [0.0, 0.0, 400.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 401]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 401]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:pig_spawn_egg"

[[setup]]
do = "place"
on = [1, -3, 401]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, 400.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "interact"
target = "minecraft:pig"

[[setup]]
do = "hold"
item = "minecraft:golden_dandelion"

[[setup]]
do = "wait"
ms = 1500

[[step]]
do = "interact"
target = "minecraft:pig"

[[step]]
do = "wait"
ms = 2500

[[step]]
do = "interact"
target = "minecraft:pig"
