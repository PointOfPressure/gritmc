name = "placing-a-decorated-pot-creates-its-block-entity"
about = "the first block entity in this corpus that is neither a container nor a sign — `DecoratedPotBlockEntity.getUpdatePacket()` is one of the twenty overrides of a method whose base returns null, so a pot going down puts `block_entity_data` type 41 on the wire with an empty payload; a server that wrote the right block state and no block entity is silent here and the block update alone cannot tell the two apart"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:decorated_pot"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
