name = "a-lone-plain-pickaxe-in-a-grindstone-makes-nothing"
about = "one unenchanted iron pickaxe alone in a grindstone reaches `computeResult`'s single-input arm (offsets 48-109), which returns EMPTY when `hasAnyEnchantments` is false — so placing it is answered with the slot it went into and no result; a grindstone that repaired or copied a lone tool would put one in slot 2"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:grindstone"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:iron_pickaxe"
components = [{ type = "minecraft:damage", varint = 200 }]

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 0
