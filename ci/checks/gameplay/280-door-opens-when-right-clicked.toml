name = "door-opens-when-right-clicked"
about = "right-clicking a door with something unplaceable in hand toggles `open` on BOTH halves — DoorBlock.useWithoutItem, which is a whole path the corpus does not otherwise touch: an interaction that changes a block without placing or breaking one, and the first check here whose answer is two blocks changing in one tick from a single click"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:oak_door"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

# A stick is not a BlockItem, so the click falls through to the block's own
# `useWithoutItem` instead of trying to place anything.
[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [1, 0, 0]
face = "north"
