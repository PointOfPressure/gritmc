name = "a-shift-clicked-paper-goes-to-the-cartography-tables-second-slot"
about = "`CartographyTableMenu.quickMoveStack` sends paper, an empty map or a glass pane from the player's slots to `1..2` — the additional slot — and a stack carrying `MAP_ID` to slot 0, so a shift-clicked paper is answered with slot 1 holding it and its hotbar slot empty. A server with no cartography quick-move declines the click and answers nothing; one borrowing the chest's rule puts the paper in slot 0"
observe_from = "actor"
observe = ["container_set_slot"]
settle_ms = 1000

# CartographyTableMenu: map 0, additional 1, result 2, then the 36 — hotbar 0
# is 3 + 27 = 30.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:cartography_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:paper"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30
input = "quick_move"
