name = "throwing-crafted-planks-spends-the-log"
about = "a THROW on a crafting table's result goes through `Slot.safeTake`, which calls `onTake` exactly as a pickup does, so throwing the four planks out of the menu spends the log in the grid — the emptied result goes out directly from inside the take and the emptied cell after it. A server whose throw path skips `onTake` answers with the result slot alone and leaves the log to craft again"
observe_from = "actor"
observe = ["container_set_slot"]
settle_ms = 1000

# `add_entity` for the thrown stack is NOT observed: its velocity is drawn from
# the player's random, and this check is about the grid, not the throw.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
input = "throw"
button = 1
