name = "an-outposts-goat-horn-carries-its-instrument"
about = "a seeded chests/pillager_outpost chest rolls a goat horn through set_instrument, and the content packet carries minecraft:instrument as feel_goat_horn written id + 1 (ByteBufCodecs.holder); a horn that rolls ponder_goat_horn, the prototype, carries nothing, and a server that sends the item id alone sends a ponder horn"
observe_from = "actor"
observe = ["open_screen", "container_set_content", "block_event"]
settle_ms = 1000

# The lid repeats every 5 ticks while the chest is open; collapsed as in 090.
collapse_repeats = ["block_event"]

# A seeded loot chest, placed the one way a client can: `block_entity_data`
# on the held chest (see 930). `LootTableSeed` is a LONG.
#
# Seed 1: the goat horn is in slot 1 and is feel_goat_horn, not the
# prototype's ponder_goat_horn, so PatchedDataComponentMap.set keeps it.
[[setup]]
do = "hold"
item = "minecraft:chest"
components = [
    { type = "minecraft:block_entity_data", block_entity = "minecraft:chest", strings = { LootTable = "minecraft:chests/pillager_outpost" }, longs = { LootTableSeed = 1 } },
]

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

# Overwrite the component-bearing chest, so the inventory half of the content
# packet holds nothing but a stick.
[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
