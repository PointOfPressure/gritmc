name = "shift-clicking-a-stonecutter-result-sends-it-to-the-hotbars-far-end"
about = "a shift-click on the stonecutter's result is `StonecutterMenu.quickMoveStack`'s result arm: `moveItemStackTo(stack, 2, 38, true)` — REVERSED, so the two slabs land in the last free hotbar slot rather than the first free inventory slot — and then `slot.onTake`, which spends the stone and plays the take sound as a click would; a server that moved the result forwards puts the slabs in slot 2"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data", "set_cursor_item", "sound"]
settle_ms = 1000

# The sound is gated on `lastSoundTime != level.getGameTime()`, and
# `lastSoundTime` is a long field that starts at 0, so the first take of a
# fresh menu always plays it.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stonecutter"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_button_click"
button = 9

[[step]]
do = "container_click"
slot = 1
input = "quick_move"
