name = "a-redstone-block-lights-the-lamp-beside-it"
about = "`PoweredBlock` is a signal source and nothing else — 15 in every direction from `signal.json`, no tick, no state — and `RedstoneLampBlock.neighborChanged` lights the lamp beside it with flags 2 in the same tick the block is placed, with no scheduled tick on the way up"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:redstone_lamp"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:redstone_block"

[[step]]
do = "place"
on = [2, -1, 0]
face = "up"
