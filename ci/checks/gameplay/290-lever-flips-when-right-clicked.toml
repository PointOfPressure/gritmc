name = "lever-flips-when-right-clicked"
about = "right-clicking a lever toggles `powered` — `LeverBlock.useWithoutItem`, and the toggle is the whole of what this check can see. Its `about` claimed the neighbour updates as well until 2026-08-04, and that half was never testable from this rig: the lever sits on the superflat ground with nothing redstone-responsive beside it, so `updateNeighbours` reaches only blocks whose `neighborChanged` does nothing and puts no packet on the wire. Measured rather than reasoned — vanilla's actor stream here is one `sound`, three `block_update`s and an ack, and all three block updates are at the lever's own position or are `handleUseItemOn`'s forced resync at the clicked face. The neighbour half is 360's job, and 360 places a lamp to do it"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
