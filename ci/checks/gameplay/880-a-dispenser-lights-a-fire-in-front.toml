name = "a-dispenser-lights-a-fire-in-front"
about = "a flint and steel in a dispenser facing open air over grass: `DispenserBlock.getDispenseMethod` finds `FlintAndSteelDispenseItemBehavior` in the registry instead of the default drop, `BaseFireBlock.canBePlacedAt` holds (air, sturdy face below), and the tick writes `minecraft:fire` in front with `setBlockAndUpdate`; `OptionalDispenseItemBehavior.playSound` is 1000 because it succeeded, then the smoke 2000 with the facing. A server running the default behaviour instead throws the flint and steel out as an item: an `add_entity` and no fire. `settle_ms` stays under the fire's own first scheduled tick (30 + `nextInt(10)` ticks after it is placed), whose age roll is unseeded"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "level_event"]
settle_ms = 1200

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:dispenser"

[[setup]]
do = "place"
on = [3, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [4, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:flint_and_steel"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[setup]]
do = "place"
on = [3, 0, 2]
face = "up"

[[setup]]
do = "container_click"
slot = 36

[[setup]]
do = "container_click"
slot = 0

[[setup]]
do = "close_container"

[[step]]
do = "place"
on = [4, 0, 2]
face = "up"
