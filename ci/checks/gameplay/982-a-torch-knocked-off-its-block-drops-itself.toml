name = "a-torch-knocked-off-its-block-drops-itself"
about = """
A creative dig of the block under a torch. The dig itself drops nothing
(`preventsBlockDrops`), but the removal's shape cascade reaches the torch:
`Block.updateOrDestroy` turns it to air through
`level.destroyBlock(pos, (flags & 32) == 0)`, and `Level.destroyBlock`
offsets 49-81 roll `Block.dropResources(state, level, pos, be, null,
ItemStack.EMPTY)` — no player, so creative does not stop it. The torch item
is graded by what it is: its `set_entity_data` (`ItemEntity.DATA_ITEM`),
sent in the pairing bundle and again on the first tracker tick.
`add_entity` is not projected: `popResource` jitters the position from the
level's random. Three blocks out, beyond a pickup. What would make it fail:
a cascade that destroys without dropping (this server until 2026-10-01).
"""
observe_from = "actor"
observe = ["set_entity_data", "block_update", "section_blocks_update", "block_changed_ack"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:torch"

[[setup]]
do = "place"
on = [3, -1, 0]
face = "up"

[[step]]
do = "dig"
at = [3, -1, 0]
face = "up"
