name = "taking-a-smithing-result-spends-one-of-each-input"
about = "taking the netherite sword runs `SmithingMenu.onTake`: `shrinkStackInSlot` on 0, 1 and 2 in that order, each a `setItem` and so a `createResult` over what is left, then `levelEvent(1044)` — the click is answered with the level event, the three emptied inputs, the result and the cursor"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data", "set_cursor_item", "level_event"]
settle_ms = 1000

# SmithingMenu: template 0, base 1, addition 2, result 3, then the 36 —
# hotbar 0 is 4 + 27 = 31. One data slot, `hasRecipeError`, set to 0 in the
# constructor and to 1 only when all three inputs are full and nothing
# matched.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:smithing_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:netherite_upgrade_smithing_template"

[[setup]]
do = "hold"
item = "minecraft:diamond_sword"
slot = 1

[[setup]]
do = "hold"
item = "minecraft:netherite_ingot"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 31

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 33

[[step]]
do = "container_click"
slot = 2

[[step]]
do = "container_click"
slot = 3
