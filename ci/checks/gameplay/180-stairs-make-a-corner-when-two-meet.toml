name = "stairs-make-a-corner-when-two-meet"
about = "two stairs placed at right angles stop being straight — StairBlock.updateShape rewrites the first one's `shape` to an inner or outer corner when the second arrives, which is the connective half of the shape table rather than the destructive half the torch check covers"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]

[[setup]]
do = "hold"
item = "minecraft:oak_stairs"

[[step]]
do = "look"
yaw = 270.0
pitch = 0.0

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"

[[step]]
do = "look"
yaw = 180.0
pitch = 0.0

[[step]]
do = "place"
on = [2, -1, 0]
face = "up"
