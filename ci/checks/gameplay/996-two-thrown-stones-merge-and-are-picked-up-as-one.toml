name = "two-thrown-stones-merge-and-are-picked-up-as-one"
about = "two stones thrown straight down land on each other and merge (ItemEntity.mergeWithNeighbours: the smaller — on a tie, the one ticking — moves into the other and is discarded), so one remove_entities arrives before any pickup and the survivor is then taken with count 2 into one slot. A server that does not merge takes two entities of count 1"
# Which of the two survives depends on the phase of vanilla's tick against the
# recorder's, so `add_entity` — which would number the two in spawn order — is
# not observed. Normalised in order of first appearance, the absorbed id is
# always the first one seen and the survivor the second, whichever it was.
observe = ["take_item_entity", "remove_entities", "container_set_slot"]
settle_ms = 5000

[[setup]]
do = "look"
yaw = 0.0
pitch = 90.0

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "drop"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[step]]
do = "drop"
