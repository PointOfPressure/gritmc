name = "a-number-key-on-crafted-planks-spends-the-log"
about = "pressing number key 3 over a crafting table's four planks is `doClick`'s SWAP arm with an empty hotbar slot: `inventory.setItem`, `slot.setByPlayer(EMPTY)`, then `slot.onTake` at offset 1199 — so the log is spent and the emptied result goes out directly before the corrections. A server whose swap arm skips `onTake` moves the planks and leaves the log to craft again"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, then the 36 — hotbar 0 is 10 + 27 = 37.
# 800 with the take as a number key onto the empty hotbar slot 2.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 0
input = "swap"
button = 2
