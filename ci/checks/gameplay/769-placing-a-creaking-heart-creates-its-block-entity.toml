name = "placing-a-creaking-heart-creates-its-block-entity"
about = "`CreakingHeartBlockEntity` type 10, empty with no creaking bound to it — the block state carries `active` and `natural` and the block entity carries the binding, which is the split this whole item exists to measure: a check that read only the state would pass on a server that made no block entity at all"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:creaking_heart"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
