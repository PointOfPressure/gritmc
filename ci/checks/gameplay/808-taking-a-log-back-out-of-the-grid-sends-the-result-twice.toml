name = "taking-a-log-back-out-of-the-grid-sends-the-result-twice"
about = "picking the log back off grid cell 1 is `Slot.tryRemove`: `remove(1)` is `TransientCraftingContainer.removeItem`, which removed something and so recomputes and sends the result; the slot is then empty, so offsets 61-76 call `setByPlayer(EMPTY)` — a `setItem`, a second recompute, a second send. Two `container_set_slot`s for slot 0, both empty, then the cell and the cursor. A server that recomputes once per click sends one"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CraftingMenu: result 0, grid 1..9, then the 36 — hotbar 0 is 10 + 27 = 37.
# 562's three steps, then the log picked back up off the grid.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafting_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:oak_log"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 37

[[step]]
do = "container_click"
slot = 1

[[step]]
do = "container_click"
slot = 1
