name = "a-piston-retracts-when-its-power-is-dug-out"
about = "the other half of 380 — digging out the redstone block beside an extended piston queues a `TRIGGER_CONTRACT` event, whose `triggerEvent` removes the head at once with flags 3, turns the base into an invisible `moving_piston` with a `PistonMovingBlockEntity`, and lets that entity put `piston[extended=false]` back two ticks later with flags 67"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_event", "block_changed_ack"]
settle_ms = 2000

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:piston"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:redstone_block"

[[setup]]
do = "place"
on = [2, -1, 0]
face = "up"

# The extension has settled; what the step measures is only the retraction.
[[step]]
do = "dig"
at = [2, 0, 0]
face = "up"
