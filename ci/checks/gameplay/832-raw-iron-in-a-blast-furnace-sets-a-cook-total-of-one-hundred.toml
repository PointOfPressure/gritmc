name = "raw-iron-in-a-blast-furnace-sets-a-cook-total-of-one-hundred"
about = "the same click as 830 into a blast furnace: the menu's RecipeType is BLASTING and raw_iron's blasting recipe omits cookingtime, so it takes BlastingRecipe's codec default 100, and the click sends container_set_data id 3 = 100. 830 and 832 differ only in the block, so a server that read the furnace's recipe for every member of the family diverges here and nowhere else"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:blast_furnace"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:raw_iron"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 0
