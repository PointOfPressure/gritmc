name = "a-crafter-with-no-recipe-clicks"
about = "a crafter holding a single stick matches no recipe, so when its lever goes `CrafterBlock.dispenseFrom` sends `levelEvent(1050)` — the failed-craft click — and writes nothing: no `CRAFTING`, no item, no 1049/2010. The trigger itself still lands (`TRIGGERED`, flags 2, beside the lever's own update)"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "level_event"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:crafter"

[[setup]]
do = "place"
on = [3, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [4, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[setup]]
do = "place"
on = [3, 0, 2]
face = "up"

[[setup]]
do = "container_click"
slot = 36

[[setup]]
do = "container_click"
slot = 0

[[setup]]
do = "close_container"

[[step]]
do = "place"
on = [4, 0, 2]
face = "up"
