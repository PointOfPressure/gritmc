name = "a-pig-nine-blocks-away-is-still-tempted"
about = "a pig at the bottom of a two-deep pit follows, with its head, a carrot held nine blocks away: TemptGoal.canUse reads its range from the mob's own TEMPT_RANGE attribute, 10 for a pig, and the 3D distance here is 9.22 — so the head makes vanilla's one 22-degree turn as the player steps along the circle"
observe_from = "actor"
observe = ["rotate_head", "move_entity"]
within = 176
settle_ms = 1500

# The rig and the determinism argument are `083`'s — read its header first.
#
# THE RANGE. `TemptGoal.canUse` 31-41 is
# `targetingConditions.range(mob.getAttributeValue(Attributes.TEMPT_RANGE))`,
# re-evaluated through `canContinueToUse` every goal tick, and
# `TargetingConditions.test` 95-162 compares it to the 3D distance from the
# pig's feet (y -2) to the player's (y 0). Both stands are 9.00 horizontally
# from the shaft's axis, 9.22 in 3D. A server that tempts from a fixed eight
# (or never reads the attribute and uses a constant below 9.22) leaves this
# pig untempted, and an untempted pig's head is its random look goals', which
# cannot reproduce vanilla's one turn.
#
# THE TURN. Start (10.41, 2.75): head -82.01 degrees, -58.32 before the floor
# (byte -59); end (9.29, 6.00): -59.99, -42.66 (byte -43) — 22.03 degrees, one
# `rotate_head`. The step is a single 3.44-block hop, because at nine blocks a
# multi-hop walk would let the goal tick sample an intermediate stand and put a
# second, timing-dependent `rotate_head` on the wire. The target pitch is 17.6
# degrees at both stands (same radius), under the 40 clamp, so the pitch byte
# does not change and no `move_entity_rot` is sent either.
#
# It is the `navigateTowards` arm (3D 9.22 > 2.5): `move_entity` is observed and
# vanilla sends none, because the only path out of the shaft is its own node.


# THE RIG IS OUT AT z = +160, AND `within` IS OPENED TO REACH IT. See the
# FAR FIELD note in `083`'s header.
[[setup]]
do = "walk"
to = [0.0, 0.0, 160.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 161]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 161]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:pig_spawn_egg"

[[setup]]
do = "place"
on = [1, -3, 161]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:carrot"

[[setup]]
do = "walk"
to = [10.41, 0.0, 162.75]

[[setup]]
do = "wait"
ms = 1500

[[step]]
do = "walk"
to = [9.29, 0.0, 166.0]
