name = "placing-a-banner-carries-an-empty-component-map"
about = "`BannerBlockEntity` is the only new type whose `getUpdateTag` is `saveWithoutMetadata()` rather than `saveCustomOnly()`, and the difference between the two is exactly the `components` key — so a plain banner sends `{components: {}}` where a beacon beside it sends `{Levels: 0}` and a pot sends nothing at all"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:white_banner"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
