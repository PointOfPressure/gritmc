name = "slab-stacks-into-a-double-slab"
about = "a second slab clicked on top of the first does not go above it, it merges into the block that is already there — SlabBlock.canBeReplaced returns true for its own item against a BOTTOM slab clicked from UP, so the placement lands at the position that was clicked instead of the one next to it, which no rule about faces and cursors can produce"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "block_changed_ack"]

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:oak_slab"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
