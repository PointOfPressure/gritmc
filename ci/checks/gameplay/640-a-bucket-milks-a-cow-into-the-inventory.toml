name = "a-bucket-milks-a-cow-into-the-inventory"
about = "an empty bucket used on an adult cow puts a milk bucket in a creative player's inventory and leaves the bucket in hand: AbstractCow.mobInteract fills, ItemUtils.createFilledResult's creative arm adds the result only because the inventory holds none, and the slot reaches the client from the next broadcastChanges sweep"
observe_from = "actor"
observe = ["container_set_slot"]
within = 496
settle_ms = 1500

# THE MECHANISM, read from the pinned jar (`javap -p -c -constants`):
#
#   AbstractCow.mobInteract      6-20  stack.is(BUCKET) && !isBaby()
#                               23-29  player.playSound(COW_MILK, 1F, 1F) — to
#                                      everyone BUT the player (Player.playSound
#                                      is level.playSound(this, ...)), so the
#                                      actor's stream carries no sound
#                               32-40  ItemUtils.createFilledResult(stack, player,
#                                      MILK_BUCKET.getDefaultInstance())
#                               45-55  setItemInHand(hand, ...); SUCCESS (the
#                                      client swings, the server sends none)
#   ItemUtils.createFilledResult 0-36  hasInfiniteMaterials && limit (the
#                                      three-argument overload passes true):
#                                      !inventory.contains(result) ->
#                                      inventory.add(result); return stack
#   Inventory.add                      no packet; ServerPlayer.doTick's
#                                      containerMenu.broadcastChanges() sends
#                                      container_set_slot for the free slot it
#                                      filled
#
# What a client sees is one container_set_slot naming a milk bucket in the
# first free slot. Which slot that is depends on what the session's earlier
# checks left behind, the same on both servers.
#
# THE RIG. `083`'s pit: digging [1,-1] and [1,-2] leaves a 1x1 shaft two deep
# whose floor has no walkable neighbour, so the mob hatched at its bottom never
# moves — its unseeded stroll and look goals reach nothing observed here. The
# rig sits +480 blocks out on z, perpendicular to the line the workspaces are
# laid along (`-(n+1) * 32` on x), alternating sign with its neighbours in this
# block and 80 further out every pair (640/641 at +-480 ... 652/653 at +-960),
# so the nearest same-side rig is 64 blocks away on x and 80 on z: nothing it
# leaves is tracked from another scenario and nothing another leaves is
# tracked from it — the actor tracks to 64 blocks at view-distance 4. The mob is SILENT
# (`minecraft:entity_data` `Silent` on the egg, applied by
# `EntityType.updateCustomEntityTag` through `Entity.load`), because
# `Mob.baseTick`'s ambient roll (`nextInt(1000) < ambientSoundTime++`, unseeded)
# can land in any window; `Entity.playSound` refuses every sound of a silent
# entity and the roll still happens, so its random stream is unchanged.

[[setup]]
do = "walk"
to = [0.0, 0.0, 480.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 481]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 481]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:cow_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:cow", silent = true }]

[[setup]]
do = "place"
on = [1, -3, 481]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, 480.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:bucket"

[[step]]
do = "interact"
target = "minecraft:cow"
