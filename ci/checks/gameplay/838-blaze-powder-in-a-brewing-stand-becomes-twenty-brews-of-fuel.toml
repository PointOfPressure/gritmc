name = "blaze-powder-in-a-brewing-stand-becomes-twenty-brews-of-fuel"
about = "blaze powder into an open brewing stand's fuel slot (menu slot 4). The next BrewingStandBlockEntity.serverTick finds fuel <= 0 and the stack in ItemTags.BREWING_FUEL, sets fuel to 20 and shrinks the stack (offsets 13-46) — with no bottles there is nothing to brew, so the 20 stays. The tick after, broadcastChanges sends the emptied slot 4 and container_set_data id 1 = 20, BrewingStandBlockEntity$1.get(1) being fuel. A server whose stand does not tick keeps the powder in the slot and sends no data"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data"]
settle_ms = 1500

# A brewing stand's menu is five container slots — three bottles, the
# ingredient, the fuel — then the player's 36, so hotbar 0 is menu slot 32.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:brewing_stand"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:blaze_powder"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 4
