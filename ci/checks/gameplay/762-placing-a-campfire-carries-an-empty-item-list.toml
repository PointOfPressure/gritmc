name = "placing-a-campfire-carries-an-empty-item-list"
about = "a campfire's update tag is `ContainerHelper.saveAllItems(out, items, true)` over four slots, and the `true` means the `Items` key is written even when every slot is empty — so the payload is `{Items: []}` and not the empty compound five other new types send, which is what stops one hard-coded tag passing all of them"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:campfire"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
