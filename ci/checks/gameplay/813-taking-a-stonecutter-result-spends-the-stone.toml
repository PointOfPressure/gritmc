name = "taking-a-stonecutter-result-spends-the-stone"
about = "taking the two slabs out of a stonecutter runs `StonecutterMenu$2.onTake`: `inputSlot.remove(1)` empties the input, whose `slotsChanged` resets `selectedRecipeIndex` to -1 and the result to EMPTY, and `UI_STONECUTTER_TAKE_RESULT` plays at the block at volume 1 and pitch 1 — nothing random — so the click is answered with the sound, both slots, the cursor and the data slot; a server that only moved the result onto the cursor leaves the stone and the selection behind"
observe_from = "actor"
observe = ["container_set_slot", "container_set_data", "set_cursor_item", "sound"]
settle_ms = 1000

# The sound is gated on `lastSoundTime != level.getGameTime()`, and
# `lastSoundTime` is a long field that starts at 0, so the first take of a
# fresh menu always plays it.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stonecutter"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_button_click"
button = 9

[[step]]
do = "container_click"
slot = 1
