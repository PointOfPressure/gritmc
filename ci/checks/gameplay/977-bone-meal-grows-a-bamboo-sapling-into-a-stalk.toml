name = "bone-meal-grows-a-bamboo-sapling-into-a-stalk"
about = "bone meal on a bamboo sapling puts a small-leaved bamboo above it, and the sapling turns itself into the stalk's foot because its own `updateShape` sees bamboo arriving from above — one use, no draw, two blocks changed"
observe = ["block_update", "section_blocks_update", "level_event"]
settle_ms = 1500

# `BambooSaplingBlock` (javap -p -c -constants, 26.2):
#
#   isValidBonemealTarget  above.isAir() && isInsideBuildHeight(above)
#   isBonemealSuccess      iconst_1
#   performBonemeal        growBamboo: setBlock(above, BAMBOO[leaves=small], 3)
#   updateShape            17-42: direction == UP && neighbour is BAMBOO
#                                 -> BAMBOO.defaultBlockState()
#
# The write at `above` carries flags 3, so its shape update reaches the
# sapling below in the same call, and both positions change in one tick.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:bamboo"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"
