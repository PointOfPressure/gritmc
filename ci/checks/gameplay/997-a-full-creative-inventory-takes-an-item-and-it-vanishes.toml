name = "a-full-creative-inventory-takes-an-item-and-it-vanishes"
about = "a stone is thrown, and before its pickup delay runs out the slot it left is filled, so all 36 slots hold something else. Inventory.add moves nothing — and for a player with infinite materials its tail sets the stack to 0 and answers true: the stone is taken (take_item_entity, count 1) and removed, and no slot changes. A survival-only Inventory.add leaves it on the floor; a server with no pickup says nothing"
# The 35 other slots are filled before the throw so that only one hold has to
# land inside the 40-tick delay. Hotbar holds go by hotbar index; the main
# inventory is reached with a negative `slot` (`36 + slot` is the menu slot,
# so -27..-1 is 9..35).
observe = ["take_item_entity", "remove_entities", "container_set_slot"]
settle_ms = 4000

[[setup]]
do = "look"
yaw = 0.0
pitch = 90.0

[[setup]]
do = "hold"
item = "minecraft:dirt"
slot = -27

