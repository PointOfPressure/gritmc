name = "bone-meal-grows-a-pitcher-crop-into-two-halves"
about = "bone meal on a pitcher crop adds one age per use with no draw, and the use that reaches age 3 also writes an upper half above it — `PitcherCropBlock.grow` sets the lower half with flags 2 and then the upper with flags 3, so three uses on a pod give three ages and one new block"
observe = ["block_update", "section_blocks_update", "level_event"]
settle_ms = 1500

# `PitcherCropBlock` (javap -p -c -constants, 26.2):
#
#   isValidBonemealTarget  canGrow(lower, lowerState, lowerAge + 1)
#   isBonemealSuccess      iconst_1
#   performBonemeal        grow(level, lowerState, lowerPos, 1)
#   grow                   i = min(age + 1, 4); canGrow(...) else return
#                          setBlock(pos, AGE=i, 2)
#                          if isDouble(i) (i >= 3): setBlock(above, AGE=i,HALF=upper, 3)
#   canGrow                !isMaxAge && sufficientLight (raw >= 8)
#                          && insideBuildHeight(above)
#                          && (!isDouble(age) || above is air or pitcher_crop)

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:iron_hoe"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:pitcher_pod"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"

[[step]]
do = "hold"
item = "minecraft:bone_meal"

[[step]]
do = "place"
on = [1, 0, 1]
face = "up"
