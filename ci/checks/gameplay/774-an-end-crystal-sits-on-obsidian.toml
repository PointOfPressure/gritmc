name = "an-end-crystal-sits-on-obsidian"
about = "an end crystal is placed only on obsidian or bedrock, and lands one block above the face that was clicked"
observe = ["add_entity", "set_entity_data", "block_update", "section_blocks_update"]
settle_ms = 1500

# `EndCrystalItem.useOn` has no random draw of any kind — `javap` on the whole
# class finds `EnderDragonFight.tryRespawn` and `Level.addFreshEntity` and
# nothing else — and `EndCrystal` is not a `LivingEntity`, so its
# `add_entity.y_head_rot` is `Entity.getYHeadRot`'s compile-time zero. See
# 773's header.
#
# The obsidian is scaffolding and is placed in setup: vanilla's superflat has
# none, and `EndCrystalItem` refuses every other block. What the measured step
# pins is that the refusal has an exception and where the crystal lands.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:obsidian"

[[setup]]
do = "place"
on = [1, -1, -1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:end_crystal"

[[step]]
do = "place"
on = [1, 0, -1]
face = "up"
