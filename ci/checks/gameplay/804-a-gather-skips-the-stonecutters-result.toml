name = "a-gather-skips-the-stonecutters-result"
about = "`StonecutterMenu.canTakeItemForPickAll` refuses its result container, so a double-click with a stone slab on the cursor gathers the slab in the hotbar and leaves the two the stonecutter offers: the far hotbar slot empties and the cursor grows to two, and slot 1 and the input are not touched. A server that sweeps every slot reaches the result first — it is slot 1 and the sweep ascends — takes both slabs through `onTake`, spends the stone and answers with the result, the input and a cursor of four"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# StonecutterMenu: input 0, result 1, then the 36 — hotbar k is 29 + k.
# Button 9 is two stone slabs, as in 811.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:stonecutter"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stone_slab"
slot = 2

[[setup]]
do = "hold"
item = "minecraft:stone_slab"
slot = 3

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 29

[[step]]
do = "container_click"
slot = 0

[[step]]
do = "container_button_click"
button = 9

[[step]]
do = "container_click"
slot = 31

[[step]]
do = "container_click"
slot = 31
input = "pickup_all"
