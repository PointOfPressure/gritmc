name = "placing-suspicious-sand-creates-a-brushable-block-entity"
about = "`BrushableBlockEntity` type 40 — a block entity whose whole purpose is to hold an item nobody has brushed out yet, so a freshly placed one is empty and still announces itself; the block is one of two that map to the type and neither is reachable by any other check"
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:suspicious_sand"

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
