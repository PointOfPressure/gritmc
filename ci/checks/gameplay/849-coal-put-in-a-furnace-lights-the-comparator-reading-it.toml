name = "coal-put-in-a-furnace-lights-the-comparator-reading-it"
about = "one coal clicked into the fuel slot of an empty furnace behind a comparator. With nothing to smelt the furnace does not light and its ticker writes nothing, so the only setChanged is the click's: Slot.setChanged -> AbstractFurnaceBlockEntity -> Level.updateNeighbourForOutputSignal. The comparator reads lerpDiscrete(1/64/3) = 1 and lights the dust at power 1; a server whose menu writes never reach the comparator leaves it dark"
observe_from = "actor"
observe = ["block_update", "section_blocks_update"]
settle_ms = 2000

# The 456 layout: facing south, the comparator at (1, 0, 0) faces NORTH, so
# what it reads stands behind it at (1, 0, -1) and the dust it lights is in
# front at (1, 0, 1). The container is placed empty, so its own placement —
# a `Level.setBlock` with an analog state, which already reached the
# comparator through `updateNeighbourForOutputSignal` — reads 0 and books
# nothing. Only the step below can light the dust.
# A furnace menu is its three slots (input, fuel, result) and then the
# player's 36, so hotbar 0 is menu slot 30 and the fuel slot is 1.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:comparator"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:redstone"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:furnace"

[[setup]]
do = "place"
on = [1, -1, -1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:coal"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, -1]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 1
