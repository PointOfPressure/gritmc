name = "a-lead-used-on-a-pig-ties-it-to-the-player"
about = "a lead used on a pig ties it to the player: Mob.interact passes the lead through checkAndHandleImportantInteractions to Entity.interact, whose lead branch finds no holder and a pig within the twelve-block snap distance, setLeashedTo sends ClientboundSetEntityLinkPacket(pig, player) to the pig's trackers, and SUCCESS_SERVER swings the player's arm"
observe_from = "actor"
observe = ["set_entity_link", "animate"]
within = 256
settle_ms = 1500

# THE MECHANISM, read from the pinned jar:
#
#   Mob.interact                40-59  super.interact (Entity's; LivingEntity
#                                      does not override it) != PASS -> return
#   Entity.interact            388-486 LEAD in hand && !(getLeashHolder()
#                                      instanceof Player) && canHaveALeashAttachedTo
#                                      (player) -> setLeashedTo(player, true);
#                                      playSound(LEAD_TIED); shrink(1);
#                                      SUCCESS_SERVER
#   Leashable.canHaveALeashAttachedTo 0-32  not itself, leashDistanceTo <= 12
#                                      (box centre to box centre), canBeLeashed
#                                      (Mob: not an Enemy)
#   Leashable.setLeashedTo(E,h,b) 0-121 new LeashData(h); broadcast ->
#                                      sendToTrackingPlayers(set_entity_link)
#   ClientboundSetEntityLinkPacket.write  writeInt(pig), writeInt(player)
#
# So the actor sees `set_entity_link {pig -> player}` and then `animate 0`.
# The tie sound is not observed: it plays at the pig, among the pig's own
# ambient sounds on its unseeded random. While the player stands 1.2 blocks
# away the lead is inside every elastic band, so
# `closeRangeLeashBehaviour` only asks the pinned pig to path, and nothing
# moves.

# THE RIG, AND WHY IT IS OUT HERE. The pit is `083`'s: digging [1,-1] and
# [1,-2] leaves a 1x1 shaft two deep whose floor has no walkable neighbour, so
# every path a pig in it is ever given is its own node and it never moves —
# its unseeded `RandomStrollGoal` and look goals cannot reach anything this
# check observes. The rig sits +240 blocks out on z, past `083`-`089`'s
# rigs at +-80 and +-160 and alternating sign with its neighbours here (same
# sign 64 apart on x and 80 on z), so no other scenario's mob is tracked from
# it and nothing it leaves is tracked from theirs: the actor tracks to 64
# blocks at view-distance 4. `within` is opened to reach the rig; the observer
# stays at the workspace and tracks none of it, hence `observe_from = "actor"`.
# Coordinates in the steps carry the offset.

[[setup]]
do = "walk"
to = [0.0, 0.0, 240.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 241]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 241]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:pig_spawn_egg"

[[setup]]
do = "place"
on = [1, -3, 241]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lead"

[[setup]]
do = "walk"
to = [0.45, 0.0, 240.95]

[[setup]]
do = "wait"
ms = 1500

[[step]]
do = "interact"
target = "minecraft:pig"
