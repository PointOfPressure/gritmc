name = "water-poured-between-lava-makes-obsidian-on-one-side-and-cobblestone-on-the-other"
about = "water poured into the middle of a lava-filled trench turns the lava SOURCE beside it to obsidian and the FLOWING lava beside it to cobblestone, each with a fizz, in neighbour-update order — LiquidBlock.neighborChanged -> shouldSpreadLiquid reached from Level.updateNeighborsAt (WEST, EAST, DOWN, UP, NORTH, SOUTH)"
observe = ["block_update", "section_blocks_update", "block_changed_ack", "level_event", "sound"]
settle_ms = 2000
# # The rig
#
# Three cells dug at dx = 1, dz = 0..2. Lava is poured into dz = 0 in setup
# and given 6 s: it reaches dz = 1 at level 2 after 30 ticks and dz = 2 at
# level 4 after 60, and the last tick that can change anything is at 90
# (4.5 s) — dz = 2's own, which finds grass beyond it. The step pours WATER aimed
# at dz = 1 (yaw -45, pitch 46, the floor of column (1, 1)); `Fluid.NONE`
# passes through the lava, the lava is replaceable, and a water source is
# written there.
#
# Its `updateNeighborsAt` then visits NORTH before SOUTH: the lava source at
# dz = 0 becomes OBSIDIAN and the flowing lava at dz = 2 becomes COBBLESTONE
# — `shouldSpreadLiquid` reads `isSource()` of the LAVA, not of the water —
# and the two fizzes go out in that order, ahead of the coalesced section
# update carrying all three cells.

[[setup]]
do = "dig"
at = [1, -1, 0]
face = "up"

[[setup]]
do = "dig"
at = [1, -1, 1]
face = "up"

[[setup]]
do = "dig"
at = [1, -1, 2]
face = "up"

[[setup]]
do = "look"
yaw = -74.5
pitch = 54.5

[[setup]]
do = "hold"
item = "minecraft:lava_bucket"

[[setup]]
do = "use_item"

[[setup]]
do = "wait"
ms = 6000

[[setup]]
do = "look"
yaw = -45.0
pitch = 46.0

[[setup]]
do = "hold"
item = "minecraft:water_bucket"

[[step]]
do = "use_item"
