name = "a-lectern-with-a-book-opens-a-menu-with-no-inventory"
about = "a lectern that has been given a book opens `MenuType.LECTERN`, the one menu in the registry whose menu does not add the player's own 36 slots at all -- LecternMenu has a single book slot -- so its content packet is a different length from every other menu here, and the menu only opens when LecternBlock's HAS_BOOK is true, which the step before it sets"
observe_from = "actor"
observe = ["open_screen", "container_set_content"]
settle_ms = 1500

# `open_screen` decodes the `minecraft:menu` **registry id** as its own field
# and digests the rest of the body, which is the menu's title component. The
# `container_set_content` that `initMenu` sends immediately after it digests
# the whole slot list. So this check pins three independent things about the
# menu — which registry entry, which title, and how many slots — and a server
# that answered with a chest here would miss on all three.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:lectern"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

# `LecternBlock.useItemOn` takes the `tryPlaceBook` arm for anything in
# `#minecraft:lectern_books`, which the jar's own datapack gives as exactly
# `written_book` and `writable_book`. Without this step the block's
# `useWithoutItem` returns CONSUME at its first branch and no menu opens at
# all.
[[setup]]
do = "hold"
item = "minecraft:writable_book"
slot = 1

[[setup]]
do = "place"
on = [1, 0, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 2

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
