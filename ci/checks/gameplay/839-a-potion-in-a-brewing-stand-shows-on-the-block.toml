name = "a-potion-in-a-brewing-stand-shows-on-the-block"
about = "a potion into the first bottle slot of an open brewing stand. serverTick's getPotionBits now differs from lastPotionCount, so it writes has_bottle_0=true with setBlock(pos, state, 2) (offsets 220-302) — flag 2 sends to clients without a neighbour update — and the next tick's block broadcast carries it. The stand has no fuel and no ingredient, so that block_update is the whole effect. A server whose stand does not tick shows an empty stand with a potion in it"
observe_from = "actor"
observe = ["container_set_slot", "block_update"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:brewing_stand"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:potion"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 32

[[step]]
do = "container_click"
slot = 0
