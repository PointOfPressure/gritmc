name = "a-shipwreck-stew-carries-its-effect-in-ticks"
about = "a seeded chests/shipwreck_supply chest rolls a suspicious stew through set_stew_effect, and the content packet carries minecraft:suspicious_stew_effects with blindness for 7 seconds written as 140 ticks — SetStewEffectFunction multiplies by 20 for every effect that is not instantaneous; it also carries two enchanted leather armour pieces"
observe_from = "actor"
observe = ["open_screen", "container_set_content", "block_event"]
settle_ms = 1000

# The lid repeats every 5 ticks while the chest is open; collapsed as in 090.
collapse_repeats = ["block_event"]

# A seeded loot chest, placed the one way a client can: `block_entity_data`
# on the held chest (see 930). `LootTableSeed` is a LONG.
#
# Seed 2: leather leggings (binding curse) in slot 16, a leather helmet (blast
# protection III) in 18, and the stew in 21 — blindness, a 7 drawn from the
# table's 7..10 uniform, times 20.
[[setup]]
do = "hold"
item = "minecraft:chest"
components = [
    { type = "minecraft:block_entity_data", block_entity = "minecraft:chest", strings = { LootTable = "minecraft:chests/shipwreck_supply" }, longs = { LootTableSeed = 2 } },
]

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

# Overwrite the component-bearing chest, so the inventory half of the content
# packet holds nothing but a stick.
[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
