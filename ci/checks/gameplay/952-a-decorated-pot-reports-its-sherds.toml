name = "a-decorated-pot-reports-its-sherds"
about = "760's decorated pot, placed from a stack carrying minecraft:pot_decorations [angler sherd, brick, prize sherd] (back, left, right; front absent). DecoratedPotBlockEntity.applyImplicitComponents (offsets 7-21) takes them, PotDecorations' list constructor reads a brick or a missing position as a plain face, and saveAdditional (6-28) stores `sherds` as ordered() — four names, minecraft:brick for each plain face — which getUpdateTag (saveCustomOnly) sends on placement where 760 sends an empty payload. What would make this fail: a pot that ignores the stack's decorations, or one that writes only the listed three, or drops the brick placeholders."
observe_from = "actor"
observe = [
    "block_entity_data",
    "block_update",
    "section_blocks_update",
    "block_changed_ack",
]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:decorated_pot"
components = [{ type = "minecraft:pot_decorations", sherds = ["minecraft:angler_pottery_sherd", "minecraft:brick", "minecraft:prize_pottery_sherd"] }]

[[step]]
do = "place"
on = [1, -1, 0]
face = "up"
