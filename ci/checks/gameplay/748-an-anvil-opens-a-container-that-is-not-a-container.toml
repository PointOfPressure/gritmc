name = "an-anvil-opens-a-container-that-is-not-a-container"
about = "an anvil opens `MenuType.ANVIL` through a SimpleMenuProvider with no block entity behind it, like the crafting table of check 480 and unlike the chest and the furnace; its menu is an ItemCombinerMenu with a result slot and a cost data slot, so a server that opens crafting for every block-entity-less provider fails on the type"
observe_from = "actor"
observe = ["open_screen", "container_set_content"]
settle_ms = 1500

# `open_screen` decodes the `minecraft:menu` **registry id** as its own field
# and digests the rest of the body, which is the menu's title component. The
# `container_set_content` that `initMenu` sends immediately after it digests
# the whole slot list. So this check pins three independent things about the
# menu — which registry entry, which title, and how many slots — and a server
# that answered with a chest here would miss on all three.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:anvil"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"
