name = "a-comparator-reads-a-hopper"
about = "a stone clicked into a chest above an empty hopper that a comparator reads. The hopper pulls the stone (suckInItems) and keeps it — it faces DOWN into dirt, which is no container — and its setChanged asks the comparator, which reads HopperBlock.getAnalogOutputSignal = getRedstoneSignalFromBlockEntity over five slots, lerpDiscrete(1/64/5) = 1, and lights the dust in front at power 1. Two things must hold — the hopper must answer its contents rather than the refused 0, and its ticker's setChanged must reach the comparator — and either missing leaves the dust dark"
observe_from = "actor"
observe = ["block_update", "section_blocks_update"]
settle_ms = 3000

# First written as a click into an OPEN HOPPER, and this server opens no
# hopper menu (741 is `absent`): the 2026-10-01 subset errored it on the
# subject, and the reconnect cost the next three scenarios their walks. The
# stone now enters through a chest above the hopper, whose menu this server
# opens; a 3-row chest menu is 27 slots then 36, so hotbar 0 is menu slot 54.
# Each block on top of a container goes down with a sneak, because a plain
# right-click would open the container below instead.
#
# Facing south, the comparator at (1, 0, 0) faces NORTH, reads (1, 0, -1)
# and lights the dust at (1, 0, 1).

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:comparator"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:redstone"

[[setup]]
do = "place"
on = [1, -1, 1]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:hopper"

[[setup]]
do = "place"
on = [1, -1, -1]
face = "up"

[[setup]]
do = "sneak"
on = true

[[setup]]
do = "hold"
item = "minecraft:chest"

[[setup]]
do = "place"
on = [1, 0, -1]
face = "up"

[[setup]]
do = "sneak"
on = false

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 1

[[step]]
do = "place"
on = [1, 1, -1]
face = "up"

[[step]]
do = "container_click"
slot = 54

[[step]]
do = "container_click"
slot = 0
