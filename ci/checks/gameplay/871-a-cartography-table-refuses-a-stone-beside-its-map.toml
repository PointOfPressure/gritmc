name = "a-cartography-table-refuses-a-stone-beside-its-map"
about = "the same click as 870 carrying a stone: `CartographyTableMenu$4.mayPlace` refuses it, `safeInsert` moves nothing, and the click is answered only with the cursor, re-sent because the harness claims an empty one — a table whose slots took anything would answer as 870 does"
observe_from = "actor"
observe = ["container_set_slot", "set_cursor_item"]
settle_ms = 1000

# CartographyTableMenu: map 0, additional 1, result 2, then the 36 — hotbar 0
# is 3 + 27 = 30.

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:cartography_table"

[[setup]]
do = "place"
on = [1, -1, 0]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stone"

[[setup]]
do = "hold"
item = "minecraft:stick"
slot = 8

[[step]]
do = "place"
on = [1, 0, 0]
face = "up"

[[step]]
do = "container_click"
slot = 30

[[step]]
do = "container_click"
slot = 1
