name = "an-empty-dispenser-clicks"
about = "a lever beside an empty dispenser: the same `TRIGGERED` write and four-tick schedule as a loaded one, and then `DispenserBlock.dispenseFrom`'s `getRandomSlot` returns -1 and the dispenser sends `levelEvent(1001)` — the dry click — and nothing else. A server with no dispenser tick is silent after the trigger; one that ran the default behaviour on an empty slot would add a 1000 and a 2000 here"
observe_from = "actor"
observe = ["block_update", "section_blocks_update", "level_event"]
settle_ms = 1500

[[setup]]
do = "look"
yaw = 0.0
pitch = 0.0

[[setup]]
do = "hold"
item = "minecraft:dispenser"

[[setup]]
do = "place"
on = [3, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:lever"

[[setup]]
do = "place"
on = [4, -1, 2]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:stick"

[[step]]
do = "place"
on = [4, 0, 2]
face = "up"
