name = "a-sheared-sheep-cannot-be-sheared-again"
about = "shears on a sheep that is already sheared do nothing a client is told: readyForShearing is false, Sheep.mobInteract answers CONSUME, and no sound, wool or data follows"
observe_from = "actor"
observe = ["sound", "add_entity", "animate"]
within = 736
settle_ms = 1500
measured_step = "silent"

# THE MECHANISM: `Sheep.readyForShearing` (0-19: `!isSheared() && !isBaby()`)
# reads the bit `setSheared(true)` wrote in setup, and `Sheep.mobInteract` 76-79
# returns CONSUME — a success whose swing source is NONE, so not even the
# server's animate. The setup's shear (whose loot, sound and data land in the
# discarded setup recording) makes the sheep sheared; the measured step must
# be silent on all three kinds. A server that ignored the bit would shear
# again, sound and drop wool; one that answered SUCCESS_SERVER would swing.
# set_entity_data is not observed: the setup's wool items are still merging
# (`ItemEntity.tick`, see `645`) and their DATA_ITEM counts would ride it.
#
# THE RIG. `083`'s pit: digging [1,-1] and [1,-2] leaves a 1x1 shaft two deep
# whose floor has no walkable neighbour, so the mob hatched at its bottom never
# moves — its unseeded stroll and look goals reach nothing observed here. The
# rig sits +720 blocks out on z, perpendicular to the line the workspaces are
# laid along (`-(n+1) * 32` on x), alternating sign with its neighbours in this
# block and 80 further out every pair (640/641 at +-480 ... 652/653 at +-960),
# so the nearest same-side rig is 64 blocks away on x and 80 on z: nothing it
# leaves is tracked from another scenario and nothing another leaves is
# tracked from it — the actor tracks to 64 blocks at view-distance 4. The mob is SILENT
# (`minecraft:entity_data` `Silent` on the egg, applied by
# `EntityType.updateCustomEntityTag` through `Entity.load`), because
# `Mob.baseTick`'s ambient roll (`nextInt(1000) < ambientSoundTime++`, unseeded)
# can land in any window; `Entity.playSound` refuses every sound of a silent
# entity and the roll still happens, so its random stream is unchanged.

[[setup]]
do = "walk"
to = [0.0, 0.0, 720.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, 721]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, 721]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:sheep_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:sheep", silent = true }]

[[setup]]
do = "place"
on = [1, -3, 721]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, 720.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:shears"

[[setup]]
do = "interact"
target = "minecraft:sheep"

[[setup]]
do = "wait"
ms = 1500

[[step]]
do = "interact"
target = "minecraft:sheep"
