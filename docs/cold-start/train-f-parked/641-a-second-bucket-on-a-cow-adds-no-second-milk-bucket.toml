name = "a-second-bucket-on-a-cow-adds-no-second-milk-bucket"
about = "with a milk bucket already in a creative player's inventory, milking again changes nothing a client is told: createFilledResult's creative arm finds the inventory already contains one and returns the bucket untouched"
observe_from = "actor"
observe = ["container_set_slot"]
within = 496
settle_ms = 1500
measured_step = "silent"

# THE MECHANISM: `ItemUtils.createFilledResult` 15-36 — `inventory.contains(
# result)` is tested before `inventory.add`, so the second milking in one session
# adds nothing and the hand is unchanged. The setup milks once (which may or
# may not add, depending on what earlier checks left; either way a milk bucket
# is now in the inventory) and the measured step milks again: silence is the
# assertion, and a server that adds a stack per click fails it.
#
# THE RIG. `083`'s pit: digging [1,-1] and [1,-2] leaves a 1x1 shaft two deep
# whose floor has no walkable neighbour, so the mob hatched at its bottom never
# moves — its unseeded stroll and look goals reach nothing observed here. The
# rig sits -480 blocks out on z, perpendicular to the line the workspaces are
# laid along (`-(n+1) * 32` on x), alternating sign with its neighbours in this
# block and 80 further out every pair (640/641 at +-480 ... 652/653 at +-960),
# so the nearest same-side rig is 64 blocks away on x and 80 on z: nothing it
# leaves is tracked from another scenario and nothing another leaves is
# tracked from it — the actor tracks to 64 blocks at view-distance 4. The mob is SILENT
# (`minecraft:entity_data` `Silent` on the egg, applied by
# `EntityType.updateCustomEntityTag` through `Entity.load`), because
# `Mob.baseTick`'s ambient roll (`nextInt(1000) < ambientSoundTime++`, unseeded)
# can land in any window; `Entity.playSound` refuses every sound of a silent
# entity and the roll still happens, so its random stream is unchanged.

[[setup]]
do = "walk"
to = [0.0, 0.0, -480.0]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "dig"
at = [1, -1, -481]
face = "up"

[[setup]]
do = "dig"
at = [1, -2, -481]
face = "up"

[[setup]]
do = "hold"
item = "minecraft:cow_spawn_egg"
components = [{ type = "minecraft:entity_data", entity = "minecraft:cow", silent = true }]

[[setup]]
do = "place"
on = [1, -3, -481]
face = "up"

[[setup]]
do = "walk"
to = [0.45, 0.0, -480.95]

[[setup]]
do = "wait"
ms = 1000

[[setup]]
do = "hold"
item = "minecraft:bucket"

[[setup]]
do = "interact"
target = "minecraft:cow"

[[setup]]
do = "wait"
ms = 500

[[step]]
do = "interact"
target = "minecraft:cow"
